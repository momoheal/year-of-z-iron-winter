<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#20272a">
<title>最后一份配给 · Z年纪事：凛冬铁轨</title>
<style>
  :root {
    color-scheme: dark;
    --coal: #20272a;
    --deep: #141a1c;
    --cream: #f5e4b9;
    --paper: #e2dac6;
    --ink: #252a29;
    --red: #a12e22;
    --line: #a39a87;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--deep); color: var(--paper); }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid #bc4f37; outline-offset: 4px; }
  [hidden] { display: none !important; }
  .shell { width: min(1440px, 100%); margin: auto; padding: clamp(16px, 3.8vw, 60px); }
  .mast, .foot { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  .mast { margin-bottom: 16px; font-size: 13px; letter-spacing: .12em; }
  .brand { font-weight: 700; }
  .mast span:last-child, .foot { color: #bdb9ac; }
  .stage { display: grid; grid-template-columns: minmax(0, 1.78fr) minmax(320px, 1fr); border: 1px solid #55574c; }
  .visual { position: relative; isolation: isolate; min-height: 560px; background: #682119; color: var(--cream); overflow: hidden; }
  .visual img { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; }
  .poster-art { object-position: 62% center; }
  .poster { height: 100%; min-height: inherit; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(22px, 4vw, 56px); }
  .poster::before, .room::before { content: ""; position: absolute; inset: 0; z-index: -1; }
  .poster::before { background: linear-gradient(90deg, #48180c99, transparent 78%), linear-gradient(0deg, #3b170b9c, transparent 24%); }
  .print-line, .scene-tag { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .15em; }
  .slogan { margin: 22px 0; font-size: clamp(36px, 4.8vw, 76px); line-height: 1.13; font-weight: 900; letter-spacing: -.06em; text-shadow: 2px 2px #391c15; }
  .poster-footer { margin: 0; width: fit-content; border-top: 2px solid; padding-top: 10px; font-size: 14px; }
  .room { height: 100%; min-height: inherit; display: flex; flex-direction: column; justify-content: flex-end; padding: clamp(22px, 4vw, 48px); }
  .room::before { background: linear-gradient(0deg, #101719 0%, #101719c7 18%, transparent 56%); }
  .room img { object-position: 46% center; }
  .room p { margin-bottom: 0; max-width: 32ch; line-height: 1.65; }
  .room h2 { font-size: clamp(24px, 3.6vw, 44px); margin: 8px 0 0; }
  .room .scene-tag { color: #e6c595; }
  .docket { background: var(--paper); color: var(--ink); padding: clamp(22px, 3vw, 42px); }
  .docket > section { min-height: 100%; display: flex; flex-direction: column; align-items: stretch; }
  .code { margin: 0; padding-bottom: 12px; border-bottom: 1px solid var(--line); font-size: 13px; letter-spacing: .1em; }
  h1, .docket h2 { margin: 22px 0 10px; font-size: clamp(28px, 3.2vw, 44px); line-height: 1.13; letter-spacing: -.035em; }
  .copy { line-height: 1.75; margin: 0 0 18px; }
  .ledger { margin: 0 0 19px; border-block: 2px solid var(--ink); }
  .ledger div { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 9px 0; }
  .ledger div + div { border-top: 1px solid var(--line); }
  .ledger dt { font-size: 13px; }
  .ledger dd { margin: 0; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .alert, .stamp { color: #85251c; }
  .stamp { border: 3px double currentColor; padding: 5px 12px; font-weight: 800; align-self: flex-start; margin: 0 0 15px; }
  .primary { margin-top: auto; width: 100%; border: 1px solid #712218; background: var(--red); color: #fff2d7; padding: 14px 16px; text-align: left; font-weight: 700; }
  .primary:hover { background: #86251c; }
  .options { display: grid; gap: 8px; }
  .option { border: 1px solid #7d7768; background: transparent; color: inherit; text-align: left; padding: 9px 12px; }
  .option:hover { background: #cfc3a9; border-color: var(--ink); }
  .option strong, .option small { display: block; }
  .option small { margin-top: 4px; line-height: 1.45; }
  .foot { margin-top: 14px; font-size: 12px; }
  @media (max-width: 760px) {
    .stage { grid-template-columns: minmax(0, 1fr); }
    .visual { min-height: clamp(260px, 64vw, 435px); }
    .poster-art { object-position: center; }
    .slogan { font-size: clamp(34px, 7vw, 58px); }
    .mast { letter-spacing: 0; }
  }
</style>
</head>
<body>
<main class="shell">
  <header class="mast"><span class="brand">Z年纪事：凛冬铁轨</span><span>诺沃斯克-17</span></header>
  <div class="stage">
    <div class="visual">
      <section class="poster" id="poster" aria-label="配给委员会宣传画">
        <img class="poster-art" src="../godot_project/art/30_props/PRP_Poster_WinterRations.webp" alt="">
        <p class="print-line">区配给委员会 · 冬季供给</p>
        <p class="slogan">每一户，<br>都有热面包。</p>
        <p class="poster-footer">凭冬季配给证领取</p>
      </section>
      <section class="room" id="room" aria-label="东街工人食堂" hidden>
        <img src="../godot_project/art/60_ui/cg/cg_canteen_scene.jpg" alt="食堂后厨，窗玻璃结霜，锅里冒着白汽">
        <p class="scene-tag">东街工人食堂 · 06:40</p>
        <h2>后厨的窗口</h2>
        <p id="room-note"></p>
      </section>
    </div>
    <div class="docket">
      <section id="intro">
        <p class="code">东街工人食堂 / 早班</p>
        <h1>最后一份配给</h1>
        <p class="copy">阿列克谢接了早班送货。他得拿到食堂的签收单，才能换领卡佳今天的透析液。</p>
        <dl class="ledger">
          <div><dt>本批计划</dt><dd>面包 40 份</dd></div>
          <div><dt>签收奖励</dt><dd>透析液 1 袋</dd></div>
        </dl>
        <button class="primary" id="enter">去后厨点货</button>
      </section>
      <section id="decision" hidden>
        <p class="code">到货登记 / 早班</p>
        <h2 tabindex="-1" id="decision-title">少了一份。</h2>
        <p class="copy">司秤员把单子推过来。“凑足四十份，我就能给你盖章。”</p>
        <dl class="ledger">
          <div><dt>箱内</dt><dd class="alert">39 / 40 份</dd></div>
          <div><dt>你的晚餐</dt><dd>面包 1 份</dd></div>
        </dl>
        <div class="options">
          <button class="option" data-choice="sign"><strong>照计划签收</strong><small>填 40 份，把短缺留给排在最后的人。</small></button>
          <button class="option" data-choice="share"><strong>拿自己的晚餐补上</strong><small>交出自己的一份，按 40 份签收。</small></button>
          <button class="option" data-choice="report"><strong>如实登记短缺</strong><small>填 39 份，签收单转交复核。</small></button>
        </div>
      </section>
      <section id="receipt" hidden>
        <p class="code">区配给委员会 / 签收回执</p>
        <h2 tabindex="-1" id="receipt-title"></h2>
        <p class="stamp" id="receipt-status"></p>
        <dl class="ledger">
          <div><dt>账面签收</dt><dd id="paper-count"></dd></div>
          <div><dt>实际发出</dt><dd id="actual-count"></dd></div>
          <div><dt>卡佳的透析液</dt><dd id="medicine"></dd></div>
          <div><dt>阿列克谢的晚餐</dt><dd id="supper"></dd></div>
        </dl>
        <button class="primary" id="restart">再走一遍</button>
      </section>
    </div>
  </div>
  <footer class="foot"><span>美术与叙事小样</span><span>配给窗口</span></footer>
</main>
<script>
  const byId = (id) => document.getElementById(id);
  const endings = {
    sign: {
      title: "计划如期完成", status: "配给率 100%", paper: "40 / 40 份", actual: "39 / 40 份",
      medicine: "已领取 1 袋", supper: "保留 1 份",
      note: "最后一个人把搪瓷碗伸进窗口。司秤员拉上了挡板。"
    },
    share: {
      title: "计划如期完成", status: "配给率 100%", paper: "40 / 40 份", actual: "40 / 40 份",
      medicine: "已领取 1 袋", supper: "剩余 0 份",
      note: "最后一个人端着热面包走了。阿列克谢把空布袋叠好，塞回大衣。"
    },
    report: {
      title: "短缺待复核", status: "本批暂缓结算", paper: "39 / 40 份", actual: "39 / 40 份",
      medicine: "待复核，暂未发放", supper: "保留 1 份",
      note: "最后一个人没领到面包。阿列克谢在窗口等到早班铃响，也没拿到签收章。"
    }
  };

  function show(panel, focusTarget) {
    for (const id of ["intro", "decision", "receipt"]) {
      byId(id).hidden = id !== panel;
    }
    byId("poster").hidden = panel !== "intro";
    byId("room").hidden = panel === "intro";
    byId(focusTarget).focus();
  }

  byId("enter").addEventListener("click", () => {
    byId("room-note").textContent = "锅边排着四十只搪瓷碗。你把箱子翻到底，只看见一层面包屑。";
    show("decision", "decision-title");
  });

  for (const button of document.querySelectorAll("[data-choice]")) {
    button.addEventListener("click", () => {
      const ending = endings[button.dataset.choice];
      byId("receipt-title").textContent = ending.title;
      byId("receipt-status").textContent = ending.status;
      byId("paper-count").textContent = ending.paper;
      byId("actual-count").textContent = ending.actual;
      byId("medicine").textContent = ending.medicine;
      byId("supper").textContent = ending.supper;
      byId("room-note").textContent = ending.note;
      show("receipt", "receipt-title");
    });
  }

  byId("restart").addEventListener("click", () => show("intro", "enter"));
</script>
</body>
</html>
