<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>凛冬铁轨 / 剧情档案</title>
<style>
:root{color-scheme:dark;--base:#10161b;--rail:#151f26;--panel:#1a262e;--line:#34454d;--ink:#eaf0ed;--muted:#a8b9be;--gold:#f5c980;--ice:#9ed4d6}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--base);color:var(--ink);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}
a{color:var(--ice);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.52rem .76rem}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button:disabled{opacity:.38;cursor:default}
h1,h2,h3,p,figure{margin:0}
h1,h2{line-height:1.12}
h1{font-family:"Noto Serif SC","Songti SC",SimSun,serif;font-size:clamp(2.75rem,7vw,6.4rem);letter-spacing:.035em}
h2{font-size:clamp(1.85rem,4vw,3.2rem)}
h3{font-size:1.12rem}
p{margin-block:.5rem}
img{max-width:100%;display:block}
.shell{display:grid;grid-template-columns:13.2rem minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;background:var(--rail);border-right:1px solid var(--line);padding:1.5rem 1rem;display:flex;flex-direction:column}
.brand{font-weight:800;letter-spacing:.12em;color:var(--ink);font-size:1.15rem;padding:.25rem .5rem}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.73rem;margin-top:.2rem}
.rail nav{display:grid;gap:.3rem;margin-top:2rem}
.rail nav a{padding:.55rem .7rem;color:var(--muted);border-radius:6px}
.rail nav a[aria-current]{background:var(--panel);color:var(--gold)}
.repo{margin-top:auto;padding:.5rem;color:var(--muted)}
.workspace{min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;border-bottom:1px solid var(--line);padding:.75rem clamp(1rem,3.2vw,3rem)}
.topbar span{color:var(--muted)}
.topbar label{display:flex;align-items:center;gap:.65rem}
.topbar input{width:min(38vw,22rem)}
main{padding:clamp(1rem,3.2vw,3rem);max-width:105rem;margin:auto}
main:focus{outline:none}
.hero{position:relative;min-height:clamp(22rem,45vw,37rem);display:grid;align-items:end;background:linear-gradient(0deg,#10161bf8 0%,#10161b82 39%,#10161b0d 78%),url("../../godot_project/art/80_maps/Yard/map_night.png") center/cover;border-radius:12px;overflow:hidden}
.hero>div{padding:clamp(1.5rem,4vw,4rem)}
.hero p{max-width:34rem;color:#e0e9e8}
.kicker,.muted,.meta,.cast,.caption+details{color:var(--muted)}
.kicker{letter-spacing:.08em}
.cta{display:inline-block;background:var(--gold);color:#24201b;padding:.55rem 1rem;border-radius:5px;font-weight:750;margin-top:.65rem}
.route{display:flex;overflow:auto;gap:0;list-style:none;padding:0;margin:1rem 0 2rem}
.route li{flex:none;border-top:2px solid var(--line);padding:.65rem 1rem .35rem 0;margin-right:.5rem}
.route li:first-child{border-color:var(--gold)}
.highlights{display:grid;grid-template-columns:1.6fr 1fr;gap:1.2rem}
.highlight{border:1px solid var(--line);border-radius:8px;padding:1.2rem;background:var(--panel);color:var(--ink)}
.highlight strong{display:block;font-size:1.2rem}
.heading{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:1rem;margin:0 0 1.55rem}
.heading p{margin-bottom:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr));gap:1rem}
.tile{display:block;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;color:var(--ink)}
.tile:hover{border-color:var(--ice);text-decoration:none}
.tile .cover{width:100%;aspect-ratio:16/9;object-fit:cover;background:#0b1217}
.tile .tiletext{display:block;padding:.75rem}
.tile small,.list-row small{display:block;color:var(--muted);margin-top:.2rem}
.atlas{grid-template-columns:repeat(auto-fill,minmax(min(100%,20rem),1fr));gap:1.15rem}
.atlas .cover{aspect-ratio:1.55;object-fit:contain}
.people{grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr))}
.people .cover{aspect-ratio:4/5;object-fit:contain;object-position:bottom;background:radial-gradient(ellipse at 50% 65%,#324752,#172129 75%)}
.people .tiletext{border-top:1px solid var(--line)}
.list{max-width:58rem}
.list-row{display:block;border-bottom:1px solid var(--line);padding:.8rem 0}
.list-row strong{color:var(--ink)}
.list-row:focus-within,.list-row:hover{background:var(--panel)}
.ending-routes{display:grid;gap:1rem}
.ending-route{display:grid;grid-template-columns:minmax(13rem,32%) 1fr;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ending-route img{width:100%;height:100%;aspect-ratio:16/9;object-fit:cover}
.ending-route>div{padding:1rem 1.25rem}
.ending-route h3{color:var(--gold)}
.ending-route a{display:block;margin-block:.35rem}
.table-scroll{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:40rem}
td,th{padding:.85rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--panel)}
td:first-child{width:21%;color:var(--gold)}
td:nth-child(2){width:23%}
.back{display:inline-block;margin-bottom:.9rem}
.reading .heading{margin-bottom:.75rem}
.reading{max-width:66rem}
.stage{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.frames{margin:0;padding:0;list-style:none}
.frame>div:nth-child(2){padding:1rem 1.2rem}
.frame>div:empty{display:none}
.cg img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#0b1217}
.frame .cg+.cg{border-top:1px solid var(--line)}
.caption,.translation p{white-space:pre-wrap}
.translation{margin-top:.6rem;color:var(--muted)}
summary{cursor:pointer}
.portrait img{width:6rem;max-height:8rem;object-fit:contain}
.cast-detail{max-width:54rem;display:grid;grid-template-columns:minmax(8rem,15rem) 1fr;gap:1.5rem}
.cast-detail .portrait img{width:100%;max-height:27rem}
.cast-detail ul{margin:0;padding-left:1.25rem}
.cast-detail li{margin-bottom:.45rem}
.controls{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.7rem 1rem;border-top:1px solid var(--line)}
.thumbstrip{display:flex;gap:.5rem;overflow:auto;padding:.7rem 1rem;border-top:1px solid var(--line)}
.thumbstrip button{flex:0 0 6rem;padding:.15rem}
.thumbstrip img{aspect-ratio:16/9;object-fit:cover;width:100%}
.thumbstrip [aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
.map-view figure{margin:1rem 0}
.map-toggle button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
.reading article{max-width:56rem}
.reading .slide-detail,.reading .map-view{max-width:none}
.reading aside{padding:.7rem 1rem;border-left:2px solid var(--line);margin-top:1rem}
@media(max-width:760px){
 .shell{display:block}.rail{height:auto;position:static;padding:.65rem .85rem;border-right:0;border-bottom:1px solid var(--line)}
 .rail nav{display:flex;overflow:auto;margin:.45rem 0 0;gap:.2rem}
 .rail nav a{white-space:nowrap}.brand small,.repo{display:none}.highlights{grid-template-columns:1fr}
 .topbar span{display:none}.topbar label{width:100%}.topbar input{width:100%}.cast-detail{grid-template-columns:1fr}
 .cast-detail .portrait img{max-width:14rem}
 .ending-route{grid-template-columns:1fr}.ending-route img{max-height:12rem}
}
</style>

<template id="source"><details class="record" id="deck-prologue-1" data-group="开场" data-search="封城第十个月 开场 序章 / 602 室与货运调度室 / 开场 阿列克谢、卡佳、拉娜、清杀队 prologue"><summary><strong>封城第十个月</strong><span>序章 / 602 室与货运调度室 / 开场</span></summary><p class="cast">出场或被记录人物　阿列克谢、卡佳、拉娜、清杀队</p><p></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_intro_city.jpg"><img src="../../godot_project/art/60_ui/cg/cg_intro_city.jpg" alt="封城第十个月 第 1 页的 CG" loading="lazy"></a></div><div><p class="caption">Z 年，凛冬。西伯利亚铁路枢纽诺沃斯克-17，封城的第十个月。
一种叫「灰鳞病」的高烧在城里蔓延。发病的人被叫作「狂暴者」，装进车皮拉走，再也没有回来。</p><details class="translation"><summary>English</summary><p>The Year of Z, deep winter. Novorsk-17, a Siberian rail hub, ten months under quarantine.
A fever called Grey Scale spreads through the town. The sick are called Rabid, loaded into freight cars, and never come back.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_intro_mother.jpg"><img src="../../godot_project/art/60_ui/cg/cg_intro_mother.jpg" alt="封城第十个月 第 2 页的 CG" loading="lazy"></a></div><div><p class="caption">你是阿列克谢·莫罗佐夫，货运调度员。602 室里，母亲卡佳靠腹膜透析活着。
透析液由区配给委员会发放——每一袋，都要拿「听话」去换。</p><details class="translation"><summary>English</summary><p>You are Aleksei Morozov, a freight dispatcher. In Room 602 your mother Katya lives on peritoneal dialysis.
The fluid is issued by the District Rationing Committee. Every bag is paid for with obedience.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/opening_dispatch.png"><img src="../../godot_project/art/60_ui/opening_dispatch.png" alt="封城第十个月 第 3 页的 CG" loading="lazy"></a></div><div><p class="caption">十天前，你在 004 号车皮的调拨单上签了字。作为奖励，母亲领到了下一批腹透液。
你没有问，那节车皮里装的是什么。</p><details class="translation"><summary>English</summary><p>Ten days ago you signed the transfer order for Car 004. In return, Mother received her next batch of fluid.
You did not ask what the car was carrying.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_intro_lana.jpg"><img src="../../godot_project/art/60_ui/cg/cg_intro_lana.jpg" alt="封城第十个月 第 4 页的 CG" loading="lazy"></a></div><div><p class="caption">十天后的筛查里，妹妹拉娜被带走了。档案编号 0420。
她被推上装甲列车「铁壳号」的第三节闷罐车厢——和你签过字的那种车皮，一模一样。</p><details class="translation"><summary>English</summary><p>Ten days later, your sister Lana was taken at screening. File 0420.
She was pushed into Boxcar 3 of the armoured train Buran. A car exactly like the one you signed for.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_intro_mother.jpg"><img src="../../godot_project/art/60_ui/cg/cg_intro_mother.jpg" alt="封城第十个月 第 5 页的 CG" loading="lazy"></a></div><div><p class="caption">卡佳：阿廖沙……拉娜还没回电报吗？
你把转运单折好，塞进大衣内袋。
阿列克谢：妈，铁路医院派她去外地支援医疗了。等忙完这阵，她就回来。</p><details class="translation"><summary>English</summary><p>Katya: Alyosha... still no telegram from Lana?
You fold the transfer notice and slip it into your inside coat pocket.
Aleksei: Mama, the railway hospital sent her out of town to help a medical team. She&#x27;ll be home when the work is done.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/opening_courtyard.png"><img src="../../godot_project/art/60_ui/opening_courtyard.png" alt="封城第十个月 第 6 页的 CG" loading="lazy"></a></div><div><p class="caption">清杀队：封楼！所有人退回室内，天亮之前不许出门！
焊枪封死了单元门。白天你替台账搬运物资；夜里，整栋楼只剩探照灯还醒着。</p><details class="translation"><summary>English</summary><p>OSK: Seal the building! Everyone inside. Nobody leaves before dawn!
The welders close the stairwell door. By day you haul for the ledger; by night only the searchlights are awake.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_intro_vent.jpg"><img src="../../godot_project/art/60_ui/cg/cg_intro_vent.jpg" alt="封城第十个月 第 7 页的 CG" loading="lazy"></a></div><div><p class="caption">只有锅炉房那扇锈死的通风口，还通向外面。每一夜只够去一个地方，天亮之前必须回来。
你在心里对自己说：先把药带回家，再找到拉娜。</p><details class="translation"><summary>English</summary><p>Only the rusted vent of the boiler room still leads outside. One place per night, and back before dawn.
You tell yourself: bring the medicine home first, then find Lana.</p></details></div></li></ol></details>
<details class="record" id="deck-mother-2" data-group="602 室" data-search="和母亲说话 602 室 据点 / 602 室 / 602 室 阿列克谢、卡佳 mother"><summary><strong>和母亲说话</strong><span>据点 / 602 室 / 602 室</span></summary><p class="cast">出场或被记录人物　阿列克谢、卡佳</p><p></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_intro_mother.jpg"><img src="../../godot_project/art/60_ui/cg/cg_intro_mother.jpg" alt="和母亲说话 第 1 页的 CG" loading="lazy"></a></div><div><a class="portrait" href="../../godot_project/art/10_characters/portraits/PRT_Katya_Calm.png"><img src="../../godot_project/art/10_characters/portraits/PRT_Katya_Calm.png" alt="游戏指定头像" loading="lazy"></a><p class="caption">卡佳：阿廖沙，手怎么这么凉？把手套放到炉边吧。
阿列克谢：我没事，妈。今晚我会把背包里的东西理好。</p><details class="translation"><summary>English</summary><p>Katya: Alyosha, your hands are freezing. Leave your gloves by the stove.
Aleksei: I&#x27;m all right, Mama. I&#x27;ll sort what I brought back tonight.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_intro_mother.jpg"><img src="../../godot_project/art/60_ui/cg/cg_intro_mother.jpg" alt="和母亲说话 第 2 页的 CG" loading="lazy"></a></div><div><a class="portrait" href="../../godot_project/art/10_characters/portraits/PRT_Katya_Determined.png"><img src="../../godot_project/art/10_characters/portraits/PRT_Katya_Determined.png" alt="游戏指定头像" loading="lazy"></a><p class="caption">卡佳：别总想着替所有人扛事。先坐下喝口热水，让我看看你有没有伤着。
她说得很轻，像怕惊动透析机。</p><details class="translation"><summary>English</summary><p>Katya: You can&#x27;t carry everyone. Sit down and drink something warm; let me see if you&#x27;re hurt.
She speaks softly, as if not to wake the dialysis machine.</p></details></div></li></ol></details>
<details class="record" id="deck-mother_waiting-3" data-group="602 室" data-search="母亲在等 602 室 据点 / 602 室 / 602 室 阿列克谢、卡佳 mother_waiting"><summary><strong>母亲在等</strong><span>据点 / 602 室 / 602 室</span></summary><p class="cast">出场或被记录人物　阿列克谢、卡佳</p><p></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_intro_mother.jpg"><img src="../../godot_project/art/60_ui/cg/cg_intro_mother.jpg" alt="母亲在等 第 1 页的 CG" loading="lazy"></a></div><div><a class="portrait" href="../../godot_project/art/10_characters/portraits/PRT_Katya_Fear.png"><img src="../../godot_project/art/10_characters/portraits/PRT_Katya_Fear.png" alt="游戏指定头像" loading="lazy"></a><p class="caption">卡佳：机器还能撑一阵。别为了我一个人，把自己也搭进去。
阿列克谢看了看透析机旁空着的位置，没有回答。</p><details class="translation"><summary>English</summary><p>Katya: The machine can hold for a little while. Don&#x27;t lose yourself trying to save me.
Aleksei looks at the empty space beside the dialysis machine and says nothing.</p></details></div></li></ol></details>
<details class="record" id="deck-mother_memory-4" data-group="602 室" data-search="母亲的遗物 602 室 据点 / 602 室 / 602 室 阿列克谢 mother_memory"><summary><strong>母亲的遗物</strong><span>据点 / 602 室 / 602 室</span></summary><p class="cast">出场或被记录人物　阿列克谢</p><p></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_intro_mother.jpg"><img src="../../godot_project/art/60_ui/cg/cg_intro_mother.jpg" alt="母亲的遗物 第 1 页的 CG" loading="lazy"></a></div><div><p class="caption">屋里只剩透析机停下后的静默。你把母亲留下的围巾叠好，放在床边。</p><details class="translation"><summary>English</summary><p>Only silence remains after the dialysis machine stops. You fold your mother&#x27;s scarf and set it beside the bed.</p></details></div></li></ol></details>
<details class="record" id="deck-fluid_given-5" data-group="602 室" data-search="交付透析液 602 室 据点 / 602 室 / 602 室 阿列克谢、卡佳 fluid_given"><summary><strong>交付透析液</strong><span>据点 / 602 室 / 602 室</span></summary><p class="cast">出场或被记录人物　阿列克谢、卡佳</p><p></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_intro_mother.jpg"><img src="../../godot_project/art/60_ui/cg/cg_intro_mother.jpg" alt="交付透析液 第 1 页的 CG" loading="lazy"></a></div><div><a class="portrait" href="../../godot_project/art/10_characters/portraits/PRT_Katya_Determined.png"><img src="../../godot_project/art/10_characters/portraits/PRT_Katya_Determined.png" alt="游戏指定头像" loading="lazy"></a><p class="caption">阿列克谢把一袋透析液放到机器旁。
卡佳：这一袋先留着，明早再换。你总算肯让我也替你省着点力气了。</p><details class="translation"><summary>English</summary><p>Aleksei sets a bag of dialysis fluid beside the machine.
Katya: Keep this one for the morning. At last you&#x27;re letting me help you save a little strength.</p></details></div></li></ol></details>

她没意识到自己说出了什么。</p><details class="translation"><summary>English</summary><p>Vikina: The cover said 0420, with “third car” pencilled underneath. Who cares about an old list? I only want my ration slip back.

<details class="record" id="deck-redzone_mother-26" data-group="现场与余波" data-search="退烧的母亲 现场与余波 第一幕 / 夜间广轨货场 / 现场与余波 阿列克谢、退烧的母亲、清杀队 redzone_mother"><summary><strong>退烧的母亲</strong><span>第一幕 / 夜间广轨货场 / 现场与余波</span></summary><p class="cast">出场或被记录人物　阿列克谢、退烧的母亲、清杀队</p><p>战役货场首次靠近锅炉房通风口 <a href="#map-yard">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_redzone_mother_gate_v1.png"><img src="../../godot_project/art/60_ui/cg/cg_redzone_mother_gate_v1.png" alt="退烧的母亲 第 1 页的 CG" loading="lazy"></a></div><div><p class="caption">心声：手背上有灰鳞。往暗处退。……等等，她在叫谁开门？</p><details class="translation"><summary>English</summary><p>Inner voice: Gray scales on her hand. Back into shadow. …Wait. Who is she asking to open the door?</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_redzone_mother_gate_v1.png"><img src="../../godot_project/art/60_ui/cg/cg_redzone_mother_gate_v1.png" alt="退烧的母亲 第 2 页的 CG" loading="lazy"></a></div><div><p class="caption">她隔着铁栅栏向楼里喊：「科利亚……给妈开条缝。妈退烧了，你摸摸。妈不进去，只看一眼小安东。」</p><details class="translation"><summary>English</summary><p>She calls through the bars: &quot;Kolya... open the door a little. Mama&#x27;s fever broke; feel my forehead. I won&#x27;t come in. I only want to see little Anton.&quot;</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_redzone_mother_osk_v1.png"><img src="../../godot_project/art/60_ui/cg/cg_redzone_mother_osk_v1.png" alt="退烧的母亲 第 3 页的 CG" loading="lazy"></a></div><div><p class="caption">探照灯照亮栅栏，清杀队从拐角出来。
女人：「别开枪……我退烧了。」</p><details class="translation"><summary>English</summary><p>A searchlight catches the bars as the purge squad rounds the corner.
Woman: “Don&#x27;t shoot… my fever broke.”</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_redzone_mother_aftermath_v1.png"><img src="../../godot_project/art/60_ui/cg/cg_redzone_mother_aftermath_v1.png" alt="退烧的母亲 第 4 页的 CG" loading="lazy"></a></div><div><p class="caption">两声闷响。她倒在门边，再没动过。清杀队走远了，铜钥匙落在沟沿。</p><details class="translation"><summary>English</summary><p>Two muffled shots. She falls by the gate and never moves again. The squad walks away. Her brass keys lie by the gutter.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_redzone_mother_scales_v1.png"><img src="../../godot_project/art/60_ui/cg/cg_redzone_mother_scales_v1.png" alt="退烧的母亲 第 5 页的 CG" loading="lazy"></a></div><div><p class="caption">她没有疯。她退烧了。你想起被带走的拉娜：她也可能正在退烧。</p><details class="translation"><summary>English</summary><p>She was not mad. Her fever had broken. You think of Lana, taken away in the train: her fever may be breaking too.</p></details></div></li></ol></details>
<details class="record" id="deck-coldstore-71" data-group="战役对白" data-search="账面死人 战役对白 第一幕 / 城北四号铁路冷库 / 战役对白 阿列克谢、切尔诺夫、谢尔盖、玛丽亚、灰烬 coldstore"><summary><strong>账面死人</strong><span>第一幕 / 城北四号铁路冷库 / 战役对白</span></summary><p class="cast">出场或被记录人物　阿列克谢、切尔诺夫、谢尔盖、玛丽亚、灰烬</p><p> <a href="#map-coldstore">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_coldstore_scene.jpg"><img src="../../godot_project/art/60_ui/cg/cg_coldstore_scene.jpg" alt="账面死人 第 1 页的 CG" loading="lazy"></a></div><div><p><b>旁白 / 阿列克谢</b>  白昼。城北四号铁路冷库。</p><p><b>旁白 / 阿列克谢</b>  挂满白霜的氨气管道在头顶纵横交错，地面结了一层油污与冰渣混合的黑硬壳。阿列克谢作为征召搬运工，正将一箱箱贴着内务部封条的黄油和咸鱼搬上平板手推车。</p><p><b>旁白 / 阿列克谢</b>  在南库 3 号水泥柱后面，一个穿着破烂黑棉袄的男人正跪在冰水沟旁，怀里紧紧裹着一个裹在旧军毯里的小孩。小孩的脸色发灰，嘴唇冻得发紫。</p><p><b>旁白 / 阿列克谢</b>  内务部巡逻队的皮靴声在铁格栅通道上停下。切尔诺夫中士停在柱子前，手里拿着便携手持打卡机，金属探头对准了男人的手背。</p><p><b>旁白 / 阿列克谢</b>  终端滴地响了一声，红灯闪烁。</p><p><b>切尔诺夫中士</b> （语气平直，不带情绪） 档案 0892，谢尔盖。昨日 22:00 移交单乌拉尔山线。主脑记录：已出清。当前坐标在册人数：0。</p><p><b>旁白 / 阿列克谢</b>  男人猛地抬起头，眼睛里全是红血丝，干裂的嘴唇裂开血口子。</p><p><b>谢尔盖</b>  长官……机器搞错了！我没上车，我昨天在锅炉房换班，孩子发高烧……我没死，你看，玛丽亚也没死，她还喘气呢！</p><p><b>切尔诺夫中士</b> （把终端翻转过来，屏幕对着男人的脸） 上面写着零。机器只认打孔卡。在册是零，这根柱子底下就没有人。没有人，就没有今天的配给。</p><p><b>旁白 / 阿列克谢</b>  切尔诺夫伸手推开配给箱的铁盖，锁栓卡嗒一声落进锁槽。男人扑上去抓住中士的裤脚，指甲在硬皮靴上划出刺耳的声响。</p><p><b>谢尔盖</b>  长官！一口，就给玛丽亚一口热汤……</p><p><b>旁白 / 阿列克谢</b>  切尔诺夫中士往后撤了半步。他没有拔枪，也没有踹人，只是机械地把男人的手指一根根掰开。在转身离开的瞬间，切尔诺夫的脚尖在雪地里微微一滞，踢开了一个碍事的空铁皮盒，低声自言自语般吐出半句话：</p><p><b>切尔诺夫中士</b>  ……别在这儿耗着。去西站水塔后头找捡煤渣的，兴许有烂土豆。死在冷库里，连拉尸车都不会来。</p><p><b>旁白 / 阿列克谢</b>  中士带着两名队员快步走远。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢站在三米外，手里的板车把手被他捏得咯咯作响。在水泥柱后的阴影里，一只缺了半只耳朵的灰狼犬正趴在废弃收发亭的台阶下。它脖颈上缠着被剪断的锈铁丝；铁丝曾经勒进皮肉，留下了一圈褪不掉的伤痕，周围的毛也长得稀疏。它没有靠近谢尔盖，只安静地看着阿列克谢。</p><details class="translation"><summary>English</summary><p>Daylight. Rail Cold Storage No.4, north of the city.</p><p>Ammonia pipes crisscrossed overhead, thick with white frost; underfoot the floor was crusted with a black hard shell of oil and ice. Aleksei, a conscripted porter, was loading crates of butter and salt fish, sealed with Ministry of Internal Affairs strips, onto a flat handcart.</p><p>Behind concrete column 3 in the south hall, a man in a ragged black padded coat knelt beside a gutter of ice water, holding a child tightly wrapped in an old army blanket. The child&#x27;s face was grey, its lips blue-purple with cold.</p><p>The boots of a Ministry patrol stopped on the iron-grate walkway. Sergeant Chernov halted before the column, a portable punch-clock in his hand, its metal probe aimed at the man&#x27;s hand.</p><p>The terminal gave a single beep; a red light blinked.</p><p>File 0892, Sergey. Transferred to the Ural Line Station yesterday at 22:00. Central record: cleared. Persons registered at this coordinate: zero.</p><p>The man&#x27;s head snapped up, his eyes threaded with red, his cracked lips split and bleeding.</p><p>Officer... the machine&#x27;s wrong! I never boarded — I was covering a shift at the boiler house yesterday, the child had a fever... I&#x27;m not dead, look, Maria&#x27;s not dead either, she&#x27;s still breathing!</p><p>It says zero up there. The machine reads punch cards. Zero on the register means nobody under this column. Nobody means no ration today.</p><p>Chernov reached over and pushed the iron lid of the ration crate shut; the bolt clicked into its slot. The man lunged and clutched the sergeant&#x27;s trouser leg, his nails scraping a shrill sound across the stiff leather boot.</p><p>Officer! One mouthful — just one spoon of hot soup for Maria...</p><p>Sergeant Chernov stepped back half a pace. He did not draw his pistol or kick; he only pried the man&#x27;s fingers loose, one by one, mechanically. As he turned to go, his toe faltered a moment in the snow, kicked aside an empty tin box in the way, and he let fall half a sentence, almost to himself:</p><p>...Don&#x27;t waste time here. Go behind the water tower at West Station, find the cinder-pickers; there might be rotten potatoes. Die in the cold store and not even the corpse cart will come.</p><p>The sergeant strode off with his two men.</p><p>Aleksei stood three metres away, the handcart&#x27;s grip creaking under his fingers. In the shadow behind the concrete column, a grey wolfdog with half an ear missing lay on the steps of the abandoned dispatch hut. A length of cut, rusted wire was twisted round its neck; it had once bitten into the flesh and left a ring of scar that would not fade, the fur around it grown thin. It did not go to Sergey, only watched Aleksei quietly.</p></details><aside><strong>选项与回执</strong><ol><li>救下谢尔盖父女，喂灰犬并写下他们的名字<p>你把饼分给谢尔盖父女，又把剩下的碎块放到灰犬鼻尖前。它吃完后，你剪断勒住脖子的锈铁丝；灰烬自己站起来，踩着你的脚印跟上。谢尔盖和玛丽亚的名字也留在了纸上。</p><details class="translation"><summary>English</summary><p>Rescue Sergey and Maria, feed the wolfdog, and record their names You share the bread with Sergey and Maria, then feed the wolfdog. After you cut the wire from its scarred neck, Ash chooses to follow. Their names stay in your book.</p></details></li><li>不救他们，低头搬你的箱子<p>你低头推车，没有救谢尔盖父女，也没有喂那只灰犬。它留在收发亭旁，颈上的旧伤还在。灰烬没有跟上。</p><details class="translation"><summary>English</summary><p>Leave them behind and keep hauling crates. You keep hauling and leave Sergey, Maria, and the wolfdog behind. The dog stays by the dispatch hut. Ash does not follow.</p></details></li></ol></aside></div></li></ol></details>
<details class="record" id="deck-yard-72" data-group="战役对白" data-search="铁壳号编组单 战役对白 第一幕 / 夜间广轨货场 / 战役对白 阿列克谢、扎哈尔 yard"><summary><strong>铁壳号编组单</strong><span>第一幕 / 夜间广轨货场 / 战役对白</span></summary><p class="cast">出场或被记录人物　阿列克谢、扎哈尔</p><p> <a href="#map-yard">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_yard_scene.jpg"><img src="../../godot_project/art/60_ui/cg/cg_yard_scene.jpg" alt="铁壳号编组单 第 1 页的 CG" loading="lazy"></a></div><div><p><b>旁白 / 阿列克谢</b>  货场换岗时，阿列克谢从煤水塔后绕过一排待报废的配给箱。一个戴蓝袖章的核算员正把没收来的手套、滤芯和烟草重新分堆，手里那本账簿没有一页写着失主的名字。</p><p><b>核算员扎哈尔</b> （把账本合上，先看了看阿列克谢的手，再看向远处的巡逻灯） 我叫扎哈尔。以前我替配给站登记每一袋粮，后来那本账上只剩空格。带我走吧，我能从一堆废物里认出还有用的东西。别把这当忠诚——我只是不想再挨饿。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢问他，如果清杀队愿意拿配额换一份举报，他会怎么做。扎哈尔没有否认，只用拇指擦掉账本封面上的冻泥。</p><p><b>核算员扎哈尔</b>  要是他们给的配额比你给的多，我会把知道的都报上去。账不会替谁讲情。</p><details class="translation"><summary>English</summary><p>During the shift change at the freight yard, Aleksei slips around the coal-water tower past a row of ration crates marked for scrap. A blue-armband clerk is re-sorting confiscated gloves, filter cartridges, and tobacco; not one page of the ledger in his hand bears the name of a rightful owner.</p><p>My name is Zakhar. I used to record every sack at the ration office. In the end, my own ledger was only blanks. Take me with you; I can tell what is still worth saving from a heap of scrap. Don&#x27;t call it loyalty. I just don&#x27;t want to go hungry again.</p><p>Aleksei asked him what he would do if the OSK offered rations in exchange for a denunciation. Zakhar did not deny it; he only wiped the frozen mud from the ledger&#x27;s cover with his thumb.</p><p>If they offer more rations than you do, I&#x27;ll report everything I know. A ledger doesn&#x27;t plead for anyone.</p></details><aside><strong>选项与回执</strong><ol><li>收好编组单（+1 情报）<p>那张冰凉的编组单隔着衬衣紧贴着你的肋骨，像一块烧红的烙铁。0420，你的亲妹妹，此刻正在第三节闷罐车厢里等着被抹去。扎哈尔扯下蓝臂章，把扩音器塞进棉袄，跟上了你。</p><details class="translation"><summary>English</summary><p>Pocket the consist (+1 Intel) The consist sits against your ribs. 0420 is in that car. Zakhar removes his blue armband, hides the loudhailer under his coat, and follows.</p></details></li></ol></aside></div></li></ol></details>
<details class="record" id="deck-pasha_watchtower-103" data-group="战役对白" data-search="假人哨塔 战役对白 第一幕 / 西站调车场 / 战役对白 阿列克谢、帕沙 pasha_watchtower"><summary><strong>假人哨塔</strong><span>第一幕 / 西站调车场 / 战役对白</span></summary><p class="cast">出场或被记录人物　阿列克谢、帕沙</p><p> <a href="#map-marshalling">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_pasha_watchtower_scene.jpg"><img src="../../godot_project/art/60_ui/cg/cg_pasha_watchtower_scene.jpg" alt="假人哨塔 第 1 页的 CG" loading="lazy"></a></div><div><p><b>阿列克谢</b>  西站调车场的假人哨塔下，一个年轻新兵烧得发抖。探照灯还在转，他手里的体温计停在三十九度二。</p><p><b>帕沙</b>  大哥……你有退烧药吗？明早督察队要量体温。过了三十八度五，挂上哨塔的就会是我。</p><p><b>阿列克谢</b>  你是清杀队的人。可你现在只是个发着烧、想回家的孩子。</p><details class="translation"><summary>English</summary><p>Beneath the dummy watchtower at the West Yard, a young conscript shakes with fever. The searchlight still turns; his thermometer reads 39.2.</p><p>Brother... do you have anything for a fever? The inspectors take temperatures at dawn. Above 38.5, they will hang me from the tower.</p><p>You wear an OSK coat. But right now you are only a feverish boy who wants to go home.</p></details><aside><strong>选项与回执</strong><ol><li>分给帕沙一片阿司匹林<p>帕沙吞下药片，体温开始往下走。他答应明早把探照灯抬向天顶。</p><details class="translation"><summary>English</summary><p>Give Pasha one aspirin Pasha swallows the tablet and his fever begins to break. He promises to aim the searchlight skyward at dawn.</p></details></li><li>贴墙绕行，把他的哭声留给黑暗<p>你退回阴影里。换岗的脚步声走近，随后响起一声短促的枪声。</p><details class="translation"><summary>English</summary><p>Slip past and leave his crying to the dark You retreat into the shadows. The changing patrol approaches, followed by one short gunshot.</p></details></li><li>夺走他的补给<p>你搜走他身上仅有的口粮。工作日志背面多了一道划痕。</p><details class="translation"><summary>English</summary><p>Take his supplies You take the little ration he has left. Another stroke marks the back of the logbook.</p></details></li></ol></aside></div></li></ol></details>
<details class="record" id="deck-canteen-11" data-group="抉择余波表" data-search="东街食堂 抉择余波表 第二幕 / 东街工人食堂 · 后厨 / 抉择余波表 / 选项 1 阿列克谢、瓦西里、费奥多尔 canteen"><summary><strong>东街食堂</strong><span>第二幕 / 东街工人食堂 · 后厨 / 抉择余波表 / 选项 1</span></summary><p class="cast">出场或被记录人物　阿列克谢、瓦西里、费奥多尔</p><p>静态余波表。部分旧选项已由现场过场替代，触发以游戏入口为准。 <a href="#map-canteen">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_canteen_vasily_qte_fyodor_v2.png"><img src="../../godot_project/art/60_ui/cg/cg_canteen_vasily_qte_fyodor_v2.png" alt="东街食堂 第 1 页的 CG" loading="lazy"></a></div><div><p class="caption">刀刃卡进骨缝的那一瞬，瓦西里眼里的紫黑褪去了。
他只说了一个词：「……Пить。」——渴。</p><details class="translation"><summary>English</summary><p>As the blade jams, the black-purple drains from Vasily&#x27;s eyes.
He says one word: &quot;...Пить.&quot; Thirsty.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_canteen_c0.jpg"><img src="../../godot_project/art/60_ui/cg/cg_canteen_c0.jpg" alt="东街食堂 第 2 页的 CG" loading="lazy"></a></div><div><a class="portrait" href="../../godot_project/art/10_characters/portraits/PRT_Fyodor_Sad.png"><img src="../../godot_project/art/10_characters/portraits/PRT_Fyodor_Sad.png" alt="游戏指定头像" loading="lazy"></a><p class="caption">两天后的深夜，你发着高烧回到东街食堂，跪在费奥多尔面前：
你选了刀，只是因为恐惧让它最快。</p><details class="translation"><summary>English</summary><p>Two nights later, feverish, you go back to the East Street canteen and kneel before Fyodor:
you chose the cleaver only because fear made it quickest.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_canteen_c0b.jpg"><img src="../../godot_project/art/60_ui/cg/cg_canteen_c0b.jpg" alt="东街食堂 第 3 页的 CG" loading="lazy"></a><a class="cg" href="../../godot_project/art/60_ui/cg/cg_canteen_c0.jpg"><img src="../../godot_project/art/60_ui/cg/cg_canteen_c0.jpg" alt="东街食堂 第 3 页的 CG" loading="lazy"></a></div><div><a class="portrait" href="../../godot_project/art/10_characters/portraits/PRT_Fyodor_Calm.png"><img src="../../godot_project/art/10_characters/portraits/PRT_Fyodor_Calm.png" alt="游戏指定头像" loading="lazy"></a><p class="caption">老人没有抬手。他把儿子的旧袄披在你肩上：
「把他活着时候的名字，写进你的本子里。」</p><details class="translation"><summary>English</summary><p>The old man does not raise a hand. He drapes his son&#x27;s coat over your shoulders:
&quot;Write the name he had when he was alive. Put it in your book.&quot;</p></details></div></li></ol></details>
<details class="record" id="deck-sanitarium-17" data-group="抉择余波表" data-search="回退手稿 抉择余波表 第二幕 / 旧传染病疗养院 · 地下室 / 抉择余波表 / 选项 1 阿列克谢、梁诺夫、古丽娅、安娜 sanitarium"><summary><strong>回退手稿</strong><span>第二幕 / 旧传染病疗养院 · 地下室 / 抉择余波表 / 选项 1</span></summary><p class="cast">出场或被记录人物　阿列克谢、梁诺夫、古丽娅、安娜</p><p>静态余波表。部分旧选项已由现场过场替代，触发以游戏入口为准。 <a href="#map-sanitarium">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_sanitarium_scene.jpg"><img src="../../godot_project/art/60_ui/cg/cg_sanitarium_scene.jpg" alt="回退手稿 第 1 页的 CG" loading="lazy"></a></div><div><a class="portrait" href="../../godot_project/art/10_characters/portraits/PRT_Anna_Sad.png"><img src="../../godot_project/art/10_characters/portraits/PRT_Anna_Sad.png" alt="游戏指定头像" loading="lazy"></a><p class="caption">撬棍崩开了生锈的笼锁。你替她解开嵌进肉里的皮带——
那是她怕自己伤人，亲手勒上去的。</p><details class="translation"><summary>English</summary><p>The crowbar breaks the rusted lock. You undo the straps sunk into her wrists.
She had tied them herself, afraid of what she might do.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_sanitarium_c0b.jpg"><img src="../../godot_project/art/60_ui/cg/cg_sanitarium_c0b.jpg" alt="回退手稿 第 2 页的 CG" loading="lazy"></a><a class="cg" href="../../godot_project/art/60_ui/cg/cg_sanitarium_scene.jpg"><img src="../../godot_project/art/60_ui/cg/cg_sanitarium_scene.jpg" alt="回退手稿 第 2 页的 CG" loading="lazy"></a></div><div><a class="portrait" href="../../godot_project/art/10_characters/portraits/PRT_Anna_Intense.png"><img src="../../godot_project/art/10_characters/portraits/PRT_Anna_Intense.png" alt="游戏指定头像" loading="lazy"></a><p class="caption">「拉娜的烧退了，三十六度八！昨晚他们把她锁进了铁壳号——第三节车厢！」</p><details class="translation"><summary>English</summary><p>&quot;Lana&#x27;s fever broke. Thirty-six point eight! Last night they locked her in the Buran. Boxcar Three!&quot;</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_sanitarium_c0.jpg"><img src="../../godot_project/art/60_ui/cg/cg_sanitarium_c0.jpg" alt="回退手稿 第 3 页的 CG" loading="lazy"></a></div><div><a class="portrait" href="../../godot_project/art/10_characters/portraits/PRT_Gulya_Calm.png"><img src="../../godot_project/art/10_characters/portraits/PRT_Gulya_Calm.png" alt="游戏指定头像" loading="lazy"></a><p class="caption">安娜（0419）与古丽娅医师搀扶着跟上了你。
笼门的轴在极夜的风雪里，发出一声长长的、如释重负的悲鸣。</p><details class="translation"><summary>English</summary><p>Anna (0419) and Dr. Gulya lean on each other and follow you out.
In the polar wind the cage hinge gives one long, relieved scream.</p></details></div></li></ol></details>
<details class="record" id="deck-canteen_vasily_qte-27" data-group="现场与余波" data-search="食堂卡刀 现场与余波 第二幕 / 东街工人食堂 · 后厨 / 现场与余波 阿列克谢、瓦西里、费奥多尔 canteen_vasily_qte"><summary><strong>食堂卡刀</strong><span>第二幕 / 东街工人食堂 · 后厨 / 现场与余波</span></summary><p class="cast">出场或被记录人物　阿列克谢、瓦西里、费奥多尔</p><p>瓦西里扑出后的近战输入 <a href="#map-canteen">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_canteen_vasily_qte_fyodor_v2.png"><img src="../../godot_project/art/60_ui/cg/cg_canteen_vasily_qte_fyodor_v2.png" alt="食堂卡刀 第 1 页的 CG" loading="lazy"></a></div><div><p class="caption">刀刃卡在锁骨里。瓦西里还压着你，费奥多尔在一旁伸手。把刀拔出来！</p><details class="translation"><summary>English</summary><p>The blade is caught in his collarbone. Vasily is still on top of you; Fyodor reaches from beside you. Pull the blade free!</p></details><p class="meta">QTE 操作 · 连按空格 / 左键</p></div></li></ol></details>
<details class="record" id="deck-canteen_aftermath-28" data-group="现场与余波" data-search="费奥多尔的回访 现场与余波 第二幕 / 东街工人食堂 · 后厨 / 现场与余波 阿列克谢、瓦西里、费奥多尔 canteen_aftermath"><summary><strong>费奥多尔的回访</strong><span>第二幕 / 东街工人食堂 · 后厨 / 现场与余波</span></summary><p class="cast">出场或被记录人物　阿列克谢、瓦西里、费奥多尔</p><p>瓦西里死亡并完成相应夜潜后 <a href="#map-canteen">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_canteen_vasily_qte_fyodor_v2.png"><img src="../../godot_project/art/60_ui/cg/cg_canteen_vasily_qte_fyodor_v2.png" alt="费奥多尔的回访 第 1 页的 CG" loading="lazy"></a></div><div><p class="caption">瓦西里的眼睛清亮了一瞬。他喉咙里挤出一个词：「……Пить。」——水，渴。</p><details class="translation"><summary>English</summary><p>Vasily&#x27;s eyes clear for one instant. He forces out a word: &quot;...Пить.&quot; Water. Thirst.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_canteen_c0.jpg"><img src="../../godot_project/art/60_ui/cg/cg_canteen_c0.jpg" alt="费奥多尔的回访 第 2 页的 CG" loading="lazy"></a></div><div><a class="portrait" href="../../godot_project/art/10_characters/portraits/PRT_Fyodor_Sad.png"><img src="../../godot_project/art/10_characters/portraits/PRT_Fyodor_Sad.png" alt="游戏指定头像" loading="lazy"></a><p class="caption">两天后的深夜，你发着高烧回到食堂，在费奥多尔面前跪下。老人没有举起手，只摸了摸儿子渐渐冷下来的脸。</p><details class="translation"><summary>English</summary><p>Two nights later, feverish, you return to the canteen and kneel before Fyodor. He raises no hand; he only touches his son&#x27;s cooling face.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_canteen_c0b.jpg"><img src="../../godot_project/art/60_ui/cg/cg_canteen_c0b.jpg" alt="费奥多尔的回访 第 3 页的 CG" loading="lazy"></a></div><div><a class="portrait" href="../../godot_project/art/10_characters/portraits/PRT_Fyodor_Calm.png"><img src="../../godot_project/art/10_characters/portraits/PRT_Fyodor_Calm.png" alt="游戏指定头像" loading="lazy"></a><p class="caption">费奥多尔把瓦西里的旧坎肩披在你肩上：「别把他当成怪物。把他活着时候的名字写下来。」</p><details class="translation"><summary>English</summary><p>Fyodor lays Vasily&#x27;s old vest over your shoulders. &quot;Do not call him a monster. Write down the name he had while he was alive.&quot;</p></details></div></li></ol></details>
<details class="record" id="deck-canteen-73" data-group="战役对白" data-search="东街食堂 战役对白 第二幕 / 东街工人食堂 · 后厨 / 战役对白 阿列克谢、瓦西里、费奥多尔 canteen"><summary><strong>东街食堂</strong><span>第二幕 / 东街工人食堂 · 后厨 / 战役对白</span></summary><p class="cast">出场或被记录人物　阿列克谢、瓦西里、费奥多尔</p><p> <a href="#map-canteen">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_canteen_scene.jpg"><img src="../../godot_project/art/60_ui/cg/cg_canteen_scene.jpg" alt="东街食堂 第 1 页的 CG" loading="lazy"></a></div><div><p><b>旁白 / 阿列克谢</b>  东街工人食堂。</p><p><b>旁白 / 阿列克谢</b>  这里早在一个月前就停止了集中供应，整栋建筑被列入“账面清空区”。但阿列克谢知道，老炊事员费奥多尔依然躲在后厨，守着地窖里仅剩的三袋陈化黑麦粒，偷偷给附近滞留的十九个老铁路工熬糊糊。</p><p><b>旁白 / 阿列克谢</b>  后厨弥漫着酸败的油脂味和发馊的面粉气味。地面积着寸许厚的黑水，水面上浮着薄冰。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢挑开破烂的布帘跨进后厨。灶台边，费奥多尔老爹正蹲在地上用小煤炉煮雪水，磨旧的袖口沾着炉灰。</p><p><b>费奥多尔</b> （抬头看了看阿列克谢） 阿廖沙……你来得不巧。锅里只有雪水。地窖快见底了。</p><p><b>旁白 / 阿列克谢</b>  话音未落，储藏室那扇用粗铁丝捆着的木门突然发出了一声沉重的闷响。</p><p><b>旁白 / 阿列克谢</b>  嘭！</p><p><b>旁白 / 阿列克谢</b>  整扇木门被一股巨大的力量撞得向外凸起，木屑崩落。费奥多尔手里的铁勺当啷一声掉进水盆里，脸色刷地惨白。</p><p><b>费奥多尔</b> （声音剧烈发抖） 瓦西里……是我儿子！他前天夜里冒着大雪去给四楼瘫痪的老钳工送糊糊，半路上冻透了，回来就发起高烧……我把他锁在里头，给他灌了姜水，可他……他手上的皮全硬了……</p><p><b>旁白 / 阿列克谢</b>  木门在第二下撞击中彻底炸裂开来！</p><p><b>旁白 / 阿列克谢</b>  一个二十出头的小伙子从黑暗中跌撞着冲了出来。他浑身滚烫，呼出的白气带着刺鼻的酸臭味，右手背到小臂覆盖着一层厚厚的灰白角质硬鳞。他的双眼布满紫黑色的血翳，喉咙里发出类似风箱漏气般的急促喘息，毫无目标地挥舞着双手，一头撞翻了备餐的铁案台！</p><p><b>旁白 / 阿列克谢</b>  案台上的大铁盆砸在地上，发出震耳欲聋的巨响。瓦西里被巨响刺激，猛地扭过头，浑浊的眼睛锁定了站在门口的阿列克谢，嘶吼着扑了过来！</p><p><b>旁白 / 阿列克谢</b>  阿列克谢被撞得倒退数步，后背狠狠砸在冷藏柜锋利的铁角上，剧痛让他眼前一黑。瓦西里的力气大得惊人，滚烫的双手死死掐住了阿列克谢的脖子，口水和带血的泡沫滴在阿列克谢的镜片上。</p><p><b>旁白 / 阿列克谢</b>  空气被一点点抽离。阿列克谢的右手在油腻的砧板上胡乱摸索，手指触到了一个冰冷沉重的木柄——那是费奥多尔砍冻猪肉用的宽背砍骨刀。</p><p><b>旁白 / 阿列克谢</b>  生死只在一瞬。恐惧彻底压垮了理智。</p><details class="translation"><summary>English</summary><p>East Street Workers&#x27; Canteen.</p><p>Centralized food distribution here stopped a full month ago; the whole building was marked a “ledger-cleared zone.” But Aleksei knows the one-eyed old cook Fyodor is still hiding in the kitchen, guarding the last three sacks of aged rye in the cellar and quietly boiling gruel for the nineteen old railway workers stranded nearby.</p><p>The kitchen reeks of rancid fat and sour flour. An inch of black water lies on the floor, with a skin of thin ice floating on it.</p><p>Aleksei pushes aside the ragged cloth curtain and steps into the kitchen. By the stove, old Fyodor crouches on the floor, boiling snow water over a small coal brazier, the black leather patch over his one eye worn shiny.</p><p>Alyosha... you&#x27;ve come at a bad time. There&#x27;s only snow water in the pot. The cellar&#x27;s nearly empty.</p><p>Before the words are out, the storeroom door — a plank bound with coarse iron wire — gives a heavy, muffled thud.</p><p>Bang!</p><p>The whole door bows outward under some tremendous force, splinters flying. The iron ladle clatters out of Fyodor&#x27;s hand into the washbasin, and his face goes white in an instant.</p><p>Vasily... he&#x27;s my son! The night before last he went out in the blizzard to take gruel to the paralysed old fitter on the fourth floor, and was frozen through before he got back — then the fever took him... I locked him in and gave him ginger water, but his... the skin on his hands has all gone hard...</p><p>The door bursts completely apart on the second impact!</p><p>A young man, barely twenty, staggers out of the darkness. He is burning hot; the white breath from his mouth carries a sharp, sour stench. His right hand and forearm are covered in a thick layer of grey-white keratinous scale. Purple-black clouds fill his eyes, and a rapid, bellows-leaking rasp works in his throat. He flails blindly and crashes headlong into the steel prep table, upsetting it.</p><p>The great iron basin on the table hits the floor with a deafening clang. The noise jolts Vasily: his head snaps round, his clouded eyes fix on Aleksei in the doorway, and he lunges with a shriek.</p><p>The blow drives Aleksei back several steps; his spine strikes the sharp iron corner of the cold-storage cabinet, and the pain blacks out his sight. Vasily&#x27;s strength is terrifying. His scalding hands lock around Aleksei&#x27;s throat, and spittle and bloody foam drip onto the lenses of his glasses.</p><p>The air is drawn out of him bit by bit. Aleksei&#x27;s right hand gropes blindly over the greasy chopping block, and his fingers close on a cold, heavy wooden handle — Fyodor&#x27;s broad-backed cleaver for frozen pork.</p><p>Life and death turn on a single instant. Fear breaks reason utterly.</p></details><aside><strong>选项与回执</strong><ol><li>进入后厨，保护自己并制住瓦西里<p>你推开后厨的门。费奥多尔守在瓦西里身边；刀架上的宽背砍骨刀已被你取下。</p><details class="translation"><summary>English</summary><p>Enter the kitchen, defend yourself and stop Vasily You enter the kitchen. Fyodor stays beside Vasily; the heavy cleaver is no longer in its block.</p></details></li></ol></aside></div></li></ol></details>
<details class="record" id="deck-sanitarium-80" data-group="战役对白" data-search="回退手稿 战役对白 第二幕 / 旧传染病疗养院 · 地下室 / 战役对白 阿列克谢、梁诺夫、古丽娅、安娜 sanitarium"><summary><strong>回退手稿</strong><span>第二幕 / 旧传染病疗养院 · 地下室 / 战役对白</span></summary><p class="cast">出场或被记录人物　阿列克谢、梁诺夫、古丽娅、安娜</p><p> <a href="#map-sanitarium">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_sanitarium_anna_cage_no_ash.jpg"><img src="../../godot_project/art/60_ui/cg/cg_sanitarium_anna_cage_no_ash.jpg" alt="回退手稿 第 1 页的 CG" loading="lazy"></a></div><div><p><b>旁白 / 阿列克谢</b>  旧传染病疗养院地下二层。</p><p><b>旁白 / 阿列克谢</b>  这里曾经是结核病隔离病区，阴暗潮湿的水泥墙上结满了白色的硝霜。空气中弥漫着高浓度石炭酸与腐烂组织的怪味。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢穿过堆满铁架床的走廊，在一间焊着厚铁栏杆的配药室里见到了前铁路医院副院长梁诺夫医生，以及他的学生、流调员古丽娅。</p><p><b>旁白 / 阿列克谢</b>  在靠墙的一张铁床上，用医用牛皮带死死绑着一个年轻女孩。女孩整整昏迷了三天，手腕被皮带磨得皮开肉绽。但此刻，她身上的高热正在消退，原本硬化如蛇皮的灰白角质正大片大片地从胸口和颈部剥落，露出底下粉红色的新生皮肤。女孩正发出虚弱但均匀的呼吸声。</p><p><b>旁白 / 阿列克谢</b>  古丽娅医师眼睛通红，手里紧紧攥着三页薄薄的病历纸，纸角浸透了黄褐色的药水污渍。</p><p><b>古丽娅</b> （把病历纸塞到阿列克谢眼前，手指由于激动而泛白） 第三十七例！阿廖沙，这是第三十七例完整记录！只要给他们水，熬过第四天的高热神经风暴，灰鳞就会剥落！这不是绝症，它是一种远古孢子引发的急性自限性肺泡炎！人能自己挺过来！</p><p><b>旁白 / 阿列克谢</b>  阿列克谢接过那三页《回退临床手稿》。上面的每一行数据、每一个体温曲线，都用蓝黑墨水记录得清清楚楚。但在最后一页的末尾，盖着一个刺眼的红色长方形印章：【退回 · 结论含有动摇防线内容 · 不予归档】。</p><p><b>梁诺夫医生</b> （坐在药箱上，用止血钳夹着棉球擦拭眼镜） 三天前，我把手稿交给了督察专员。他甚至没翻开第二页，直接当着我的面扔进了碎纸炉。他说：‘梁诺夫同志，布拉风号已经拉走了四千人，乌拉尔山线已经平了四千笔账。如果你的报告是真的，那四千个被销账的人算什么？’</p><p><b>旁白 / 阿列克谢</b>  老医生的手停在半空，眼眶凹陷。</p><p><b>梁诺夫医生</b>  他们不是不知道人能好起来。他们是不能让活着的人好起来。活着的人一退烧，他们手里的枪和单子就全成了杀人罪证。</p><p><b>旁白 / 阿列克谢</b>  铁床上的女孩突然发出了一声微弱的呻吟。阿列克谢猛地转过头——那是安娜（档案号 0419）。</p><p><b>旁白 / 阿列克谢</b>  安娜艰难地睁开眼睛，瞳孔清澈透明。她看着阿列克谢胸前挂着的铁路调度工牌，又看了看阿列克谢大衣口袋里露出的妹妹照片，干裂的嘴唇吃力地开合：</p><p><b>安娜</b>  ……照片……0420……是拉娜护士吗？</p><p><b>旁白 / 阿列克谢</b>  阿列克谢像触电一样冲到铁床边，单膝跪地。</p><p><b>阿列克谢</b>  你见过她？！拉娜在哪儿？！</p><p><b>安娜</b>  在第三节车厢……三天前，我们在同一个留观站……她帮我把水壶藏在靴筒里……她手上的灰鳞也掉了，她一直在哭，她说她哥在货运站，她哥一定会去接她……然后清杀队就来了，把我们像牲口一样赶上了铁皮车……我因为休克被当成死人扔下了站台……她还在车里……</p><details class="translation"><summary>English</summary><p>Old Infectious Disease Sanatorium, second basement level.</p><p>This was once a tuberculosis isolation ward; white nitrate frost has bloomed across the dark, damp concrete. The air is heavy with the strange reek of strong carbolic acid and rotting tissue.</p><p>Aleksei passes down a corridor heaped with iron-framed beds and finds Dr. Leonov, former deputy director of the railway hospital, together with his student, the epidemiologist Gulya, in a dispensary room behind thick welded iron bars.</p><p>On an iron bed against the wall a young girl is bound fast with medical leather straps. She has been unconscious for three full days, her wrists rubbed raw by the belts. But now her fever is breaking: the grey-white keratin, hardened like snakeskin, is sloughing off her chest and neck in great sheets, revealing pink new skin beneath. Her breathing is faint but even.</p><p>Dr. Gulya&#x27;s eyes are red-rimmed; she clutches three thin sheets of case notes in her hand, their corners soaked through with yellow-brown medicine stains.</p><p>The thirty-seventh case! Alyosha, this is the thirty-seventh complete record! Give them water, let them live through the fourth-day fever storm, and the Grey Scale sloughs away! This is no terminal illness — it is an acute self-limiting alveolitis brought on by an ancient spore! People can pull through on their own!</p><p>Aleksei takes the three pages of the Clinical Regression Manuscript. Every line of data, every temperature curve, is set down plainly in blue-black ink. But at the foot of the last page is a glaring red rectangular stamp: [REJECTED · CONCLUSIONS CONTAIN MATERIAL THAT UNDERMINES THE LINE · NOT TO BE FILED].</p><p>Three days ago I handed the manuscript to the inspector. He did not even open the second page — he threw it into the shredder before my eyes. He said: “Comrade Leonov, the armoured train Buran has already carried away four thousand people, and the Ural line has balanced four thousand accounts. If your report is true, what does that make those four thousand written-off souls?”</p><p>The old doctor&#x27;s hand hangs motionless in mid-air; his eyes are sunken in their sockets.</p><p>It is not that they don&#x27;t know people can get better. They cannot allow the living to get better. The moment a living person&#x27;s fever breaks, the guns and the forms in their hands become evidence of murder.</p><p>The girl on the iron bed lets out a faint moan. Aleksei whips his head round — it is Anna (file 0419).</p><p>Anna opens her eyes with an effort, her pupils clear and transparent. She looks at the railway dispatcher&#x27;s badge hanging on Aleksei&#x27;s chest, then at the photograph of his sister showing in his coat pocket, and her cracked lips part with difficulty:</p><p>“...The photograph... 0420... is that Nurse Lana?”</p><p>Aleksei rushes to the iron bed as though struck by lightning and drops to one knee.</p><p>You&#x27;ve seen her?! Where is Lana?!</p><p>In Carriage No. 3... three days ago we were at the same observation station... she helped me hide my water flask in my boot... the Grey Scale had fallen from her hands too, and she kept crying, saying her brother was at the freight depot, that her brother would surely come for her... then the OSK came and herded us onto the boxcar like cattle... I went into shock and they threw me off the platform as dead... she&#x27;s still in there...</p></details><aside><strong>选项与回执</strong><ol><li>撬开铁笼，带她们走（消耗 1 份救援药品）<p>你用撬棍崩开了生锈的笼锁，替她解开了嵌进肉里的皮带。安娜（0419）与古丽娅医师搀扶着跟上了你，铁笼门轴在极夜的风雪里发出一声长长的、如释重负的悲鸣。</p><details class="translation"><summary>English</summary><p>Pry the cage. Bring them out. (-1 medical) Anna (0419) and Dr. Gulya join. The cage hinge screams in the snow.</p></details></li></ol></aside></div></li></ol></details>

<details class="record" id="deck-market_refuge-7" data-group="602 室" data-search="失母后的黑市暂住 602 室 第三幕 / 铁路黑市（废弃工人镇） / 602 室 阿列克谢 market_refuge"><summary><strong>失母后的黑市暂住</strong><span>第三幕 / 铁路黑市（废弃工人镇） / 602 室</span></summary><p class="cast">出场或被记录人物　阿列克谢</p><p> <a href="#map-market">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/40_interiors/BG_Market_Hideout.png"><img src="../../godot_project/art/40_interiors/BG_Market_Hideout.png" alt="失母后的黑市暂住 第 1 页的 CG" loading="lazy"></a></div><div><p class="caption">废信号室的短波机还活着。阿列克谢把门栓扣上，在炉边留下一盏遮光灯。这里不安全，却能让他在黑市搜捕间隙喘口气。</p><details class="translation"><summary>English</summary><p>The shortwave set in the abandoned signal room still works. Aleksei bolts the door and shades a lamp by the stove. It is not safe, but it gives him a place to breathe between market searches.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/40_interiors/BG_Market_Hideout.png"><img src="../../godot_project/art/40_interiors/BG_Market_Hideout.png" alt="失母后的黑市暂住 第 2 页的 CG" loading="lazy"></a></div><div><p class="caption">这不是家。他还会回 602 看一眼母亲留下的东西，再沿着维京娜无心说出的线索去找拉娜。</p><details class="translation"><summary>English</summary><p>This is not home. He will return to 602 for what Mother left behind, then follow Vikina&#x27;s offhand clue to Lana.</p></details></div></li></ol></details>

<details class="record" id="deck-market-74" data-group="战役对白" data-search="黑市与老轨 战役对白 第三幕 / 铁路黑市（废弃工人镇） / 战役对白 阿列克谢、药贩、伊万 market"><summary><strong>黑市与老轨</strong><span>第三幕 / 铁路黑市（废弃工人镇） / 战役对白</span></summary><p class="cast">出场或被记录人物　阿列克谢、药贩、伊万</p><p> <a href="#map-market">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_market_scene.jpg"><img src="../../godot_project/art/60_ui/cg/cg_market_scene.jpg" alt="黑市与老轨 第 1 页的 CG" loading="lazy"></a></div><div><p><b>旁白 / 阿列克谢</b>  午夜。废弃机车调车库。</p><p><b>旁白 / 阿列克谢</b>  这里是诺沃斯克-17 最后的地下黑市。几台锈迹斑斑的蒸汽机车之间，支着几十个低矮的帆布窝棚。几个冻得鼻涕横流的药贩子正围着一台老式矿石收音机，喇叭里正以极其隐蔽的杂音播放着调频 6.66 MHz 的循环暗号：【六六六……土豆换鳞粉……烙铁保平安……】</p><p><b>旁白 / 阿列克谢</b>  在车厢暗处，一个假药贩正将一根烧得通红的火烙铁按在一个工人的手背上。焦糊的人肉臭味伴随着惨叫声散开，工人原本轻微起鳞的手背被硬生生烫成一片焦黑的烂肉。</p><p><b>假药贩</b> （收走工人的手表，冷笑） 喊什么喊！烫成三级烧伤，清杀队的刮片枪就刮不出孢子反应！这就叫‘工业事故’，懂不懂？不然明早直接拉上铁壳号！</p><p><b>旁白 / 阿列克谢</b>  阿列克谢一把推开帘子，灰烬冲上去露出一口森白的犬齿，吓得药贩子缩进煤堆。</p><p><b>旁白 / 阿列克谢</b>  机车驾驶室里，老轨伊万正坐在悬空的铁座上，就着一听发绿的腌酸黄瓜喝着烈性工业酒精。</p><p><b>老轨伊万</b> （把一张浸透机油的列车时刻表拍在仪表盘上） 小子，布拉风号今晚二十三点整挂尾车。内务部特勤连压车，第三节闷罐车厢里装了一百七十六个退了烧的活人，终点不是什么疗养所，是乌拉尔鹰嘴崖 3 号废弃矿坑。他们要在那里用铝热剂炸山灭口。你妹妹就在那节车厢里。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢抓起时刻表，指节发白。</p><p><b>阿列克谢</b>  你怎么混进编组站的？</p><p><b>老轨伊万</b> （吐了口浓痰） 老子在西伯利亚开这趟鬼车开了二十五年！每节车厢的制动气阀在哪儿，老子闭着眼都能摸着。我只能在鹰嘴崖大弯道帮你把紧急制动闸拉下一半。能不能撬开门把人拖出来，看你自己的造化。</p><details class="translation"><summary>English</summary><p>Midnight. The abandoned locomotive roundhouse.</p><p>This was the last underground black market in Novorsk-17. Between several rust-eaten steam locomotives stood dozens of low canvas stalls. A few drug peddlers, their noses running with the cold, huddled around an old crystal radio; from its speaker, hidden under a veil of static, came a repeating code on 6.66 MHz: [Six-six-six... potatoes for scale-powder... the branding iron keeps you safe...]</p><p>In the dark of a boxcar, a fake-medicine peddler was pressing a red-hot branding iron against a worker&#x27;s hand. The reek of scorched flesh spread with the man&#x27;s screams; the back of his hand, where the scales had only just begun to show, was seared into a charred mass of raw meat.</p><p>What are you screaming for! Burn it to a third-degree burn and the OSK scraper-guns won&#x27;t get any spore reaction! That&#x27;s what we call an &#x27;industrial accident&#x27; - understand? Otherwise tomorrow morning they&#x27;ll drag you straight onto the armoured train Buran!</p><p>Aleksei flung the curtain aside; Ash lunged forward, baring a mouth of glistening white fangs, and the peddler shrank back into the coal heap.</p><p>In the locomotive cab, Old Ivan sat on a hanging iron seat, drinking potent industrial alcohol and chasing it with a tin of green pickles.</p><p>Listen, kid. The Buran takes its tail car at twenty-three hundred tonight. A Ministry of Internal Affairs special-duty company is riding guard; the third boxcar holds a hundred and seventy-six people whose fevers have broken - still alive. Their destination isn&#x27;t some sanatorium, it&#x27;s the abandoned No. 3 mine pit at Eagle&#x27;s Crag in the Urals. They&#x27;re going to bring the mountain down with thermite and silence them all. Your sister is in that very boxcar.</p><p>Aleksei snatched up the timetable, his knuckles white.</p><p>How did you get into the marshalling yard?</p><p>Twenty-five years I&#x27;ve driven this ghost train across Siberia! I can find the brake air valve on every car with my eyes shut. At Eagle&#x27;s Crag, on the big curve, all I can do is pull the emergency brake halfway for you. Whether you can pry that door open and drag them out - that&#x27;s down to your own luck.</p></details><aside><strong>选项与回执</strong><ol><li>C1 公平交易：付 2 废钢买路线（中立）<p>伊万收下废钢。油纸背面还多了一串短波坐标：6.66 MHz。那不是庄园路线，而是一处藏在市场里的信号源。</p><details class="translation"><summary>English</summary><p>C1 Fair trade: pay 2 Scrap for the route Ivan takes the scrap. On the back of the oil paper is a shortwave coordinate: 6.66 MHz. It points to a hidden transmitter in the market.</p></details></li><li>C3 倾囊相助：把抗生素分给这里冻伤的人（良知▲）<p>看着你把救命的药塞进冻烂脚趾的苦人手里，伊万把一只烤热的厚帆布手套塞进你怀里。他还在油纸上圈出短波频率 6.66 MHz，告诉你去市场最深的电台棚找信号源。</p><details class="translation"><summary>English</summary><p>C3 Give everything: hand out your antibiotics Old Ivan joins your crew and marks a 6.66 MHz signal source at the deepest market stall.</p></details></li><li>C2 背叛：趁他引开哨兵，锁死铁门拿走磁卡（良知▼·卌+1）<p>沉重的铁门被你从外头死死落了锁。门后先是一声难以置信的闷哼，紧接着是微声步枪短促得像踩碎冰碴似的点射声。你的背包被抢来的物资撑得满满当当，可你的灵魂却在日志背面多了一道洗不掉的血痕。</p><details class="translation"><summary>English</summary><p>C2 Betray: lock the door and take the keycard The door shuts behind you. The shots are very short.</p></details></li></ol></aside></div></li></ol></details>

 the door; find it alive.</p></details><aside><strong>选项与回执</strong><ol><li>C1 公平交易：付 2 废钢买路线（中立）<p>伊万收下废钢。油纸背面还多了一串短波坐标：6.66 MHz。那不是庄园路线，而是一处藏在市场里的信号源。</p><details class="translation"><summary>English</summary><p>C1 Fair trade: pay 2 Scrap for the route Ivan takes the scrap. On the back of the oil paper is a shortwave coordinate: 6.66 MHz. It points to a hidden transmitter in the market.</p></details></li><li>C3 倾囊相助：把抗生素分给这里冻伤的人（良知▲）<p>看着你把救命的药塞进冻烂脚趾的苦人手里，伊万把一只烤热的厚帆布手套塞进你怀里。他还在油纸上圈出短波频率 6.66 MHz，告诉你去市场最深的电台棚找信号源。</p><details class="translation"><summary>English</summary><p>C3 Give everything: hand out your antibiotics Old Ivan joins your crew and marks a 6.66 MHz signal source at the deepest market stall.</p></details></li><li>C2 背叛：趁他引开哨兵，锁死铁门拿走磁卡（良知▼·卌+1）<p>沉重的铁门被你从外头死死落了锁。门后先是一声难以置信的闷哼，紧接着是微声步枪短促得像踩碎冰碴似的点射声。你的背包被抢来的物资撑得满满当当，可你的灵魂却在日志背面多了一道洗不掉的血痕。</p><details class="translation"><summary>English</summary><p>C2 Betray: lock the door and take the keycard The door shuts behind you. The shots are very short.</p></details></li></ol></aside></div></li></ol></details>
<details class="record" id="deck-market-76" data-group="战役对白" data-search="黑市与老轨 战役对白 第三幕 / 铁路黑市（废弃工人镇） / 战役对白 / 失母／伊万同行 阿列克谢、药贩、伊万 market"><summary><strong>黑市与老轨</strong><span>第三幕 / 铁路黑市（废弃工人镇） / 战役对白 / 失母／伊万同行</span></summary><p class="cast">出场或被记录人物　阿列克谢、药贩、伊万</p><p> <a href="#map-market">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_market_scene.jpg"><img src="../../godot_project/art/60_ui/cg/cg_market_scene.jpg" alt="黑市与老轨 第 1 页的 CG" loading="lazy"></a></div><div><p><b>旁白 / 阿列克谢</b>  午夜。废弃机车调车库。</p><p><b>旁白 / 阿列克谢</b>  这里是诺沃斯克-17 最后的地下黑市。几台锈迹斑斑的蒸汽机车之间，支着几十个低矮的帆布窝棚。几个冻得鼻涕横流的药贩子正围着一台老式矿石收音机，喇叭里正以极其隐蔽的杂音播放着调频 6.66 MHz 的循环暗号：【六六六……土豆换鳞粉……烙铁保平安……】</p><p><b>旁白 / 阿列克谢</b>  在车厢暗处，一个假药贩正将一根烧得通红的火烙铁按在一个工人的手背上。焦糊的人肉臭味伴随着惨叫声散开，工人原本轻微起鳞的手背被硬生生烫成一片焦黑的烂肉。</p><p><b>假药贩</b> （收走工人的手表，冷笑） 喊什么喊！烫成三级烧伤，清杀队的刮片枪就刮不出孢子反应！这就叫‘工业事故’，懂不懂？不然明早直接拉上铁壳号！</p><p><b>旁白 / 阿列克谢</b>  阿列克谢一把推开帘子，灰烬冲上去露出一口森白的犬齿，吓得药贩子缩进煤堆。</p><p><b>旁白 / 阿列克谢</b>  机车驾驶室里，老轨伊万正坐在悬空的铁座上，就着一听发绿的腌酸黄瓜喝着烈性工业酒精。</p><p><b>老轨伊万</b> （把一张浸透机油的列车时刻表拍在仪表盘上） 小子，布拉风号今晚二十三点整挂尾车。内务部特勤连压车，第三节闷罐车厢里装了一百七十六个退了烧的活人，终点不是什么疗养所，是乌拉尔鹰嘴崖 3 号废弃矿坑。他们要在那里用铝热剂炸山灭口。你妹妹就在那节车厢里。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢抓起时刻表，指节发白。</p><p><b>阿列克谢</b>  你怎么混进编组站的？</p><p><b>老轨伊万</b> （吐了口浓痰） 老子在西伯利亚开这趟鬼车开了二十五年！每节车厢的制动气阀在哪儿，老子闭着眼都能摸着。我只能在鹰嘴崖大弯道帮你把紧急制动闸拉下一半。能不能撬开门把人拖出来，看你自己的造化。</p><p><b>阿列克谢</b>  母亲走后，602 室只剩那台停下来的机器。今晚我得找到一张床，哪怕只够躲过清杀队的搜查。</p><p><b>老轨伊万</b>  市场最里面有间废信号室，门后能睡人。先活着找到它，别问是谁把钥匙留在那儿。</p><details class="translation"><summary>English</summary><p>Midnight. The abandoned locomotive roundhouse.</p><p>This was the last underground black market in Novorsk-17. Between several rust-eaten steam locomotives stood dozens of low canvas stalls. A few drug peddlers, their noses running with the cold, huddled around an old crystal radio; from its speaker, hidden under a veil of static, came a repeating code on 6.66 MHz: [Six-six-six... potatoes for scale-powder... the branding iron keeps you safe...]</p><p>In the dark of a boxcar, a fake-medicine peddler was pressing a red-hot branding iron against a worker&#x27;s hand. The reek of scorched flesh spread with the man&#x27;s screams; the back of his hand, where the scales had only just begun to show, was seared into a charred mass of raw meat.</p><p>What are you screaming for! Burn it to a third-degree burn and the OSK scraper-guns won&#x27;t get any spore reaction! That&#x27;s what we call an &#x27;industrial accident&#x27; - understand? Otherwise tomorrow morning they&#x27;ll drag you straight onto the armoured train Buran!</p><p>Aleksei flung the curtain aside; Ash lunged forward, baring a mouth of glistening white fangs, and the peddler shrank back into the coal heap.</p><p>In the locomotive cab, Old Ivan sat on a hanging iron seat, drinking potent industrial alcohol and chasing it with a tin of green pickles.</p><p>Listen, kid. The Buran takes its tail car at twenty-three hundred tonight. A Ministry of Internal Affairs special-duty company is riding guard; the third boxcar holds a hundred and seventy-six people whose fevers have broken - still alive. Their destination isn&#x27;t some sanatorium, it&#x27;s the abandoned No. 3 mine pit at Eagle&#x27;s Crag in the Urals. They&#x27;re going to bring the mountain down with thermite and silence them all. Your sister is in that very boxcar.</p><p>Aleksei snatched up the timetable, his knuckles white.</p><p>How did you get into the marshalling yard?</p><p>Twenty-five years I&#x27;ve driven this ghost train across Siberia! I can find the brake air valve on every car with my eyes shut. At Eagle&#x27;s Crag, on the big curve, all I can do is pull the emergency brake halfway for you. Whether you can pry that door open and drag them out - that&#x27;s down to your own luck.</p><p>After Mother died, all that remained in Room 602 was the silent machine. Tonight I need a bed, even one that only hides me from OSK.</p><p>There&#x27;s an abandoned signal room at the back of the market. A person can sleep behind that door. Find it alive; don&#x27;t ask who left the key.</p></details><aside><strong>选项与回执</strong><ol><li>C1 公平交易：付 2 废钢买路线（中立）<p>伊万收下废钢。油纸背面还多了一串短波坐标：6.66 MHz。那不是庄园路线，而是一处藏在市场里的信号源。</p><details class="translation"><summary>English</summary><p>C1 Fair trade: pay 2 Scrap for the route Ivan takes the scrap. On the back of the oil paper is a shortwave coordinate: 6.66 MHz. It points to a hidden transmitter in the market.</p></details></li><li>C3 倾囊相助：把抗生素分给这里冻伤的人（良知▲）<p>看着你把救命的药塞进冻烂脚趾的苦人手里，伊万把一只烤热的厚帆布手套塞进你怀里。他还在油纸上圈出短波频率 6.66 MHz，告诉你去市场最深的电台棚找信号源。</p><details class="translation"><summary>English</summary><p>C3 Give everything: hand out your antibiotics Old Ivan joins your crew and marks a 6.66 MHz signal source at the deepest market stall.</p></details></li><li>C2 背叛：趁他引开哨兵，锁死铁门拿走磁卡（良知▼·卌+1）<p>沉重的铁门被你从外头死死落了锁。门后先是一声难以置信的闷哼，紧接着是微声步枪短促得像踩碎冰碴似的点射声。你的背包被抢来的物资撑得满满当当，可你的灵魂却在日志背面多了一道洗不掉的血痕。</p><details class="translation"><summary>English</summary><p>C2 Betray: lock the door and take the keycard The door shuts behind you. The shots are very short.</p></details></li></ol></aside></div></li></ol></details>
<details class="record" id="deck-market_refuge-77" data-group="战役对白" data-search="失母后的黑市暂住 战役对白 第三幕 / 铁路黑市（废弃工人镇） / 战役对白 阿列克谢 market_refuge"><summary><strong>失母后的黑市暂住</strong><span>第三幕 / 铁路黑市（废弃工人镇） / 战役对白</span></summary><p class="cast">出场或被记录人物　阿列克谢</p><p> <a href="#map-market">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/40_interiors/BG_Market_Hideout.png"><img src="../../godot_project/art/40_interiors/BG_Market_Hideout.png" alt="失母后的黑市暂住 第 1 页的 CG" loading="lazy"></a></div><div><p><b>阿列克谢</b>  废信号室的门在身后合上。炉子没烧起来，桌上只有一台还能收到微弱短波的旧电台。至少这里没有巡逻靴声。</p><p><b>旁白</b>  电台里断断续续传来一串调度呼号。阿列克谢把频率记进日志，没有听见熟悉的声音。</p><p><b>阿列克谢</b>  我会回来。妈妈的围巾还在床边，维京娜说过的那份底单也还没找到。先活过今晚，再继续找拉娜。</p><details class="translation"><summary>English</summary><p>The abandoned signal room door shuts behind him. The stove is cold; an old shortwave set on the table still catches a faint signal. At least there are no patrol boots here.</p><p>A broken dispatch call sign comes over the radio. Aleksei writes down the frequency and hears no familiar voice.</p><p>I&#x27;ll come back. Mother&#x27;s scarf is still by the bed, and I haven&#x27;t found the dispatch copy Vikina mentioned. First survive tonight; then keep looking for Lana.</p></details><aside><strong>选项与回执</strong><ol><li>锁好门，在短波声里歇一会儿<p>黑市栖身处能暂时躲开清杀队。602 室仍保留为母亲的纪念地和物资据点。</p><details class="translation"><summary>English</summary><p>Lock the door and rest to the shortwave The black-market refuge can hide you from OSK for now. Room 602 remains your memorial and supply base.</p></details></li></ol></aside></div></li></ol></details>
<details class="record" id="deck-market_refuge-78" data-group="战役对白" data-search="失母后的黑市暂住 战役对白 第三幕 / 铁路黑市（废弃工人镇） / 战役对白 / 伊万同行 阿列克谢、伊万 market_refuge"><summary><strong>失母后的黑市暂住</strong><span>第三幕 / 铁路黑市（废弃工人镇） / 战役对白 / 伊万同行</span></summary><p class="cast">出场或被记录人物　阿列克谢、伊万</p><p> <a href="#map-market">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/40_interiors/BG_Market_Hideout.png"><img src="../../godot_project/art/40_interiors/BG_Market_Hideout.png" alt="失母后的黑市暂住 第 1 页的 CG" loading="lazy"></a></div><div><p><b>阿列克谢</b>  废信号室的门在身后合上。炉子没烧起来，桌上只有一台还能收到微弱短波的旧电台。至少这里没有巡逻靴声。</p><p><b>老轨伊万</b>  别把这儿当家，阿廖沙。就当一段临时站台。等你缓过来，再回 602 把该带的东西拿上。</p><p><b>阿列克谢</b>  我会回来。妈妈的围巾还在床边，维京娜说过的那份底单也还没找到。先活过今晚，再继续找拉娜。</p><details class="translation"><summary>English</summary><p>The abandoned signal room door shuts behind him. The stove is cold; an old shortwave set on the table still catches a faint signal. At least there are no patrol boots here.</p><p>Don&#x27;t call this home, Alyosha. Think of it as a temporary platform. When you can stand again, go back to 602 for what you need.</p><p>I&#x27;ll come back. Mother&#x27;s scarf is still by the bed, and I haven&#x27;t found the dispatch copy Vikina mentioned. First survive tonight; then keep looking for Lana.</p></details><aside><strong>选项与回执</strong><ol><li>锁好门，在短波声里歇一会儿<p>黑市栖身处能暂时躲开清杀队。602 室仍保留为母亲的纪念地和物资据点。</p><details class="translation"><summary>English</summary><p>Lock the door and rest to the shortwave The black-market refuge can hide you from OSK for now. Room 602 remains your memorial and supply base.</p></details></li></ol></aside></div></li></ol></details>
<details class="record" id="deck-broadcast-79" data-group="战役对白" data-search="6.66 MHz 战役对白 第三幕 / 铁路黑市（废弃工人镇） / 战役对白 阿列克谢、叶莲娜 broadcast"><summary><strong>6.66 MHz</strong><span>第三幕 / 铁路黑市（废弃工人镇） / 战役对白</span></summary><p class="cast">出场或被记录人物　阿列克谢、叶莲娜</p><p> <a href="#map-market">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_broadcast_scene_alt_yelena.jpg"><img src="../../godot_project/art/60_ui/cg/cg_broadcast_scene_alt_yelena.jpg" alt="6.66 MHz 第 1 页的 CG" loading="lazy"></a></div><div><p><b>旁白 / 阿列克谢</b>  黑市收音机反复播出的杂音里藏着一串不属于药贩的短波节拍。阿列克谢沿着信号穿过废弃检修巷，在一间封死窗户的旧信号室里找到发射机。电池、手摇发电柄和几张被压在旋钮下的庄园平面图说明，这里有人持续工作了很久。</p><p><b>旁白 / 阿列克谢</b>  门后的女人没有举枪。她先关掉发射机，再把监听耳机摘下来。她是茹科夫专员的女儿叶莲娜，也是这条秘密广播的架设者。她用低功率信号向城外的医疗救援频道通报退烧者仍然活着；她保留了一条从排污检修管进入松林庄园的路线。</p><p><b>旁白 / 阿列克谢</b>  叶莲娜留着金色长发，穿着剪裁合身、面料厚实的冬季外套，领口的毛边和袖口都打理得干净。她看起来比外面的人体面许多，但脸上没有庄园里那种安稳。</p><p><b>叶莲娜</b> （把频率表推到桌子中央） 你听见的不是求救，是我在确认谁还肯回应。庄园有我父亲的账本，也有你要找的车厢记录。排污管能送你进去，但我不再替他把活人写成零。</p><p><b>阿列克谢</b>  你知道这会让你失去什么吗？</p><p><b>叶莲娜</b>  知道。先把门打开，出去以后再算。</p><details class="translation"><summary>English</summary><p>Hidden in the static the black-market radio kept repeating was a shortwave rhythm that did not belong to the peddlers. Aleksei traced the signal through an abandoned maintenance alley and found the transmitter in an old signal room with its windows sealed shut. The batteries, the hand-cranked generator handle, and several manor floor plans wedged beneath the dials all said someone had been working here a long time.</p><p>The woman behind the door did not raise a gun. She switched off the transmitter first, then took off her monitoring headphones. She was Yelena, Commissioner Zhukov&#x27;s daughter - and the one who had built this secret broadcast. On a low-power signal she reported to the medical rescue channel outside the city that those whose fevers had broken were still alive; she had kept a route into Pine Manor through the sewage maintenance duct.</p><p>Yelena wore her fair hair long and a well-tailored winter coat of heavy cloth, the fur trim at the collar and cuffs kept clean. She looked far more presentable than the people outside, yet there was none of the manor&#x27;s ease on her face.</p><p>What you heard wasn&#x27;t a call for help. I was checking who still dared to answer. The manor has my father&#x27;s ledgers, and the carriage records you&#x27;re looking for. The sewage duct can get you in - but I won&#x27;t be the one to write living people down as zeros for him again.</p><p>Do you know what this will cost you?</p><p>I know. Open the door first - we&#x27;ll settle it once we&#x27;re outside.</p></details><aside><strong>选项与回执</strong><ol><li>带叶莲娜同行，按她的路线进入松林庄园<p>叶莲娜把频率表和排污路线交给你，背起自己的监听设备，跟你一起离开信号室。松林庄园的路线现在开放。</p><details class="translation"><summary>English</summary><p>Take Yelena with you and follow her route into Pine Manor Yelena gives you the frequency sheet and drainage route, shoulders her listening gear, and leaves with you. Pine Manor is now unlocked.</p></details></li><li>只记下排污路线，不带叶莲娜同行<p>你记下排污管路线，没有接过她的监听设备。叶莲娜留在信号室，松林庄园的入口已经找到。</p><details class="translation"><summary>English</summary><p>Copy the drainage route but leave Yelena behind You copy the drainage route but leave her listening gear. Yelena stays behind; the manor entrance is found.</p></details></li></ol></aside></div></li></ol></details>
<details class="record" id="deck-manor-82" data-group="战役对白" data-search="松林庄园 战役对白 第三幕 / 松林庄园 · 二号恒温库 / 战役对白 阿列克谢、茹科夫、维克多 manor"><summary><strong>松林庄园</strong><span>第三幕 / 松林庄园 · 二号恒温库 / 战役对白</span></summary><p class="cast">出场或被记录人物　阿列克谢、茹科夫、维克多</p><p> <a href="#map-manor">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_manor_scene.jpg"><img src="../../godot_project/art/60_ui/cg/cg_manor_scene.jpg" alt="松林庄园 第 1 页的 CG" loading="lazy"></a></div><div><p><b>旁白 / 阿列克谢</b>  松林庄园。这里是铁路局干部特供区。</p><p><b>旁白 / 阿列克谢</b>  与外面零下三十度的严寒截然相反，四米高压电网阻隔的高墙内，暖气片烧得滚烫，室内温度高达二十六度。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢穿过排污管潜入二号恒温特供库。刺眼的白炽灯下，码放着整齐划一的瑞士进口 409 批透析液、精制白面粉、整箱的新西兰黄油与带大理石花纹的冷冻牛排。</p><p><b>旁白 / 阿列克谢</b>  后勤处长维克多正指挥着四个穿白色防化服的工人，将一整推车临期的腹膜透析液和牛排推进熊熊燃烧的工业焚化炉。黑色油腻的焦烟顺着高耸的烟囱排向夜空，化作整座城市上空飘落的焦油黑雪。</p><p><b>阿列克谢</b> （从阴影中踏出，手里的道钉撬棍直指维克多） 全城每天为了半茶匙碎麦子去告密，你们把救命的药往炉子里填？！</p><p><b>旁白 / 阿列克谢</b>  维克多吓得倒退撞翻了推车。阴影里，松林庄园特权区主管茹科夫专员端着茶杯慢慢走了出来。他穿着剪裁合身的毛呢制服，脸上没有凶恶，只有一种深入骨髓的疲惫与冷淡。</p><p><b>茹科夫专员</b> （吹了吹茶水上的浮沫，示意工人继续往炉子里铲） 莫罗佐夫调度员。你以为我是个贪污犯？还是个以杀人为乐的疯子？</p><p><b>旁白 / 阿列克谢</b>  茹科夫拉开抽屉，掏出一本盖满公章的配给审计总账，扔在阿列克谢脚下。</p><p><b>茹科夫专员</b>  诺沃斯克-17 的主管道早就烂透了。主脑算得很清楚：煤炭储备只够撑三十天，药品只够供应六百人，而城里焊死在筒子楼里的活人有整整四万。如果不把三万人打成‘已注销’，如果不把他们送进矿坑，全城的蒸汽三天之内就会彻底耗尽。到时候，所有人——包括你、你妈、我和我的女儿，全都会冻死在床板上。三十箱药分给三百人，你信不信今晚半夜他们就能拿菜刀互相把门砸烂？……我不是恶人，莫罗佐夫。恶人早冻死了，留下来的是算账的。把门焊死，牺牲一部分人，剩下的至少能活到开春。</p><p><b>阿列克谢</b> （握紧撬棍，声音像从冰缝里挤出来） 可第三节车厢里的人，他们的烧已经退了！他们是活人！</p><p><b>茹科夫专员</b> （冷漠地看着他） 在电传机里，划掉的名字就是死人。如果他们是活人，那我们过去这一个月算什么？算刽子手？……莫罗佐夫，机器不能犯错。机器一犯错，整座城就会像雪崩一样塌掉。把枪放下，去地下室挑两箱牛排和一箱透析液带走，回你的 602 室去。就当这世上只有你母亲一个人。</p><p><b>茹科夫专员</b>  地下室还有几个人，名单上写的是零。桌上有一张配给凭条，也有能留下焚毁记录的底片。</p><p><b>阿列克谢</b>  门后还有人在敲。账本和配给都在眼前，我得先决定带走什么。</p><details class="translation"><summary>English</summary><p>Pine Manor. This was the privileged compound of the railway bureau&#x27;s cadres.</p><p>In brutal contrast to the minus-thirty cold outside, inside the high walls behind a four-metre high-voltage electric fence the radiators ran scalding hot and the air reached twenty-six degrees.</p><p>Aleksei slipped through the sewage duct into the No. 2 climate-controlled store. Beneath the glare of incandescent lamps stood neat rows of Swiss-imported Batch-409 dialysis fluid, refined white flour, crated New Zealand butter, and frozen steaks marbled with fat.</p><p>Logistics Chief Viktor was directing four workers in white chemical-protection suits as they shovelled a whole cartload of near-expiry peritoneal dialysis fluid and steaks into a roaring industrial incinerator. Black, greasy smoke climbed the towering chimney into the night sky and turned into tar-black snow drifting down over the whole city.</p><p>The whole city informs on its neighbours every day for half a teaspoon of cracked grain - and you&#x27;re shovelling life-saving medicine into the furnace?!</p><p>Viktor recoiled in fright and knocked over the cart. Out of the shadows came Commissioner Zhukov, the man who oversaw the privileged zone of Pine Manor, a teacup in his hand. He wore a well-tailored wool uniform, and there was no cruelty on his face - only a weariness and coldness that went to the bone.</p><p>Dispatcher Morozov. Do you take me for an embezzler? Or a madman who kills for pleasure?</p><p>Zhukov pulled out a drawer, took out a ration-audit master ledger stamped all over with official seals, and threw it down at Aleksei&#x27;s feet.</p><p>Novorsk-17&#x27;s main pipeline rotted through long ago. The central brain worked it out precisely: the coal reserves would last thirty days, the medicine could supply six hundred people - and there were forty thousand living people sealed into the Khrushchyovka blocks. Unless thirty thousand of them were written off as &#x27;deregistered&#x27;, unless they were sent into the mines, the city&#x27;s steam would be utterly exhausted within three days. When that happened, everyone - you, your mother, me, my daughter - would freeze to death on their bedboards. Divide thirty crates of medicine among three hundred people, and I promise you, by midnight tonight they&#x27;d be battering down each other&#x27;s doors with kitchen knives. ... I&#x27;m not a villain, Morozov. The villains froze to death long ago. What&#x27;s left are the ones who keep the accounts. Weld the doors shut, sacrifice a portion, and the rest may live at least until spring.</p><p>But the people in the third carriage - their fevers have broken! They&#x27;re alive!</p><p>On the teletype, a name crossed out is a dead man. If they&#x27;re alive, then what have we been for the past month? Executioners? ... Morozov, the machine cannot make mistakes. Once the machine makes a mistake, the whole city comes down like an avalanche. Put the gun down, go down to the cellar, pick out two crates of steak and one of dialysis fluid, and take them back to your Room 602. Just pretend your mother is the only person left in the world.</p><p>There are several people in the cellar; the list calls them zero. On the desk are a ration slip and a negative that can preserve the burn record.</p><p>Someone is still knocking behind the door. The ledger and ration are in front of me; I have to decide what to take first.</p></details><aside><strong>选项与回执</strong><ol><li>留下台账照片，带走 409 批透析液<p>你把相机握紧。先留下能对上账本的证据，再带透析液离开。</p><details class="translation"><summary>English</summary><p>Keep the ledger photograph and take Batch-409 fluid. You hold on to the camera. First preserve evidence that can be checked against the ledger, then take the fluid out.</p></details></li><li>把老谢苗的藏身点交给茹科夫，换取配给<p>你接过一张空白配给凭条。老谢苗的藏身处还没有写上去。</p><details class="translation"><summary>English</summary><p>Give Zhukov old Semyon&#x27;s hiding place in exchange for a ration allocation. You take a blank ration slip. Old Semyon&#x27;s hiding place is not written on it yet.</p></details></li><li>趁对峙打开地下室，让工人先走<p>地下室的敲门声没有停。你记下了门禁锁盒的位置。</p><details class="translation"><summary>English</summary><p>Open the cellar during the confrontation and let the workers leave first. The cellar knocking continues. You note the position of the access lock box.</p></details></li></ol></aside></div></li></ol></details>

 the position of the access lock box.</p></details></li></ol></aside></div></li></ol></details>

<details class="record" id="deck-archive_copy-31" data-group="现场与余波" data-search="档案馆退件 现场与余波 调查支线 / 档案馆电报局 / 现场与余波 阿列克谢 archive_copy"><summary><strong>档案馆退件</strong><span>调查支线 / 档案馆电报局 / 现场与余波</span></summary><p class="cast">出场或被记录人物　阿列克谢</p><p> <a href="#map-archive">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_archive_0420_dispatch_copy.jpg"><img src="../../godot_project/art/60_ui/cg/cg_archive_0420_dispatch_copy.jpg" alt="档案馆退件 第 1 页的 CG" loading="lazy"></a></div><div><p class="caption">你从档案馆带回 0420 号退件底单。纸上没有销账章；第三节车厢仍是一件没有结案的事。</p><details class="translation"><summary>English</summary><p>You bring back the returned dispatch copy for File 0420. It has no closure stamp; Boxcar Three remains an unfinished case.</p></details></div></li></ol></details>
