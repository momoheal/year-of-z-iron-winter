 epidemiologist Gulya, in a dispensary room behind thick welded iron bars.</p><p>On an iron bed against the wall a young girl is bound fast with medical leather straps. She has been unconscious for three full days, her wrists rubbed raw by the belts. But now her fever is breaking: the grey-white keratin, hardened like snakeskin, is sloughing off her chest and neck in great sheets, revealing pink new skin beneath. Her breathing is faint but even.</p><p>Dr. Gulya&#x27;s eyes are red-rimmed; she clutches three thin sheets of case notes in her hand, their corners soaked through with yellow-brown medicine stains.</p><p>The thirty-seventh case! Alyosha, this is the thirty-seventh complete record! Give them water, let them live through the fourth-day fever storm, and the Grey Scale sloughs away! This is no terminal illness — it is an acute self-limiting alveolitis brought on by an ancient spore! People can pull through on their own!</p><p>Aleksei takes the three pages of the Clinical Regression Manuscript. Every line of data, every temperature curve, is set down plainly in blue-black ink. But at the foot of the last page is a glaring red rectangular stamp: [REJECTED · CONCLUSIONS CONTAIN MATERIAL THAT UNDERMINES THE LINE · NOT TO BE FILED].</p><p>Three days ago I handed the manuscript to the inspector. He did not even open the second page — he threw it into the shredder before my eyes. He said: “Comrade Leonov, the armoured train Buran has already carried away four thousand people, and the Ural line has balanced four thousand accounts. If your report is true, what does that make those four thousand written-off souls?”</p><p>The old doctor&#x27;s hand hangs motionless in mid-air; his eyes are sunken in their sockets.</p><p>It is not that they don&#x27;t know people can get better. They cannot allow the living to get better. The moment a living person&#x27;s fever breaks, the guns and the forms in their hands become evidence of murder.</p><p>The girl on the iron bed lets out a faint moan. Aleksei whips his head round — it is Anna (file 0419).</p><p>Anna opens her eyes with an effort, her pupils clear and transparent. She looks at the railway dispatcher&#x27;s badge hanging on Aleksei&#x27;s chest, then at the photograph of his sister showing in his coat pocket, and her cracked lips part with difficulty:</p><p>“...The photograph... 0420... is that Nurse Lana?”</p><p>Aleksei rushes to the iron bed as though struck by lightning and drops to one knee.</p><p>You&#x27;ve seen her?! Where is Lana?!</p><p>In Carriage No. 3... three days ago we were at the same observation station... she helped me hide my water flask in my boot... the Grey Scale had fallen from her hands too, and she kept crying, saying her brother was at the freight depot, that her brother would surely come for her... then the OSK came and herded us onto the boxcar like cattle... I went into shock and they threw me off the platform as dead... she&#x27;s still in there...</p></details><p class="caption">**【抉择 B · 手稿的归宿】**
- **B1（上交督察组）**：阿列克谢在巨大的恐惧下，把手稿交给了内务巡逻队换取两瓶腹透液。真相被彻底掩埋。日志背面划下血痕“|”。（**良知▼**，真结局关闭）。
- **B2（贴身保存）**：阿列克谢将三页手稿折好，缝进了自己棉大衣内胆贴近心口的位置：“老院长，只要我阿廖沙还有一口气，这几页纸就不会变成灰。”（**真相存活**，**良知▲**）。
- **B3（交老轨伊万）**：阿列克谢带手稿潜往黑市，交给老伊万通过铁路秘密线路翻印扩散。（**真相存活**）。</p></details>
<details class="record" id="script-3-1" data-group="文学剧本" data-search="第八章的分水岭 文学剧本 3-1 / 文学底稿（可与战役对白对照） "><summary><strong>第八章的分水岭</strong><span>3-1 / 文学底稿（可与战役对白对照）</span></summary><p><b>旁白 / 阿列克谢</b>  极夜的寒潮提前降临，室外气温跌破零下三十八度。</p><p><b>旁白 / 阿列克谢</b>  市政集中供暖管道在一声巨响后爆裂，高压蒸汽将整条街笼罩在白茫茫的死雾中，随后彻底冷却。赫鲁晓夫楼的铸铁暖气片在半小时内结了一层厚厚的白霜。</p><p><b>旁白 / 阿列克谢</b>  602 室的透析机由于电压骤降发出尖锐的报警蜂鸣。最后一袋瑞士 409 批腹膜透析液在昨夜用尽。</p><details class="translation"><summary>English</summary><p>The polar night&#x27;s cold wave came early; the temperature outside fell below minus thirty-eight degrees.</p><p>The municipal heating main burst with a great bang; high-pressure steam shrouded the whole street in a blank white fog of death, then went cold for good. Within half an hour the cast-iron radiators of the Khrushchyovka were coated in a thick white frost.</p><p>In Room 602 the dialysis machine shrieked a sharp alarm as the voltage plunged. The last bag of Swiss Batch-409 peritoneal dialysis fluid had run out the night before.</p></details><p class="caption">**【剧情分水岭判定：母亲的生死】**

- **分支 α（卡佳妈妈存活线）**：
  若玩家在前七章成功保住了至少三袋透析液并维持了室内临时煤炉供暖。阿列克谢在凌晨将换来的透析液接上管道。卡佳妈妈虽然极度虚弱，但呼吸逐渐平稳。她握住儿子的手：“去吧，阿廖沙……去把拉娜找回来……妈看着炉子，妈等你。”阿列克谢将家门钥匙贴身收好，转身踏入风雪。（进入**家园线**）。

- **分支 β（卡佳妈妈去世 · 失母荒原线）**：
  若透析液断供超过四十八小时。当阿列克谢推开门时，透析机已经显示长鸣的红字。床上的母亲蜷缩成一团，体重在尿毒症与极寒中消耗得只剩下七十二斤。卡佳妈妈在临终前拔掉了腹部的插管，把那床旧羊毛毯整整齐齐地叠在床头，留下一张被铅笔字擦花的硬纸片：*“阿廖沙，别换药了，换车票。带拉娜去南边。”*
  阿列克谢在冻得如铁板一样的床前跪了整整两个小时。他没有哭，只是默默脱下大衣，将母亲抱下六楼，安放在废弃洗车库避风的雪坑里。他用撬棍把 602 室的铁门彻底反锁，拔出钥匙扔进暴风雪中。心死之人的夜潜，变成了一场无所顾忌的复仇与寻死。</p></details>
<details class="record" id="script-3-2" data-group="文学剧本" data-search="黑市 6.66 MHz 与老轨的路线图 文学剧本 3-2 / 文学底稿（可与战役对白对照） "><summary><strong>黑市 6.66 MHz 与老轨的路线图</strong><span>3-2 / 文学底稿（可与战役对白对照）</span></summary><p><b>旁白 / 阿列克谢</b>  午夜。废弃机车调车库。</p><p><b>旁白 / 阿列克谢</b>  这里是诺沃斯克-17 最后的地下黑市。几台锈迹斑斑的蒸汽机车之间，支着几十个低矮的帆布窝棚。几个冻得鼻涕横流的药贩子正围着一台老式矿石收音机，喇叭里正以极其隐蔽的杂音播放着调频 6.66 MHz 的循环暗号：【六六六……土豆换鳞粉……烙铁保平安……】</p><p><b>旁白 / 阿列克谢</b>  在车厢暗处，一个假药贩正将一根烧得通红的火烙铁按在一个工人的手背上。焦糊的人肉臭味伴随着惨叫声散开，工人原本轻微起鳞的手背被硬生生烫成一片焦黑的烂肉。</p><p><b>假药贩</b> （收走工人的手表，冷笑） 喊什么喊！烫成三级烧伤，清杀队的刮片枪就刮不出孢子反应！这就叫‘工业事故’，懂不懂？不然明早直接拉上铁壳号！</p><p><b>旁白 / 阿列克谢</b>  阿列克谢一把推开帘子，灰烬冲上去露出一口森白的犬齿，吓得药贩子缩进煤堆。</p><p><b>旁白 / 阿列克谢</b>  机车驾驶室里，老轨伊万正坐在悬空的铁座上，就着一听发绿的腌酸黄瓜喝着烈性工业酒精。</p><p><b>老轨伊万</b> （把一张浸透机油的列车时刻表拍在仪表盘上） 小子，布拉风号今晚二十三点整挂尾车。内务部特勤连压车，第三节闷罐车厢里装了一百七十六个退了烧的活人，终点不是什么疗养所，是乌拉尔鹰嘴崖 3 号废弃矿坑。他们要在那里用铝热剂炸山灭口。你妹妹就在那节车厢里。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢抓起时刻表，指节发白。</p><p><b>阿列克谢</b>  你怎么混进编组站的？</p><p><b>老轨伊万</b> （吐了口浓痰） 老子在西伯利亚开这趟鬼车开了二十五年！每节车厢的制动气阀在哪儿，老子闭着眼都能摸着。我只能在鹰嘴崖大弯道帮你把紧急制动闸拉下一半。能不能撬开门把人拖出来，看你自己的造化。</p><details class="translation"><summary>English</summary><p>Midnight. The abandoned locomotive roundhouse.</p><p>This was the last underground black market in Novorsk-17. Between several rust-eaten steam locomotives stood dozens of low canvas stalls. A few drug peddlers, their noses running with the cold, huddled around an old crystal radio; from its speaker, hidden under a veil of static, came a repeating code on 6.66 MHz: [Six-six-six... potatoes for scale-powder... the branding iron keeps you safe...]</p><p>In the dark of a boxcar, a fake-medicine peddler was pressing a red-hot branding iron against a worker&#x27;s hand. The reek of scorched flesh spread with the man&#x27;s screams; the back of his hand, where the scales had only just begun to show, was seared into a charred mass of raw meat.</p><p>What are you screaming for! Burn it to a third-degree burn and the OSK scraper-guns won&#x27;t get any spore reaction! That&#x27;s what we call an &#x27;industrial accident&#x27; - understand? Otherwise tomorrow morning they&#x27;ll drag you straight onto the armoured train Buran!</p><p>Aleksei flung the curtain aside; Ash lunged forward, baring a mouth of glistening white fangs, and the peddler shrank back into the coal heap.</p><p>In the locomotive cab, Old Ivan sat on a hanging iron seat, drinking potent industrial alcohol and chasing it with a tin of green pickles.</p><p>Listen, kid. The Buran takes its tail car at twenty-three hundred tonight. A Ministry of Internal Affairs special-duty company is riding guard; the third boxcar holds a hundred and seventy-six people whose fevers have broken - still alive. Their destination isn&#x27;t some sanatorium, it&#x27;s the abandoned No. 3 mine pit at Eagle&#x27;s Crag in the Urals. They&#x27;re going to bring the mountain down with thermite and silence them all. Your sister is in that very boxcar.</p><p>Aleksei snatched up the timetable, his knuckles white.</p><p>How did you get into the marshalling yard?</p><p>Twenty-five years I&#x27;ve driven this ghost train across Siberia! I can find the brake air valve on every car with my eyes shut. At Eagle&#x27;s Crag, on the big curve, all I can do is pull the emergency brake halfway for you. Whether you can pry that door open and drag them out - that&#x27;s down to your own luck.</p></details><p class="caption"></p></details>
<details class="record" id="script-3-2A" data-group="文学剧本" data-search="六点六六兆赫与秘密广播点 文学剧本 3-2A / 文学底稿（可与战役对白对照） "><summary><strong>六点六六兆赫与秘密广播点</strong><span>3-2A / 文学底稿（可与战役对白对照）</span></summary><p><b>旁白 / 阿列克谢</b>  黑市收音机反复播出的杂音里藏着一串不属于药贩的短波节拍。阿列克谢沿着信号穿过废弃检修巷，在一间封死窗户的旧信号室里找到发射机。电池、手摇发电柄和几张被压在旋钮下的庄园平面图说明，这里有人持续工作了很久。</p><p><b>旁白 / 阿列克谢</b>  门后的女人没有举枪。她先关掉发射机，再把监听耳机摘下来。她是茹科夫专员的女儿叶莲娜，也是这条秘密广播的架设者。她用低功率信号向城外的医疗救援频道通报退烧者仍然活着；她保留了一条从排污检修管进入松林庄园的路线。</p><p><b>旁白 / 阿列克谢</b>  叶莲娜留着金色长发，穿着剪裁合身、面料厚实的冬季外套，领口的毛边和袖口都打理得干净。她看起来比外面的人体面许多，但脸上没有庄园里那种安稳。</p><p><b>叶莲娜</b> （把频率表推到桌子中央） 你听见的不是求救，是我在确认谁还肯回应。庄园有我父亲的账本，也有你要找的车厢记录。排污管能送你进去，但我不再替他把活人写成零。</p><p><b>阿列克谢</b>  你知道这会让你失去什么吗？</p><p><b>叶莲娜</b>  知道。先把门打开，出去以后再算。</p><details class="translation"><summary>English</summary><p>Hidden in the static the black-market radio kept repeating was a shortwave rhythm that did not belong to the peddlers. Aleksei traced the signal through an abandoned maintenance alley and found the transmitter in an old signal room with its windows sealed shut. The batteries, the hand-cranked generator handle, and several manor floor plans wedged beneath the dials all said someone had been working here a long time.</p><p>The woman behind the door did not raise a gun. She switched off the transmitter first, then took off her monitoring headphones. She was Yelena, Commissioner Zhukov&#x27;s daughter - and the one who had built this secret broadcast. On a low-power signal she reported to the medical rescue channel outside the city that those whose fevers had broken were still alive; she had kept a route into Pine Manor through the sewage maintenance duct.</p><p>Yelena wore her fair hair long and a well-tailored winter coat of heavy cloth, the fur trim at the collar and cuffs kept clean. She looked far more presentable than the people outside, yet there was none of the manor&#x27;s ease on her face.</p><p>What you heard wasn&#x27;t a call for help. I was checking who still dared to answer. The manor has my father&#x27;s ledgers, and the carriage records you&#x27;re looking for. The sewage duct can get you in - but I won&#x27;t be the one to write living people down as zeros for him again.</p><p>Do you know what this will cost you?</p><p>I know. Open the door first - we&#x27;ll settle it once we&#x27;re outside.</p></details><p class="caption">**【抉择 3-2A：接过频率表】**
- **带叶莲娜同行**：阿列克谢接过频率表。叶莲娜加入队伍；她可以命令最近且视线可达的 OSK 停步 8 秒，冷却 25 秒。她给出的排污路线解锁松林庄园。
- **拒绝她的帮助**：阿列克谢只抄下排污路线，不让叶莲娜同行。松林庄园仍可进入，但她不会成为伙伴。</p></details>
<details class="record" id="script-3-3" data-group="文学剧本" data-search="松林庄园的夜宴与茹科夫的账本 文学剧本 3-3 / 文学底稿（可与战役对白对照） "><summary><strong>松林庄园的夜宴与茹科夫的账本</strong><span>3-3 / 文学底稿（可与战役对白对照）</span></summary><p><b>旁白 / 阿列克谢</b>  松林庄园。这里是铁路局干部特供区。</p><p><b>旁白 / 阿列克谢</b>  与外面零下三十度的严寒截然相反，四米高压电网阻隔的高墙内，暖气片烧得滚烫，室内温度高达二十六度。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢穿过排污管潜入二号恒温特供库。刺眼的白炽灯下，码放着整齐划一的瑞士进口 409 批透析液、精制白面粉、整箱的新西兰黄油与带大理石花纹的冷冻牛排。</p><p><b>旁白 / 阿列克谢</b>  后勤处长维克多正指挥着四个穿白色防化服的工人，将一整推车临期的腹膜透析液和牛排推进熊熊燃烧的工业焚化炉。黑色油腻的焦烟顺着高耸的烟囱排向夜空，化作整座城市上空飘落的焦油黑雪。</p><p><b>阿列克谢</b> （从阴影中踏出，手里的道钉撬棍直指维克多） 全城每天为了半茶匙碎麦子去告密，你们把救命的药往炉子里填？！</p><p><b>旁白 / 阿列克谢</b>  维克多吓得倒退撞翻了推车。阴影里，松林庄园特权区主管茹科夫专员端着茶杯慢慢走了出来。他穿着剪裁合身的毛呢制服，脸上没有凶恶，只有一种深入骨髓的疲惫与冷淡。</p><p><b>茹科夫专员</b> （吹了吹茶水上的浮沫，示意工人继续往炉子里铲） 莫罗佐夫调度员。你以为我是个贪污犯？还是个以杀人为乐的疯子？</p><p><b>旁白 / 阿列克谢</b>  茹科夫拉开抽屉，掏出一本盖满公章的配给审计总账，扔在阿列克谢脚下。</p><p><b>茹科夫专员</b>  诺沃斯克-17 的主管道早就烂透了。主脑算得很清楚：煤炭储备只够撑三十天，药品只够供应六百人，而城里焊死在筒子楼里的活人有整整四万。如果不把三万人打成‘已注销’，如果不把他们送进矿坑，全城的蒸汽三天之内就会彻底耗尽。到时候，所有人——包括你、你妈、我和我的女儿，全都会冻死在床板上。三十箱药分给三百人，你信不信今晚半夜他们就能拿菜刀互相把门砸烂？……我不是恶人，莫罗佐夫。恶人早冻死了，留下来的是算账的。把门焊死，牺牲一部分人，剩下的至少能活到开春。</p><p><b>阿列克谢</b> （握紧撬棍，声音像从冰缝里挤出来） 可第三节车厢里的人，他们的烧已经退了！他们是活人！</p><p><b>茹科夫专员</b> （冷漠地看着他） 在电传机里，划掉的名字就是死人。如果他们是活人，那我们过去这一个月算什么？算刽子手？……莫罗佐夫，机器不能犯错。机器一犯错，整座城就会像雪崩一样塌掉。把枪放下，去地下室挑两箱牛排和一箱透析液带走，回你的 602 室去。就当这世上只有你母亲一个人。</p><details class="translation"><summary>English</summary><p>Pine Manor. This was the privileged compound of the railway bureau&#x27;s cadres.</p><p>In brutal contrast to the minus-thirty cold outside, inside the high walls behind a four-metre high-voltage electric fence the radiators ran scalding hot and the air reached twenty-six degrees.</p><p>Aleksei slipped through the sewage duct into the No. 2 climate-controlled store. Beneath the glare of incandescent lamps stood neat rows of Swiss-imported Batch-409 dialysis fluid, refined white flour, crated New Zealand butter, and frozen steaks marbled with fat.</p><p>Logistics Chief Viktor was directing four workers in white chemical-protection suits as they shovelled a whole cartload of near-expiry peritoneal dialysis fluid and steaks into a roaring industrial incinerator. Black, greasy smoke climbed the towering chimney into the night sky and turned into tar-black snow drifting down over the whole city.</p><p>The whole city informs on its neighbours every day for half a teaspoon of cracked grain - and you&#x27;re shovelling life-saving medicine into the furnace?!</p><p>Viktor recoiled in fright and knocked over the cart. Out of the shadows came Commissioner Zhukov, the man who oversaw the privileged zone of Pine Manor, a teacup in his hand. He wore a well-tailored wool uniform, and there was no cruelty on his face - only a weariness and coldness that went to the bone.</p><p>Dispatcher Morozov. Do you take me for an embezzler? Or a madman who kills for pleasure?</p><p>Zhukov pulled out a drawer, took out a ration-audit master ledger stamped all over with official seals, and threw it down at Aleksei&#x27;s feet.</p><p>Novorsk-17&#x27;s main pipeline rotted through long ago. The central brain worked it out precisely: the coal reserves would last thirty days, the medicine could supply six hundred people - and there were forty thousand living people sealed into the Khrushchyovka blocks. Unless thirty thousand of them were written off as &#x27;deregistered&#x27;, unless they were sent into the mines, the city&#x27;s steam would be utterly exhausted within three days. When that happened, everyone - you, your mother, me, my daughter - would freeze to death on their bedboards. Divide thirty crates of medicine among three hundred people, and I promise you, by midnight tonight they&#x27;d be battering down each other&#x27;s doors with kitchen knives. ... I&#x27;m not a villain, Morozov. The villains froze to death long ago. What&#x27;s left are the ones who keep the accounts. Weld the doors shut, sacrifice a portion, and the rest may live at least until spring.</p><p>But the people in the third carriage - their fevers have broken! They&#x27;re alive!</p><p>On the teletype, a name crossed out is a dead man. If they&#x27;re alive, then what have we been for the past month? Executioners? ... Morozov, the machine cannot make mistakes. Once the machine makes a mistake, the whole city comes down like an avalanche. Put the gun down, go down to the cellar, pick out two crates of steak and one of dialysis fluid, and take them back to your Room 602. Just pretend your mother is the only person left in the world.</p></details><p class="caption">**【抉择 C · 庄园的审判】**
- **C1（砸碎终端，抢药突围）**：阿列克谢一撬棍砸碎了焚化炉的温控电闸，抓起两袋急救透析液和药品样本，在警报声中跳窗遁入黑夜。（**良知▲**，获得关键证物【特供调拨底册】）。
- **C2（背叛逃民，妥协交换）**：阿列克谢接受了茹科夫的交易，指出地下室躲藏的老谢苗藏匿点以换取长期特供药配额。（**良知大跌**，日志划下一道深划痕“|”，真结局关闭）。
- **C3（破坏高压阀）**：阿列克谢拧开高压蒸汽排气阀制造大规模蒸汽爆炸，在浓烟中救走被囚禁的工人。（**良知▲**）。</p></details>
<details class="record" id="script-4-1" data-group="文学剧本" data-search="千层糕断面与远古粉尘 文学剧本 4-1 / 文学底稿（可与战役对白对照） "><summary><strong>千层糕断面与远古粉尘</strong><span>4-1 / 文学底稿（可与战役对白对照）</span></summary><p><b>旁白 / 阿列克谢</b>  暴风雪中的 3 号矿坑像大山被剖开的一道流脓的巨口。</p><p><b>旁白 / 阿列克谢</b>  主斜井深达地下两百米，轨道两侧散落着扭曲变形的矿车和风钻。这里的空气极其浑浊，手电筒的光柱照过去，空气中弥漫着无数微小闪烁的灰黑色荧光粉尘。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢换上了帕沙给的滤毒罐，面罩内侧立刻传来粗重闷热的呼吸声。灰烬走在前面，尾巴紧紧夹在两腿之间，它对着岩壁低声呜咽——那粉尘里有一种令人窒息的死寂，但没有任何狂暴的气息。</p><p><b>旁白 / 阿列克谢</b>  下潜到作业面最深处，一座被温压炸药炸开的巨大地质断面横亘在眼前。</p><p><b>旁白 / 阿列克谢</b>  断面如同被切开的千层糕：上面是黑色的煤系地层，中间是冻结了数万年的淡蓝永冻冰层，而在永冻层最深处，一道宽达数米的暗红色脉络被炸得粉碎，无数细密的灰白菌丝正从岩缝中渗出。</p><p><b>旁白 / 阿列克谢</b>  岩壁上用红油漆刷着巨大的庆功标语：【向十月献礼：深层冻土温压爆破掘进贯通！】</p><p><b>旁白 / 阿列克谢</b>  在贯通作业面的岩壁脚下，凌乱地刻满了矿工用凿子凿出的简短字句：
“瓦尼亚，别管我，带你弟跑。”
“打穿了。山里冒灰烟了。”
“不是煤，是粉。吸进去心口发烧。”</p><p><b>旁白 / 阿列克谢</b>  阿列克谢伸出戴着胶皮手套的手指，在断面边缘捻了捻那层粉末。</p><p><b>旁白 / 阿列克谢</b>  病根本不是境外敌对势力的生化袭击，也不是什么天降的神罚。</p><p><b>旁白 / 阿列克谢</b>  是官僚为了赶在节日指标前贯通铁路，不顾地质警告，强行动用温压爆破炸穿了万年永冻土，释放了深埋在冻土层下的远古真菌孢子！</p><details class="translation"><summary>English</summary><p>In the blizzard, No. 3 pit was like a great festering maw split open in the mountain.</p><p>The main incline ran two hundred metres underground, its rails littered on both sides with twisted mine carts and pneumatic drills. The air here was foul and thick; in the beam of a torch, countless tiny glittering grey-black fluorescent particles drifted through it.</p><p>Aleksei fitted the filter canister Pasha had given him; at once his own heavy, hot breathing filled the inside of the mask. Ash walked ahead, tail clamped tight between its legs, whimpering low at the rock wall - there was a suffocating dead stillness in that dust, but no trace of Rabid fury.</p><p>At the deepest part of the working face, a huge geological section blasted open by thermobaric charges lay stretched out before him.</p><p>The section was like a layer cake sliced open: on top, black coal-bearing strata; in the middle, a pale-blue permafrost ice layer frozen for tens of thousands of years; and at the very bottom of the permafrost, a dark-red vein several metres wide had been blown to pieces, countless fine grey-white fungal filaments oozing out of the cracks in the rock.</p><p>On the rock wall, huge characters in red paint proclaimed the celebration slogan: [An Offering to October: Deep Permafrost Thermobaric Blasting Drives the Tunnel Through!]</p><p>At the foot of the rock wall at the breakthrough face, the miners had scratched short lines roughly with their chisels:
&#x27;Vanya, don&#x27;t mind me - run, take your little brother.&#x27;
&#x27;We broke through. Grey smoke&#x27;s coming out of the mountain.&#x27;
&#x27;It isn&#x27;t coal, it&#x27;s dust. Breathe it in and your chest burns.&#x27;</p><p>Aleksei reached out a rubber-gloved finger and rubbed at the powder along the edge of the exposed face.</p><p>The sickness was no biological attack by hostile forces abroad, and no punishment sent from heaven.</p><p>It was bureaucrats, determined to drive the railway through ahead of the holiday quota, ignoring every geological warning, who forced a thermobaric blast through the ten-thousand-year permafrost and released the ancient fungal spores buried deep beneath it!</p></details><p class="caption"></p></details>
<details class="record" id="script-4-2" data-group="文学剧本" data-search="博伊科的起爆器与净账 文学剧本 4-2 / 文学底稿（可与战役对白对照） "><summary><strong>博伊科的起爆器与净账</strong><span>4-2 / 文学底稿（可与战役对白对照）</span></summary><p><b>旁白 / 阿列克谢</b>  运输大巷拐角的调度硐室里，电石灯发出刺啦刺啦的暗黄光线。</p><p><b>旁白 / 阿列克谢</b>  十几箱军用铝热剂燃烧装药整整齐齐地码放在轨道两侧，起爆电缆一直连接到工作台上一台绿色的十路手摇起爆器上。</p><p><b>旁白 / 阿列克谢</b>  留守技术员博伊科正瘫坐在起爆器旁。他扯开了领口，脖颈上布满了大片正在剥落的灰白角质硬鳞，胸口剧烈起伏，伴随着撕心裂肺的呛咳。他的手背通红，体温计摔碎在脚边，水银珠滚进了煤渣里。</p><p><b>旁白 / 阿列克谢</b>  看见手持撬棍的阿列克谢，博伊科没有去摸手枪，只是疲倦地把额头抵在冰冷的铁桌面上。</p><p><b>博伊科</b> （咳出一口带血的黑痰） ……你也是被逼着来装药的？……别费劲了，电缆我已经接过来了。</p><p><b>阿列克谢</b> （用手电照向墙上的工程图纸） 内务部下令炸山？</p><p><b>博伊科</b> （惨笑了一声，声音虚弱嘶哑） 上面说……只要炸塌这条巷道，把孢子断面彻底封死，矿上就没事了，外面的人也不用天天查体温了。任务代号叫‘净账’……多好听的名词啊。只要山一塌，把里面的一百七十六个人一起埋在里头，账面上的人数和实存人数就彻底‘闭合’了。可我儿子就在里头的掘进二队……他才十九岁，昨天他的高烧刚退下去，他还隔着铁门管我要烟抽……阿廖沙……我按不下去这颗雷管，可我也拆不掉它。巡逻队还有十五分钟交班，我要是没按，他们进来就会把我和我儿子一起当成感染者用喷火器烧死……</p><details class="translation"><summary>English</summary><p>In the dispatcher&#x27;s chamber at the bend of the main haulage way, a carbide lamp hissed with dim yellow light.</p><p>A dozen or more crates of military thermite incendiary charges were stacked in neat rows along both sides of the rails, their firing cable running all the way to a green ten-circuit hand-cranked detonator on the workbench.</p><p>Boyko, the technician left on watch, sat slumped beside the detonator. He had torn open his collar; his neck was covered in broad patches of grey-white keratinous hard scales, flaking off, and his chest heaved with wrenching, choking coughs. The backs of his hands were scarlet, a broken thermometer lay at his feet, its mercury beads rolling into the coal slag.</p><p>Seeing Aleksei with the crowbar in his hand, Boyko did not reach for his pistol; he only rested his forehead wearily against the cold iron tabletop.</p><p>...They forced you to come and plant the charges too? ... Don&#x27;t bother. I&#x27;ve already wired the cable.</p><p>The Ministry of Internal Affairs ordered the mountain blown up?</p><p>They said upstairs... if we just bring this gallery down and seal off the spore face completely, the mine will be in the clear, and the people outside won&#x27;t have to take their temperatures every day. The operation is codenamed &#x27;Clean Ledger&#x27;... what a pretty name. Once the mountain falls and buries all hundred and seventy-six people inside, the numbers on the ledger and the numbers actually alive will be &#x27;closed&#x27; for good. But my boy is in there, in No. 2 tunnelling team... he&#x27;s only nineteen, his fever broke just yesterday, and he was asking me for a cigarette through the iron door... Alyosha... I can&#x27;t press this detonator, and I can&#x27;t disarm it either. The patrol changes shift in fifteen minutes - if I don&#x27;t press it, they&#x27;ll come in and burn my son and me both as infected with flamethrowers...</p></details><p class="caption">**【抉择 E · 矿坑的证物与起爆线】**
- **E1（带走孢子岩芯与台账）**：阿列克谢用撬棍凿下一块包含完整菌丝的深层岩芯，翻拍并装走了爆破工程台账。这成了终幕广播中击溃官僚谎言的铁证。（**获得【矿坑核心证物】**）。
- **E2（破坏起爆电路，救助博伊科）**：阿列克谢切断了总起爆电缆，将抗生素分给博伊科，背着他从通风天井转移。清杀队未能按计划炸山，被迫在第五幕改用常规步枪和燃烧弹在谷底强攻。（**良知▲**，改变第五幕战场形态）。
- **E3（仅取炸药撤退）**：中立搜刮，不承担证物负重。</p></details>
<details class="record" id="script-5-1" data-group="文学剧本" data-search="焊死的单元门与大火托孤 文学剧本 5-1 / 文学底稿（可与战役对白对照） "><summary><strong>焊死的单元门与大火托孤</strong><span>5-1 / 文学底稿（可与战役对白对照）</span></summary><p><b>旁白 / 阿列克谢</b>  出城决战的前夜。第 3 工人居住区一楼配电室发生严重过载短路，引燃了堆积在走廊里的废弃木料和废防化服。</p><p><b>旁白 / 阿列克谢</b>  刺鼻的黑烟迅速顺着电梯井和楼梯通道向上倒灌，整栋赫鲁晓夫筒子楼化作一座封闭的炉膛。</p><p><b>旁白 / 阿列克谢</b>  底楼唯一的消防出口外面，横焊着一根重达半吨的工字钢横梁——那是七天前为了“确保封控严密”由工程队焊死的。</p><p><b>旁白 / 阿列克谢</b>  上百名居民被困在浓烟滚滚的楼梯缓台上，女人和孩子的尖叫声几乎撕裂夜空。墙上的应急对讲机里，区管委的电传系统依然在机械地循环播报：【火警破拆申请已受理 · 当前审批流转序号：47 · 请全体居民在户内就地等待】。</p><p><b>旁白 / 阿列克谢</b>  浓烟中，六十三岁的柳德米拉大娘被人群踩倒在三楼台阶上。她满脸黑灰，怀里死死护着五岁的外孙女佳娜。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢用湿毛巾捂住口鼻冲上楼梯，一把抓住了老人的胳膊。</p><p><b>旁白 / 阿列克谢</b>  柳德米拉剧烈咳嗽着，用力推开阿列克谢，把浑身发抖的小女孩硬生生推进了阿列克谢怀里。同时塞过来的，还有那张被大火熏黑的举报领粮券，上面的“告密者”三个黑字只剩下了半个残角。</p><p><b>柳德米拉大娘</b> （把佳娜的棉袄领子死死系紧，身子缩在烟火里，喘不上气） 阿廖沙……带佳娜走！别管我！我拿过他们的券，我身上脏……我出不去了！这张券你替我留着，等佳娜长大了你告诉她……她姥姥不是坏人……是叫这张破纸逼的！带她走啊——！！</p><p><b>旁白 / 阿列克谢</b>  老人转身扑向倒塌的木栏杆，用自己的后背挡住了上方滚落的一截燃烧木梁。</p><p><b>旁白 / 阿列克谢</b>  佳娜趴在阿列克谢的颈窝里，小脸被烟熏得黝黑，小手紧紧拽着阿列克谢的衣领，眼泪在黑灰里冲出两道白痕。她没有哭喊，只是用极细微的声音在阿列克谢耳边呢喃：</p><p><b>佳娜</b>  姥姥说把门焊上风就进不来了，可烟出不去，呛眼睛。叔叔，咱们的钥匙呢？</p><p><b>旁白 / 阿列克谢</b>  阿列克谢咬紧牙关，单臂将佳娜箍在怀中，另一手挥舞撬棍劈开燃烧的木板冲向底楼。</p><p><b>旁白 / 阿列克谢</b>  底楼大门前，七级老钳工帕维尔老爹正半跪在地上，手持剧烈喷射蓝白火舌的高压乙炔切割枪，顶着滚滚浓烟疯狂灼烧着焊死横梁的钢骨！</p><p><b>旁白 / 阿列克谢</b>  哧——！！</p><p><b>旁白 / 阿列克谢</b>  火星四溅，最后一块焊点在铁锤的猛击下断裂。上百名满脸黑灰的居民终于撞开铁门，像潮水一样跌滚进室外的暴风雪中。灰烬在雪地里迎上去，一口咬住佳娜的棉袄后摆，将女孩安全拖到了避风处。</p><p><b>旁白 / 阿列克谢</b>  帕维尔抹了一把脸上的焦油，扛起管钳看着阿列克谢。</p><p><b>帕维尔老爹</b>  车脱轨了。老伊万得手了。布拉风号在鹰嘴崖翻进了雪沟。小子，带上撬棍，我们去翻车！</p><details class="translation"><summary>English</summary><p>On the eve of the breakout, a severe overload short-circuited the ground-floor distribution room in Workers&#x27; District 3, setting fire to the scrap lumber and discarded chemical-protection suits stacked in the corridor.</p><p>Acrid black smoke poured up through the elevator shaft and stairwells, turning the entire Khrushchyovka block into a sealed furnace.</p><p>Across the building&#x27;s only ground-floor fire exit lay a half-ton I-beam welded in place—seven days earlier, a work crew had sealed it there &quot;to ensure the lockdown held tight.&quot;</p><p>More than a hundred residents were trapped on the smoke-choked stair landings, the screams of women and children all but tearing the night open. From the emergency intercom on the wall, the District Rationing Committee&#x27;s teletype kept droning the same bulletin: [Fire-break application received · Current approval routing number: 47 · All residents are to remain indoors and wait].</p><p>In the smoke, sixty-three-year-old Grandmother Lyudmila was trampled on the third-flight steps. Her face was black with soot; she shielded her five-year-old granddaughter Dyana against her chest.</p><p>Aleksei charged up the stairs with a wet cloth over his mouth and nose and caught the old woman by the arm.</p><p>Lyudmila coughed violently, shoved Aleksei aside, and thrust the trembling little girl into his arms. Pushed along with her was the soot-blackened denunciation coupon—of the three black characters &quot;informer&quot; on it, only a ragged half-corner remained.</p><p>Alyosha… take Dyana and go! Leave me! I took their coupon—I&#x27;m dirty… I can&#x27;t get out! Keep this coupon for me, and when Dyana&#x27;s grown, tell her… her grandmother was no bad woman… it was this scrap of paper that drove her to it! Take her away—!!</p><p>The old woman turned and flung herself at the broken wooden railing, taking the full force of a burning beam that rolled down from above on her back.</p><p>Dyana lay against Aleksei&#x27;s neck, her little face black with smoke, her small hands clutching his collar; tears had carved two white tracks through the soot. She did not cry out. She only whispered into his ear, very softly:</p><p>Grandma said if they welded the door shut the wind couldn&#x27;t get in—but the smoke can&#x27;t get out, and it stings your eyes. Mister, where are our keys?</p><p>Aleksei set his jaw, locked Dyana to him with one arm, and swung the crowbar with the other, splitting the burning boards as he fought his way down to the ground floor.</p><p>At the ground-floor door, Old Pavel, a Grade-7 fitter, was half-kneeling, a high-pressure oxy-acetylene torch spitting blue-white flame in his hands, burning furiously through the steel spine of the welded beam against the rolling smoke!</p><p>Hsss—!!</p><p>Sparks flew; the last weld gave way under a hammer blow. More than a hundred soot-faced residents finally broke the iron door and poured out into the blizzard like a flood, stumbling and rolling into the snow. Ash bounded into the drifts, caught the back of Dyana&#x27;s padded coat in its teeth, and dragged the girl safely out of the wind.</p><p>Pavel wiped the tar from his face, shouldered his pipe wrench, and looked at Aleksei.</p><p>The train&#x27;s off the rails. Old Ivan pulled the air brake. The Buran went over into a snow gully at Eagle&#x27;s Crag. Boy, take your crowbar—we&#x27;re going after the wreck!</p></details><p class="caption"></p></details>
<details class="record" id="script-5-2" data-group="文学剧本" data-search="脱轨的铁壳号与 004 原罪铭牌 文学剧本 5-2 / 文学底稿（可与战役对白对照） "><summary><strong>脱轨的铁壳号与 004 原罪铭牌</strong><span>5-2 / 文学底稿（可与战役对白对照）</span></summary><p><b>旁白 / 阿列克谢</b>  鹰嘴崖三十米深的倒木雪谷。</p><p><b>旁白 / 阿列克谢</b>  装甲列车“布拉风号”像一条被开膛破肚的钢铁巨蟒横卧在谷底。黑烟从破碎的车窗中翻滚而出，沉重的铸铁转向架断成数截，高压气刹管道发出嘶嘶的漏气绝鸣。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢滑下雪坡，手持撬棍踩着齐膝深的积雪走向侧翻的第三节闷罐车厢。</p><p><b>旁白 / 阿列克谢</b>  车厢铁门被撞得严重扭曲变形。阿列克谢把撬棍插进铁门缝隙，青筋暴起，借着全身的重量向下一压！</p><p><b>旁白 / 阿列克谢</b>  嘎吱——砰！</p><p><b>旁白 / 阿列克谢</b>  生锈的门闩崩飞出去。</p><p><b>旁白 / 阿列克谢</b>  手电筒光柱扫进车门的瞬间，光线扫过了门框上方——一块被风雪磨得发亮的黄铜铭牌在手电光下骤然刺痛了他的眼睛。</p><p><b>旁白 / 阿列克谢</b>  透明工业清漆底下，压着一张发脆的复写纸调拨单，上面是他再熟悉不过的签名：
【车皮调拨单第 004 号 · 转运单位：内务部疫区人员转运计划 · 调拨签发：货运中心三级调度员 阿·莫罗佐夫】</p><p><b>旁白 / 阿列克谢</b>  第零幕那个温暖的午后在脑海里疯狂闪回。
“签了它，本周指标算超额……你妈那一箱药明早送进你们楼……”</p><p><b>旁白 / 阿列克谢</b>  阿列克谢手里的撬棍当啷一声落在了雪里。</p><p><b>旁白 / 阿列克谢</b>  原来没有别的刽子手。从十天前在调度室里为了母亲低头签字的那一刻起，亲手把妹妹送上这趟死车、亲手给这扇门钉上铁锁的人，就是他自己。</p><p><b>旁白 / 阿列克谢</b>  灰烬走上前，用湿漉漉的鼻头顶了顶阿列克谢无力下垂的手指。</p><p><b>旁白 / 阿列克谢</b>  三秒钟的死寂。阿列克谢弯下腰，捡起沾满雪渣的撬棍，狠狠将撬尖砸进铭牌的边缘，伴随着清脆的断裂声，四枚铜铆钉被硬生生撬起。他把那面冰凉锋利的铭牌塞进了胸口内袋，贴着妹妹的那张一寸黑白登记照。</p><p><b>旁白 / 阿列克谢</b>  手电光终于照亮了车厢内部。</p><p><b>旁白 / 阿列克谢</b>  没有血肉模糊的怪物，没有丧失理智的丧尸。</p><p><b>旁白 / 阿列克谢</b>  车厢里挤坐着一百多个人。他们的棉袄破烂不堪，脸上布满冻疮。但他们手背上的灰鳞全部蜕落干净，露出了正常人的皮肤。他们三三两两依偎在一起取暖，母亲在给孩子擦眼泪，年轻的工人用铝饭盒接着车顶化开的雪水。</p><p><b>旁白 / 阿列克谢</b>  他们全是从高烧中挺过来的、活生生的人。</p><p><b>旁白 / 阿列克谢</b>  在车厢最里侧靠通风缝的一角，一个瘦得脱相的年轻女孩艰难地抬起了头。她身上裹着一件满是机油污渍的男式厚坎肩，左手腕上还留着最后一小片正在脱落的干燥鳞屑。</p><p><b>旁白 / 阿列克谢</b>  女孩看着门口那个戴着胶布缠腿眼镜、浑身挂满冰霜的男人，苍白的嘴唇颤抖着，发出了一声轻微却无比清晰的呼唤：</p><p><b>拉娜</b>  ……阿廖沙？……哥！！</p><p><b>旁白 / 阿列克谢</b>  眼泪瞬间从女孩凹陷的眼眶中决堤而出。她不顾一切地向车门爬过来，在雪地里伸出那双满是冻疮和划痕的手：</p><p><b>拉娜</b>  哥！我的烧退了……我不是怪物！哥，带我回家……</p><p><b>旁白 / 阿列克谢</b>  车厢外的雪崖高坡上，两道冰冷刺眼的探照灯骤然打下！</p><p><b>旁白 / 阿列克谢</b>  身穿重型黑色防化服的清杀队督察专员站在履带装甲车顶端，手持扩音器，声音如同齿轮般不带任何人类感情：</p><p><b>督察专员</b>  各肃清小队就位！核对第三节车厢档案号 0401 至 0576！全车 176 人属于‘已签发注销状态’。不管里头能不能说话，名单必须闭合！准备投掷铝热剂燃烧弹，就地清除！</p><p><b>旁白 / 阿列克谢</b>  崖顶的高架机枪发出拉栓的脆响。</p><details class="translation"><summary>English</summary><p>A thirty-meter-deep ravine of snow and fallen timber at Eagle&#x27;s Crag.</p><p>The armoured train Buran lay at the bottom like a steel python slit open from belly to tail. Black smoke billowed from its shattered windows; the heavy cast-iron bogies were broken into pieces, and the high-pressure air-brake lines hissed in a final, dying shriek.</p><p>Aleksei slid down the snowbank and waded through knee-deep drifts toward the overturned third boxcar, crowbar in hand.</p><p>The car&#x27;s iron door was badly buckled. Aleksei jammed the crowbar into the gap, veins standing out on his hands, and threw his whole weight against it.</p><p>Krrrk—bang!</p><p>The rusted bolt sheared off and flew away.</p><p>The moment the flashlight beam swept inside, it caught the top of the doorframe—a brass nameplate, polished bright by wind and snow, stabbed at his eyes.</p><p>Under a coat of clear industrial varnish lay a brittle carbon-copy dispatch slip, and on it a signature he knew better than his own:
[Dispatch Slip No. 004 · Transfer authority: MVD epidemic-zone personnel transfer plan · Issued by: Third-Grade Dispatcher, Freight Centre, A. Morozov]</p><p>The warm afternoon of Act Zero flashed back in fragments.
&quot;Sign it, and this week&#x27;s quota is over target… your mother&#x27;s crate of medicine goes up to your building first thing tomorrow…&quot;</p><p>The crowbar clattered out of Aleksei&#x27;s hand into the snow.</p><p>There had been no other executioner. From the moment he had bowed his head and signed in the dispatch office ten days ago for his mother&#x27;s sake, the man who had sent his sister aboard that death train with his own hands and nailed the lock onto that door had been Aleksei himself.</p><p>Ash stepped forward and nudged his limp, hanging fingers with a wet nose.</p><p>Three seconds of dead silence. Aleksei bent, picked up the snow-crusted crowbar, and drove its point savagely into the edge of the nameplate. With a clean crack, four brass rivets were pried loose. He shoved the cold, sharp-edged plate into his inside breast pocket, against the one-inch black-and-white registration photo of his sister.</p><p>At last the flashlight lit the inside of the car.</p><p>No mangled monsters. No raving dead.</p><p>More than a hundred people sat packed inside. Their padded coats were in rags, their faces covered in frostbite sores—but the Grey Scale on the backs of their hands had all sloughed off, leaving ordinary skin. They huddled together in twos and threes for warmth; a mother wiped her child&#x27;s tears, and a young worker caught the meltwater dripping from the roof in an aluminium mess tin.</p><p>Every one of them was a living person who had come through the high fever.</p><p>In the far corner, against the ventilation slit, a gaunt young girl struggled to raise her head. She was wrapped in a man&#x27;s heavy padded vest stained with machine oil, and the last small patch of dry, peeling scale still clung to her left wrist.</p><p>She looked at the man in the doorway—his glasses taped at the temple, frost hanging all over him—and her pale lips trembled as she let out a small, unmistakable cry:</p><p>…Alyosha?… Brother!!</p><p>Tears broke out of her hollowed eyes in an instant. Reckless, she crawled toward the door, reaching out through the snow with hands covered in chilblains and scratches:</p><p>Brother! My fever broke… I&#x27;m not a monster! Brother, take me home…</p><p>On the high snowbank outside the car, two icy searchlights slammed down!</p><p>An OSK commissioner in a heavy black chemical-protection suit stood atop a tracked armoured carrier, megaphone in hand, his voice as flat and joyless as turning gears:</p><p>All purge squads, take your positions! Check the third boxcar&#x27;s file numbers 0401 through 0576! All 176 aboard are marked &quot;issued de-registration status.&quot; Whether they can still speak in there or not, the list must be closed! Prepare the thermite incendiary—purge on the spot!</p><p>On the cliff above, the heavy machine gun&#x27;s bolt clicked back.</p></details><p class="caption">**【终局闸 D（Endgame Gate D）· 灵魂的最终决断】**

- **👉 D1【砸锁抢人，杀上 302 高地广播塔】**
  阿列克谢一把将拉娜拉进怀里，背在背上。切尔诺夫中士在崖顶猛地扯下内务部白袖标，莫辛纳甘步枪一枪击碎了主探照灯！一百多名康复者举起饭盒和撬棍发出震天呐喊。突围部队直扑全城最高的 302 广播高地！（进入第六幕，通往隐藏真结局或结局 B）。

- **👉 D2【顺从挂锁，闭合账面】**
  在极度的崩溃与恐惧下，阿列克谢松开了妹妹的手。他听从督察专员的命令退后三步，亲手替车厢拉上了粗铁栓。铝热剂燃烧弹在车厢内炸开，火光将雪谷照得通红。（直接进入**结局 A · 击毙仁慈**）。

- **👉 D3【独自逃离，隐入极夜】**
  面对重机枪的火网，阿列克谢丧失了所有勇气。他丢下撬棍和妹妹，顺着排污涵洞独自一人爬回了城市地窖。（直接进入**结局 C · 荒诞麻木**）。</p></details>
<details class="record" id="script-6-1" data-group="文学剧本" data-search="帕维尔老爹的血肉闸刀 文学剧本 6-1 / 文学底稿（可与战役对白对照） "><summary><strong>帕维尔老爹的血肉闸刀</strong><span>6-1 / 文学底稿（可与战役对白对照）</span></summary><p><b>旁白 / 阿列克谢</b>  302 高地广播发射塔。</p><p><b>旁白 / 阿列克谢</b>  狂暴的暴风雪拍打着机房巨大的弧形防爆玻璃。外围防线上，装甲运兵车的柴油发动机在低沉咆哮，清杀队的加重穿甲弹将配电室的水泥砖打得碎屑横飞。</p><p><b>旁白 / 阿列克谢</b>  轰！</p><p><b>旁白 / 阿列克谢</b>  一发穿甲弹打穿了外墙，瞬间击碎了主配电盘的绝缘高压瓷瓶！粗大的铜闸刀在高压短路中断开，跳出一团爆燃的蓝白火球！机房中央那两排两米高的巨型电子管发射机红灯骤灭，全城广播网络陷入死寂！</p><p><b>旁白 / 阿列克谢</b>  突击队的防寒靴声已经逼近楼梯拐角。</p><p><b>旁白 / 阿列克谢</b>  七级老钳工帕维尔老爹抹了一把嘴角的血沫子，一把抄起他用了四十年的重型绝缘包胶管钳，猛地卡进了铜闸刀断开的触点之间！</p><p><b>帕维尔老爹</b> （扭过头，用充血的眼睛盯着阿列克谢和浑身发抖的拉娜） 阿廖沙！去台子前面！把麦克风拧开！</p><p><b>旁白 / 阿列克谢</b>  老人吸了一口气，将全身一百六十斤的体重狠狠压在管钳手柄上，用自己的胸膛和肩膀压住铜闸，硬生生将断开的万伏电闸压回了通电触槽！</p><p><b>旁白 / 阿列克谢</b>  呲啦——轰！！</p><p><b>旁白 / 阿列克谢</b>  万伏高压电弧顺着管钳炸开，狂暴的电流在老人的双臂和胸口爆出焦糊的青烟。帕维尔的双脚死死蹬在水泥机座的边缘，脖颈上的青筋暴起如铁丝，浑身剧烈颤抖，像一尊铸死在配电盘前的乌拉尔钢铁雕塑！</p><p><b>旁白 / 阿列克谢</b>  电子管发射机在一秒钟内重新亮起刺眼的血红光芒！</p><p><b>旁白 / 阿列克谢</b>  全城二十四个工人居住区、三千个锈迹斑斑的铁皮高音喇叭，在午夜的风雪中被同时接通！</p><details class="translation"><summary>English</summary><p>The Hill 302 radio transmission tower.</p><p>A raging blizzard hammered at the great curved blast-proof glass of the transmitter room. Along the outer defence line, armoured personnel carriers growled their diesel low; OSK heavy armour-piercing rounds chewed the distribution room&#x27;s brickwork into flying chips.</p><p>Boom!</p><p>An armour-piercing round punched through the outer wall and shattered the high-voltage porcelain insulators of the main switchboard! The heavy copper knife switch tore open on short circuit, bursting into a ball of blue-white flame. The red lamps of the two rows of towering two-meter vacuum-tube transmitters in the middle of the room died at once, and the citywide broadcast network fell silent.</p><p>The assault team&#x27;s winter boots were already closing on the stairwell corner.</p><p>Old Pavel, the Grade-7 fitter, wiped the blood foam from the corner of his mouth, seized the heavy insulated pipe wrench he had used for forty years, and jammed it between the open contacts of the copper switch.</p><p>Alyosha! Get to the console! Switch the microphone on!</p><p>The old man drew a breath and threw all his weight—160 jin—onto the handle, pressing his chest and shoulders against the copper blade, forcing the ten-thousand-volt switch back into its live slot.</p><p>Kzzz—boom!!</p><p>The ten-thousand-volt arc exploded along the wrench; furious current burst from the old man&#x27;s arms and chest in scorched blue smoke. His feet braced hard against the edge of the concrete plinth, the veins on his neck standing out like wire, his whole body shaking—an Ural statue of steel cast in place before the switchboard.</p><p>Within a second the vacuum-tube transmitters blazed back to eye-searing crimson!</p><p>Across the city, twenty-four workers&#x27; districts and three thousand rusted tin loudspeakers were live at once in the midnight blizzard!</p></details><p class="caption"></p></details>
<details class="record" id="script-6-2" data-group="文学剧本" data-search="碎裂的自白与实名点名 文学剧本 6-2 / 文学底稿（可与战役对白对照） "><summary><strong>碎裂的自白与实名点名</strong><span>6-2 / 文学底稿（可与战役对白对照）</span></summary><p><b>旁白 / 阿列克谢</b>  拉娜与安娜冲到老式碳精麦克风前。两个刚刚死里逃生的女孩握着被汗水湿透的麦克风，把带着哭腔的证言直接吼进了全市所有人的耳朵里：</p><p><b>拉娜</b>  诺沃斯克的人听着！我是拉娜·莫罗佐娃！档案号 0420！</p><p><b>安娜</b>  我是安娜！档案号 0419！我们的高烧退了！灰鳞掉了！人不会变成怪物！第三节车厢里拉去矿坑的一百七十六个人全活着！！</p><p><b>旁白 / 阿列克谢</b>  突击队的撞门木撞裂了机房木门。阿列克谢跃出掩体，撬棍砸偏了冲锋枪的枪口，左肩中弹。他单膝跪在发射台前，一把扯过麦克风。</p><p><b>旁白 / 阿列克谢</b>  没有冗长的讲稿，没有四字成语的排比。他嘴里呛着血沫，每呼吸一口，肺部都发出破风箱般的嘶鸣：</p><p><b>阿列克谢</b> （喘着粗气，声音嘶哑而坚决） ……我是货运站调度员阿列克谢。我怀里揣着一块铜铭牌……第 004 号车皮调拨单……十天前，为了给我妈换一箱透析液，我亲手签的字……</p><p><b>旁白 / 阿列克谢</b>  阿列克谢从怀里掏出那块带血的黄铜铭牌，狠狠贴在麦克风的铁丝网上。金属碰撞发出刺耳的啸叫：</p><p><b>阿列克谢</b>  就是这块单子，把我妹妹锁进了车厢……他们从来不要你们服从，他们要你们跟他们一样，手也沾上血，变成共犯！可我现在把底账念给你们听——</p><p><b>旁白 / 阿列克谢</b>  阿列克谢翻开那本被血染透的《工作日志》背面，用沾满血迹的手指指着上面每一个亲手记下的名字：</p><p><b>阿列克谢</b>  南库 3 号柱，谢尔盖、玛丽亚！活人！
白桦林 402 室，莉莉娅！活人！
东街食堂，瓦西里！死前喊的是渴！不是怪物，是活人！
601 室，柳德米拉！她为了外孙女告密，换来的券连门都出不去！</p><p><b>旁白 / 阿列克谢</b>  阿列克谢一把将装满灰黑孢子粉末的岩芯举在镜头般的电台信号灯下：</p><p><b>阿列克谢</b>  还有——灰鳞病不是天降的神罚！是他们为了赶工期，用温压炸药炸穿了 3 号矿坑的万年冻土，放出了山里的远古菌丝！他们要把活人和矿坑一起炸塌销账！这是岩芯！这是工程图！病是他们炸出来的，账是拿你们的命平的！！</p><p><b>旁白 / 阿列克谢</b>  高音喇叭的声浪回荡在整座西伯利亚冰城的夜空下。</p><p><b>旁白 / 阿列克谢</b>  赫鲁晓夫楼的走廊里，一个个原本反锁的防盗门被从内侧拉开。人们走出家门，手里握着修铁轨的撬棍、大锤、砍柴的斧头和铁皮扳手。</p><p><b>旁白 / 阿列克谢</b>  年轻的清杀哨兵科利亚端着步枪站在高墙上，看着潮水般涌上铁轨的工人，手里的枪慢慢垂了下去。</p><details class="translation"><summary>English</summary><p>Lana and Anna rushed to the old carbon microphone. Two girls snatched back from death gripped the sweat-soaked mike and shouted their testimony, voices breaking with sobs, into the ears of everyone in the city:</p><p>People of Novorsk-17, listen! This is Lana Morozova! File 0420!</p><p>This is Anna! File 0419! Our fevers broke! The Grey Scale fell off! People don&#x27;t turn into monsters! All 176 of us taken from the third boxcar to the mine are alive!!</p><p>The assault team&#x27;s battering ram cracked the transmitter room&#x27;s wooden door. Aleksei leapt from cover, knocked the submachine gun&#x27;s muzzle aside with his crowbar, and took a bullet in the left shoulder. He dropped to one knee before the console and dragged the microphone to him.</p><p>No long speech, no set phrases in parallel rows. Blood foamed in his mouth; every breath came out of his lungs with the shriek of a broken bellows:</p><p>…I&#x27;m Aleksei, a dispatcher at the freight station. I&#x27;ve got a brass nameplate here in my coat… Dispatch Slip No. 004… Ten days ago I signed it myself, to buy Mama Katya a crate of dialysis fluid…</p><p>Aleksei pulled the bloodstained brass plate from his coat and slammed it against the microphone&#x27;s wire mesh. Metal shrieked against metal:</p><p>This slip is what locked my sister in that boxcar… They never wanted your obedience. They wanted you to be like them—blood on your hands too, accomplices! But now I&#x27;m reading you the real ledger—</p><p>Aleksei turned to the blood-soaked back pages of his work logbook and pointed with a bloodied finger at every name he had written there with his own hand:</p><p>Pillar No. 3, South Depot — Sergei and Maria! Alive!
Room 402, Birch Grove — Liliya! Alive!
East Street Canteen — Vasily! What he cried out as he died was &quot;Thirsty!&quot; Not a monster. A living man!
Room 601 — Lyudmila! She informed on a neighbour for her granddaughter, and the coupon she got in return wouldn&#x27;t even get her out the door!</p><p>Aleksei thrust a core sample packed with grey-black spore dust under the radio&#x27;s signal lamp, bright as a camera lens:</p><p>And one more thing—Grey Scale fever is no punishment from heaven! They blasted through the ten-thousand-year permafrost of Mine Shaft No. 3 with thermobaric charges to meet their deadlines, and let the ancient mycelium out of the mountain! They meant to blow the living and the pit together and write the whole thing off! This is the core sample! This is the engineering plan! The sickness is something they blasted out of the ground—and they balanced their books with your lives!!</p><p>The wave of sound from the loudspeakers rolled back and forth beneath the night sky of the whole Siberian ice city.</p><p>In the corridors of the Khrushchyovka blocks, door after locked door was pulled open from the inside. People came out of their apartments carrying railway crowbars, sledgehammers, firewood axes, and tin wrenches.</p><p>On the high wall, a young OSK sentry, Kolya, held his rifle on the workers pouring onto the tracks like a tide—and slowly let the barrel drop.</p></details><p class="caption"></p></details></template>
<template id="audit-source"><table><thead><tr><th>范围</th><th>决定</th><th>理由或落点</th></tr></thead><tbody><tr><td>0-1 签发、1-1 公寓及七页开场</td><td>保留现版顺序</td><td>签发、征召蓝印是两件事。蓝印的发放和用途在冷库登场时交代，开场画面继续对应调度单和 602。</td></tr><tr><td>1-2 冷库</td><td>保留短对白和既有分支</td><td>用编号和递毯子的动作区分中士与父女。长篇自辩会遮住选择，灰烬仍按冷库结果入队。</td></tr><tr><td>1-3 退烧母亲</td><td>采纳心声和枪前辩解</td><td>先刻画她在求开门，再给「我退烧了」。枪声随倒地页出现，末页只留物件，镜头保持连续。</td></tr><tr><td>1-4 帕沙</td><td>保留求药和眼前风险</td><td>援助阶段只说这个晚上，枪口动向和防化服留给之后的余波。</td></tr><tr><td>1-4A 扎哈尔</td><td>保留已有的配给站履历和饥饿动机</td><td>招募时省去背叛预告和玩家条件。若背叛实际发生，其结果由后续事件交代。</td></tr><tr><td>2-1 东窗、601</td><td>保留短句，文学段保留供审阅</td><td>空勺、封签和粮券已经交代矛盾。整段可作文学对照，现有战役入口没有独立 601 幻灯。</td></tr><tr><td>2-2、2-3 食堂</td><td>保留父子身份、临终渴水和回访</td><td>卡刀 QTE 后才交代临终。候选稿假定玩家手拿撬棍、瓦西里滑倒，无法保证每次实况都成立。</td></tr><tr><td>2-4 疗养院</td><td>保留水壶、退烧和 0420 线索</td><td>安娜的证词成立，长段医学解释、独立缝衣分支均保留为文学候选。</td></tr><tr><td>3-1 卡佳分水岭</td><td>保留现有存活、等待、空床变体</td><td>附件把车票、遗言和自行停药写成已发生事件。当前存活检查与过场没有实现这些动作。</td></tr><tr><td>3-2 黑市、3-2A 叶莲娜</td><td>保留时刻、排污检修路线和发报动机</td><td>伊万只交代分工。文学里的破坏细节和过长的罪感独白不进入游戏。</td></tr><tr><td>3-3 庄园</td><td>采纳通行证、开门和递水</td><td>叶莲娜同行才出现父女对峙。三条任务路径仍由玩家选。</td></tr><tr><td>4-1、4-2 矿坑</td><td>保留三行原刻字和博伊科的处境</td><td>简明的划痕更像矿工留字。扩写出来的孢子拆解和具体爆破说辞留在文学区。</td></tr><tr><td>5-1 火场</td><td>保留审批广播、托孤和粮券</td><td>不用“活该”等道德判词替柳德米拉定性，帕维尔和灰烬按实际同行变体出现。</td></tr><tr><td>5-2 鹰嘴崖</td><td>采纳 004 签字回扣及拉娜看见的人</td><td>0420 是档案号，004 是车皮编号。开门见到活人后再决定救援范围。</td></tr><tr><td>5-2 D2 封门</td><td>不采纳</td><td>属于早期文学分支，会改写当前开门后的救援规则、拉娜结局及 A 线条件。</td></tr><tr><td>6-1、6-2 广播</td><td>保留广播证据与姓名两种做法</td><td>帕维尔扶开关按同伴状态出现。省去无条件牺牲和在播报前断言所有人归宿。</td></tr><tr><td>602 日常、战役节点和伙伴反应</td><td>保留日常，采纳调车场伙伴短句</td><td>伊万盯手、古丽娅先看伤员、安娜先叫拉娜、帕维尔开门、叶莲娜对图、灰烬观察入口、扎哈尔用旧签单反问。对白均发生在到达鹰嘴崖前，省去先行宣布救援和广播的说法。</td></tr><tr><td>暖气井、清杀队喊话</td><td>保留现有文案</td><td>喂药、绕开和搜掠对应自己的遭遇。临战喊话要能被即时听懂，长独白不适合战斗节奏。</td></tr><tr><td>七组随机遭遇</td><td>保留原来可执行的选项和回执</td><td>马卡尔和镜中人可供另轮措辞打磨。附件中的药品交换、道具收取、伤势等细节不能当作已实现结果。镜像也无须直接借入文学角色姓名。</td></tr><tr><td>A 留在 602</td><td>改写</td><td>合上日志、母亲问来信、收音机重复公报。现行 A 不要求封车，也不以火烧车厢作主图。</td></tr><tr><td>B 荒诞解放</td><td>改写三种记录</td><td>只带拉娜时问车门。接应能走的人时用她给哥哥让半步。旧档撤离范围不明，只写兄妹下楼。省去拉娜死亡或认不出哥哥的说法。</td></tr><tr><td>C 麻木</td><td>改写</td><td>空床、滴水和收起未写完的日志。此路未必到过鹰嘴崖，省去钉 004 铭牌与瓦西里耳鸣。</td></tr><tr><td>α 你好，拉娜</td><td>改写余波</td><td>602 的灯、热水、底单和旧钢笔承接家庭重聚与签发责任。展出底单沿用实际路线证物。</td></tr><tr><td>β 荒原之火</td><td>改写失母余波，保留存活变体</td><td>失母时用围巾与档案收束。卡佳仍在时保留兄妹守火并寻找返程的场景，不写雪坟。</td></tr><tr><td>帕沙余波</td><td>采纳扣子和风雪</td><td>仅两项既有标志同时满足时追加。把这段留在结局幻灯，避免摘要先把故事讲完。</td></tr></tbody></table></template>
<template id="home-source">
  <div class="hero"><div>
    <p class="kicker">诺沃斯克-17　封城第十个月</p><h1>凛冬铁轨</h1>
    <p>锅炉房的气窗还开着。阿列克谢必须趁夜出门，给 602 室的母亲找药，也要查清编号 0420 的妹妹被送去了哪里。</p>
    <a href="#story" class="cta">查看剧情分镜</a>
  </div></div>
  <h3 style="margin-top:1.6rem">战役进度</h3>
  <ol class="route"><li>602 与冷库</li><li>夜潜货场</li><li>疗养院与黑市</li><li>庄园与矿坑</li><li>西站交接底单</li><li>鹰嘴崖救援</li><li>302 广播</li></ol>
  <div class="highlights">
    <a class="highlight" href="#atlas"><strong>17 张夜潜地图</strong>按地点查看日夜画面，并回查对应剧情。</a>
    <a class="highlight" href="#audit"><strong>台词采纳记录</strong>从原稿到游戏，逐段核对取舍。</a>
  </div>
</template>
<script>
const main = document.getElementById('view');
const search = document.getElementById('search');
const records = [...document.getElementById('source').content.querySelectorAll('.record')].map(node => {
  const summary = node.querySelector(':scope > summary');
  const images = node.querySelectorAll('img');
  const title = summary.querySelector('strong').textContent;
  const meta = summary.querySelector('span').textContent;
  const body = [...node.children].filter(child => child !== summary).map(child => child.outerHTML).join('');
  return {
    id: node.id, group: node.dataset.group, title, meta, body, thumbnail: images[0]?.getAttribute('src'),
    index: (node.dataset.search + ' ' + node.textContent).toLowerCase()
  };
});
const byId = new Map(records.map(record => [record.id, record]));
const deck = r => r.id.startsWith('deck-');
const isEnding = r => r.group === '结局';
const isPerson = r => ['人物','伙伴'].includes(r.group);
const isLibrary = r => (!deck(r) && r.group !== '地图' && !isPerson(r)) || r.group === '战役对白';
const screens = {
  home: ['总览',''], story: ['剧情分镜','按幕次找场景，打开后逐页查看画面与字幕。'],
  atlas: ['夜潜地图','进入地点查看日景、夜景和关联演出。'],
  people: ['人物档案','按立绘浏览人物，打开档案查看相关演出。'],
  endings: ['结局与余波','此处包含全部结局。选择一条路线查看字幕和收束画面。'],
  library: ['对白与底稿','文学稿、运行时对白、战斗喊话和随机遭遇可分别查阅。'],
  audit: ['台词审计','z (6).html 的逐段采纳决定与结局改写记录。']
};
let chapter = '';
let libraryGroup = '文学剧本';
const escape = value => String(value ?? '').replace(/[&<>"']/g, char =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]);
function heading(title, description, control = '') {
  return '<div class="heading"><div><h2>' + escape(title) + '</h2><p class="muted">' + escape(description) + '</p></div>' + control + '</div>';
}
function tile(r) {
  const photo = r.thumbnail ? '<img class="cover" src="' + escape(r.thumbnail) + '" alt="" loading="lazy">' : '';
  return '<a class="tile" href="#' + r.id + '">' + photo + '<span class="tiletext"><strong>' + escape(r.title) + '</strong><small>' + escape(r.meta) + '</small></span></a>';
}
function row(r) {
  return '<a class="list-row" href="#' + r.id + '"><strong>' + escape(r.title) + '</strong><small>' + escape(r.meta) + '</small></a>';
}
function picker(id, name, values, current) {
  return '<label>' + name + ' <select id="' + id + '">' + values.map(([value, label]) =>
    '<option value="' + escape(value) + '"' + (current === value ? ' selected' : '') + '>' + escape(label) + '</option>').join('') + '</select></label>';
}
function area(r) {
  return isEnding(r) ? 'endings' : r.group === '地图' ? 'atlas' : isPerson(r) ? 'people' : isLibrary(r) ? 'library' : 'story';
}
function section(key) {
  const [title, subtitle] = screens[key];
  if (key === 'home') {
    main.replaceChildren(document.getElementById('home-source').content.cloneNode(true));
  } else if (key === 'audit') {
    main.innerHTML = heading(title, subtitle) + '<div class="table-scroll"></div>';
    main.lastElementChild.append(document.getElementById('audit-source').content.cloneNode(true));
  } else if (key === 'story') {
    const items = records.filter(r => area(r) === key);
    const chapters = [...new Set(items.map(r => r.meta.split(' / ')[0]))];
    const control = picker('chapter','幕次',[['','全部'], ...chapters.map(c => [c,c])],chapter);
    const chosen = items.filter(r => !chapter || r.meta.startsWith(chapter + ' / '));
    main.innerHTML = heading(title, subtitle, control) + '<div class="grid">' + chosen.map(tile).join('') + '</div>';
    document.getElementById('chapter').onchange = event => {
      chapter = event.target.value;
      section(key);
      document.getElementById('chapter').focus();
    };
  } else if (key === 'library') {
    const items = records.filter(isLibrary);
    const groups = [...new Set(items.map(r => r.group))];
    const control = picker('kind','文本类型',groups.map(g => [g,g]),libraryGroup);
    main.innerHTML = heading(title, subtitle, control) + '<div class="list">' +
      items.filter(r => r.group === libraryGroup).map(row).join('') + '</div>';
    document.getElementById('kind').onchange = event => {
      libraryGroup = event.target.value;
      section(key);
      document.getElementById('kind').focus();
    };
  } else if (key === 'endings') {
    const routes = new Map();
    for (const record of records.filter(isEnding)) {
      if (!routes.has(record.title)) routes.set(record.title, []);
      routes.get(record.title).push(record);
    }
    const panels = [...routes.values()].map(variants => {
      const first = variants[0];
      const cover = first.thumbnail ? '<img src="' + escape(first.thumbnail) + '" alt="" loading="lazy">' : '';
      const links = variants.map(record => {
        const bits = record.meta.split(' / ');
        const label = bits.length > 3 ? bits.at(-1) : '查看演出';
        return '<a href="#' + record.id + '">' + escape(label) + '</a>';
      }).join('');
      return '<section class="ending-route">' + cover + '<div><h3>' + escape(first.title) + '</h3>' + links + '</div></section>';
    });
    main.innerHTML = heading(title, subtitle) + '<div class="ending-routes">' + panels.join('') + '</div>';
  } else {
    main.innerHTML = heading(title, subtitle) + '<div class="grid ' + key + '">' +
      records.filter(r => area(r) === key).map(tile).join('') + '</div>';
  }
}
function storyNotes(place, exclude) {
  return records.filter(r => deck(r) && r.id !== exclude && r.meta.split(' / ')[1] === place);
}
function mapDetail(record, slot) {
  const holder = document.createElement('div');
  holder.innerHTML = record.body;
  const photo = holder.querySelector('a.cg');
  const night = photo?.getAttribute('href');
  const day = holder.querySelector('a[href$="/map.png"]')?.getAttribute('href');
  if (night && day) {
    const img = photo.querySelector('img');
    const figure = document.createElement('figure');
    photo.before(figure);
    figure.append(photo);
    const toggle = document.createElement('div');
    toggle.className = 'map-toggle';
    toggle.innerHTML = '<button type="button" aria-pressed="true">夜景</button> <button type="button" aria-pressed="false">日景</button>';
    figure.before(toggle);
    [...toggle.children].forEach((button, index, buttons) => button.onclick = () => {
      const src = index ? day : night;
      img.src = src;
      img.alt = record.title + ' ' + button.textContent;
      photo.href = src;
      buttons.forEach((other, i) => other.setAttribute('aria-pressed', String(i === index)));
    });
  }
  slot.append(...holder.childNodes);
  const linked = storyNotes(record.title, '');
  if (linked.length) slot.insertAdjacentHTML('beforeend','<h3>关联演出</h3><div class="list">' + linked.map(row).join('') + '</div>');
}
function stage(slot) {
  const frames = [...slot.querySelectorAll('.frame')];
  if (frames.length <= 1) return;
  const list = slot.querySelector('.frames');
  list.parentElement.classList.add('stage');
  let current = 0;
  const controls = document.createElement('div');
  controls.className = 'controls';
  controls.innerHTML = '<button type="button">上一页</button><span aria-live="polite"></span><button type="button">下一页</button>';
  const [prev, status, next] = controls.children;
  list.after(controls);
  const strip = document.createElement('div');
  strip.className = 'thumbstrip';
  strip.setAttribute('aria-label','幻灯缩略图');
  controls.after(strip);
  const buttons = frames.map((frame, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.setAttribute('aria-label','第 ' + (index + 1) + ' 页');
    const img = frame.querySelector('img');
    if (img) {
      const thumb = img.cloneNode();
      thumb.alt = '';
      button.append(thumb);
    } else button.textContent = String(index + 1);
    button.onclick = () => draw(index);
    strip.append(button);
    return button;
  });
  function draw(index) {
    if (index < 0 || index >= frames.length) return;
    current = index;
    frames.forEach((frame, i) => {
      frame.hidden = i !== index;
      buttons[i].setAttribute('aria-pressed', String(i === index));
    });
    status.textContent = '第 ' + (index + 1) + ' / ' + frames.length + ' 页';
    prev.disabled = index === 0;
    next.disabled = index === frames.length - 1;
  }
  prev.onclick = () => draw(current - 1);
  next.onclick = () => draw(current + 1);
  slot.addEventListener('keydown', event => {
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      draw(current + (event.key === 'ArrowLeft' ? -1 : 1));
    }
  });
  draw(0);
}
function detail(record, key) {
  main.innerHTML = '<div class="reading"><a class="back" href="#' + key + '">返回' + screens[key][0] +
    '</a>' + heading(record.title, record.meta) + '<article class="body"></article></div>';
  const slot = main.querySelector('.body');
  if (key === 'atlas') {
    slot.classList.add('map-view');
    mapDetail(record,slot);
  } else {
    slot.innerHTML = record.body;
    if (key === 'people') {
      slot.classList.add('cast-detail');
    } else if (deck(record)) {
      if (key !== 'library') slot.classList.add('slide-detail');
      stage(slot);
    }
  }
}
function route() {
  const hash = location.hash.slice(1);
  const record = byId.get(hash);
  const key = record ? area(record) : Object.hasOwn(screens, hash) ? hash : 'home';
  document.querySelectorAll('[data-view]').forEach(link => {
    if (link.dataset.view === key) link.setAttribute('aria-current','page');
    else link.removeAttribute('aria-current');
  });
  search.value = '';
  if (record) detail(record, key); else section(key);
  window.scrollTo(0,0);
  main.focus({preventScroll:true});
}
search.addEventListener('input', () => {
  const query = search.value.trim().toLowerCase();
  if (!query) {route(); search.focus(); return;}
  const words = query.split(/\s+/);
  const matches = records.filter(r => words.every(word => r.index.includes(word)));
  main.innerHTML = heading('搜索结果', '共 ' + matches.length + ' 条') +
    '<div class="list">' + matches.map(row).join('') + '</div>';
});
addEventListener('hashchange', route);
route();
</script>
