<details class="record" id="deck-eagle_beak_cliff-22" data-group="抉择余波表" data-search="鹰嘴崖进场 抉择余波表 第五幕 / 鹰嘴崖 · 铁壳号脱轨点 / 抉择余波表 / 选项 1 阿列克谢 eagle_beak_cliff"><summary><strong>鹰嘴崖进场</strong><span>第五幕 / 鹰嘴崖 · 铁壳号脱轨点 / 抉择余波表 / 选项 1</span></summary><p class="cast">出场或被记录人物　阿列克谢</p><p>静态余波表。部分旧选项已由现场过场替代，触发以游戏入口为准。 <a href="#map-eagle_beak_cliff">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_eaglecliff_derailment_scene.jpg"><img src="../../godot_project/art/60_ui/cg/cg_eaglecliff_derailment_scene.jpg" alt="鹰嘴崖进场 第 1 页的 CG" loading="lazy"></a></div><div><p class="caption">撬棍咬住门缝，第三节车厢的锁被顶开。能走的人一个接一个踏上检修路，崖顶的灯追在身后。</p><details class="translation"><summary>English</summary><p>The crowbar bites the door seam and Boxcar Three gives way. Everyone who can walk takes the maintenance path, with the ridge lights hunting behind them.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_eaglecliff_lana_004_rescue_alt2.jpg"><img src="../../godot_project/art/60_ui/cg/cg_eaglecliff_lana_004_rescue_alt2.jpg" alt="鹰嘴崖进场 第 2 页的 CG" loading="lazy"></a></div><div><p class="caption">拉娜在人群里认出了你。最后一批人翻过护坡时，302 台的灯在远处亮了起来。</p><details class="translation"><summary>English</summary><p>Lana recognizes you in the crowd. As the last of them clear the embankment, the lamp of Tower 302 kindles in the distance.</p></details></div></li></ol></details>
<details class="record" id="deck-eagle_beak_cliff-23" data-group="抉择余波表" data-search="鹰嘴崖进场 抉择余波表 第五幕 / 鹰嘴崖 · 铁壳号脱轨点 / 抉择余波表 / 选项 2 阿列克谢 eagle_beak_cliff"><summary><strong>鹰嘴崖进场</strong><span>第五幕 / 鹰嘴崖 · 铁壳号脱轨点 / 抉择余波表 / 选项 2</span></summary><p class="cast">出场或被记录人物　阿列克谢</p><p>静态余波表。部分旧选项已由现场过场替代，触发以游戏入口为准。 <a href="#map-eagle_beak_cliff">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_eaglecliff_derailment_scene.jpg"><img src="../../godot_project/art/60_ui/cg/cg_eaglecliff_derailment_scene.jpg" alt="鹰嘴崖进场 第 1 页的 CG" loading="lazy"></a></div><div><p class="caption">你只带走了拉娜和底单。车门在身后重新合拢，车厢里的人没有等到你第二次回来。</p><details class="translation"><summary>English</summary><p>You leave with only Lana and the copy. The door closes again behind you; the people in the car never see you return.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_eaglecliff_004_plaque_recovery_alt.jpg"><img src="../../godot_project/art/60_ui/cg/cg_eaglecliff_004_plaque_recovery_alt.jpg" alt="鹰嘴崖进场 第 2 页的 CG" loading="lazy"></a></div><div><p class="caption">底单上的 0420 还在，多出来的姓名却被你留在了崖下。《工作日志》的背面又添了一道划痕。</p><details class="translation"><summary>English</summary><p>0420 is still on the copy, but the names you left behind stay under the cliff. One more stroke marks the back of the logbook.</p></details></div></li></ol></details>
<details class="record" id="deck-crag_reveal-30" data-group="现场与余波" data-search="打开第三节车厢 现场与余波 第五幕 / 鹰嘴崖 · 铁壳号脱轨点 / 现场与余波 阿列克谢、拉娜、车厢幸存者 crag_reveal"><summary><strong>打开第三节车厢</strong><span>第五幕 / 鹰嘴崖 · 铁壳号脱轨点 / 现场与余波</span></summary><p class="cast">出场或被记录人物　阿列克谢、拉娜、车厢幸存者</p><p>搜索第三节车厢目标后，撤离前必须选择 <a href="#map-eagle_beak_cliff">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_eaglecliff_derailment_scene.jpg"><img src="../../godot_project/art/60_ui/cg/cg_eaglecliff_derailment_scene.jpg" alt="打开第三节车厢 第 1 页的 CG" loading="lazy"></a></div><div><p class="caption">手电扫过铭牌：004。调拨底单还贴在你胸口，签发栏里是你自己的笔迹。</p><details class="translation"><summary>English</summary><p>Your flashlight catches the plate: 004. The dispatch copy is still against your chest. The signature is in your own hand.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_boxcar03_survivors_reveal_v1.png"><img src="../../godot_project/art/60_ui/cg/cg_boxcar03_survivors_reveal_v1.png" alt="打开第三节车厢 第 2 页的 CG" loading="lazy"></a></div><div><p class="caption">车厢里挤着一群活人。他们的灰鳞已经退去；有人抱着孩子，有人用饭盒接车顶落下的雪水。</p><details class="translation"><summary>English</summary><p>A crowd of living people fills the car. Their gray scales have fallen away; one holds a child while another catches snowmelt in a tin cup.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_boxcar03_survivors_reveal_v1.png"><img src="../../godot_project/art/60_ui/cg/cg_boxcar03_survivors_reveal_v1.png" alt="打开第三节车厢 第 3 页的 CG" loading="lazy"></a></div><div><p class="caption">拉娜攥住你的袖口：「哥，我烧退了。门边这几个还能走，里头还有人。」</p><details class="translation"><summary>English</summary><p>Lana grips your sleeve. “My fever broke. The ones by the door can walk. There are still people inside.”</p></details><p class="meta">必选 · 播完后继续夜潜，撤离成功才结算</p><aside><strong>选项与回执</strong><ol><li>带能走的人一起沿检修线撤离<details class="translation"><summary>English</summary><p>Take everyone who can walk along the service line </p></details></li><li>先带拉娜和底单撤离<details class="translation"><summary>English</summary><p>Leave first with Lana and the dispatch copy </p></details></li></ol></aside></div></li></ol></details>
<details class="record" id="deck-station_route-32" data-group="现场与余波" data-search="交接底单 现场与余波 第五幕 / 布拉风货场 · 南侧编组线 / 现场与余波 阿列克谢 station_route"><summary><strong>交接底单</strong><span>第五幕 / 布拉风货场 · 南侧编组线 / 现场与余波</span></summary><p class="cast">出场或被记录人物　阿列克谢</p><p>带回交接底单后标记检修线 <a href="#map-station_buran_yard">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_station_handover_desk_solo.jpg"><img src="../../godot_project/art/60_ui/cg/cg_station_handover_desk_solo.jpg" alt="交接底单 第 1 页的 CG" loading="lazy"></a></div><div><p class="caption">检修柜里的底单没有销账章。车里的人还不能被账本判死。</p><details class="translation"><summary>English</summary><p>The copy in the maintenance locker carries no closure stamp. The ledger cannot declare the people aboard dead.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_station_handover_desk_solo.jpg"><img src="../../godot_project/art/60_ui/cg/cg_station_handover_desk_solo.jpg" alt="交接底单 第 2 页的 CG" loading="lazy"></a></div><div><p class="caption">底单与西站发车令对上了。你把通往鹰嘴崖的检修线记在地图上。</p><details class="translation"><summary>English</summary><p>The copy matches the West Yard dispatch order. You mark the maintenance route to Eagle&#x27;s Crag on the map.</p></details></div></li></ol></details>

<details class="record" id="deck-broadcast_tower_302-24" data-group="抉择余波表" data-search="302 广播塔 抉择余波表 第六幕 / 302 高地 · 广播塔 / 抉择余波表 / 选项 1 阿列克谢、拉娜 broadcast_tower_302"><summary><strong>302 广播塔</strong><span>第六幕 / 302 高地 · 广播塔 / 抉择余波表 / 选项 1</span></summary><p class="cast">出场或被记录人物　阿列克谢、拉娜</p><p>静态余波表。部分旧选项已由现场过场替代，触发以游戏入口为准。 <a href="#map-broadcast_tower_302">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_broadcast_testimony_scene.jpg"><img src="../../godot_project/art/60_ui/cg/cg_broadcast_testimony_scene.jpg" alt="302 广播塔 第 1 页的 CG" loading="lazy"></a></div><div><p class="caption">名单一个名字一个名字地念下去。全城的收音机里，第一次有了他们的姓名，不再只是编号。</p><details class="translation"><summary>English</summary><p>The list is read out name by name. For the first time the city&#x27;s radios carry their names, not just file numbers.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_broadcast_city_listeners_dawn_alt.jpg"><img src="../../godot_project/art/60_ui/cg/cg_broadcast_city_listeners_dawn_alt.jpg" alt="302 广播塔 第 2 页的 CG" loading="lazy"></a></div><div><p class="caption">南门守住了。天亮时 302 台的发射机还在响；有人在信里写下了听到的第一个名字。</p><details class="translation"><summary>English</summary><p>The south gate holds. At dawn the transmitter is still alive, and someone writes down the first name they heard.</p></details></div></li></ol></details>

「哥，咱们走的时候……第三节车门还开着吗？」

Aleksei: “It was.”</p></details></div></li></ol></details>
<details class="record" id="deck-ENDING_C_NUMBNESS-66" data-group="结局" data-search="C 麻木 结局 结局 / 602 室与地窖 / 结局 阿列克谢 ENDING_C_NUMBNESS"><summary><strong>C 麻木</strong><span>结局 / 602 室与地窖 / 结局</span></summary><p class="cast">出场或被记录人物　阿列克谢</p><p>无真相证据，母亲离世</p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_room602_empty_bed_folded_scarf.jpg"><img src="../../godot_project/art/60_ui/cg/cg_room602_empty_bed_folded_scarf.jpg" alt="C 麻木 第 1 页的 CG" loading="lazy"></a></div><div><p class="caption">你把没查完的《工作日志》合上。床边的围巾没有动，透析机也不再发出声音。</p><details class="translation"><summary>English</summary><p>You close the unfinished logbook. The scarf by the empty bed has not moved, and the dialysis machine is silent.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_ending_crawl_back_cellar_alt.jpg"><img src="../../godot_project/art/60_ui/cg/cg_ending_crawl_back_cellar_alt.jpg" alt="C 麻木 第 2 页的 CG" loading="lazy"></a></div><div><p class="caption">他独自从排污涵洞爬回空地窖。雪盖住名字，也盖住了最后一点反抗。</p><details class="translation"><summary>English</summary><p>He crawls alone from the drain into an empty cellar. Snow covers the names and the last trace of resistance.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_aftermath_c_numb.jpg"><img src="../../godot_project/art/60_ui/cg/cg_aftermath_c_numb.jpg" alt="C 麻木 第 3 页的 CG" loading="lazy"></a></div><div><p class="caption">地窖里有根水管在滴。你数到第四声，放下水碗，把那本没写完的日志推进床底。</p><details class="translation"><summary>English</summary><p>A pipe drips in the cellar. On the fourth drop you set down your bowl and push the unfinished logbook under the bed.</p></details></div></li></ol></details>
<details class="record" id="deck-TRUE_ALPHA_HELLO_LANA-67" data-group="结局" data-search="α 你好，拉娜 结局 结局 / 602 室 / 结局 阿列克谢、拉娜、卡佳 TRUE_ALPHA_HELLO_LANA"><summary><strong>α 你好，拉娜</strong><span>结局 / 602 室 / 结局</span></summary><p class="cast">出场或被记录人物　阿列克谢、拉娜、卡佳</p><p>真相在手，母亲在世，零划痕，未被出卖</p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_ending_true_alpha_hello_lana.jpg"><img src="../../godot_project/art/60_ui/cg/cg_ending_true_alpha_hello_lana.jpg" alt="α 你好，拉娜 第 1 页的 CG" loading="lazy"></a></div><div><p class="caption">拉娜回到了 602。母亲还在床边等他们，三个人终于重新站在同一盏灯下。</p><details class="translation"><summary>English</summary><p>Lana returns to Room 602. Mother is waiting beside the bed, and all three are together beneath the same lamp again.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_aftermath_true_alpha.jpg"><img src="../../godot_project/art/60_ui/cg/cg_aftermath_true_alpha.jpg" alt="α 你好，拉娜 第 2 页的 CG" loading="lazy"></a></div><div><p class="caption">晨光照进 602。拉娜把热水递给母亲。桌上摊着交接底单，你把那支签过字的钢笔放在纸边。</p><details class="translation"><summary>English</summary><p>Morning reaches Room 602. Lana hands Mother a cup of warm water. The handover copy lies open on the table, and you set the pen you signed with beside it.</p></details></div></li></ol></details>
<details class="record" id="deck-TRUE_BETA_OUTLAND_FIRE-68" data-group="结局" data-search="β 荒原之火 结局 结局 / 城外雪原 / 结局 阿列克谢、拉娜 TRUE_BETA_OUTLAND_FIRE"><summary><strong>β 荒原之火</strong><span>结局 / 城外雪原 / 结局</span></summary><p class="cast">出场或被记录人物　阿列克谢、拉娜</p><p>真相在手，零划痕，母亲离世或触发背叛</p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_ending_true_beta_outland_fire.jpg"><img src="../../godot_project/art/60_ui/cg/cg_ending_true_beta_outland_fire.jpg" alt="β 荒原之火 第 1 页的 CG" loading="lazy"></a></div><div><p class="caption">真相和拉娜都带出了城，母亲却没能等到他们。荒原的火烧过漫长一夜。</p><details class="translation"><summary>English</summary><p>The truth and Lana make it out of the city, but Mother does not live to see them. The outland fire burns through the long night.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_aftermath_true_beta.jpg"><img src="../../godot_project/art/60_ui/cg/cg_aftermath_true_beta.jpg" alt="β 荒原之火 第 2 页的 CG" loading="lazy"></a></div><div><p class="caption">天快亮了。你把母亲留下的围巾递给拉娜。她把档案往怀里收了收，低头系紧围巾。</p><details class="translation"><summary>English</summary><p>Dawn is close. You hand Lana Mother&#x27;s scarf. She pulls the records closer to her chest and knots the scarf tight.</p></details></div></li></ol></details>
<details class="record" id="deck-TRUE_BETA_OUTLAND_FIRE-69" data-group="结局" data-search="β 荒原之火 结局 结局 / 城外雪原 / 结局 / 母亲存活 阿列克谢、拉娜 TRUE_BETA_OUTLAND_FIRE"><summary><strong>β 荒原之火</strong><span>结局 / 城外雪原 / 结局 / 母亲存活</span></summary><p class="cast">出场或被记录人物　阿列克谢、拉娜</p><p>真相在手，零划痕，母亲离世或触发背叛</p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_ending_true_beta_outland_fire.jpg"><img src="../../godot_project/art/60_ui/cg/cg_ending_true_beta_outland_fire.jpg" alt="β 荒原之火 第 1 页的 CG" loading="lazy"></a></div><div><p class="caption">母亲还活着。真相已经传开，出卖他们的人也把消息送到了清杀队。</p><details class="translation"><summary>English</summary><p>Mother is alive. The truth is out, and someone has passed word to the OSK.</p></details></div></li><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_aftermath_true_beta.jpg"><img src="../../godot_project/art/60_ui/cg/cg_aftermath_true_beta.jpg" alt="β 荒原之火 第 2 页的 CG" loading="lazy"></a></div><div><p class="caption">城外火光下，拉娜和阿列克谢分着守夜。他们等天亮，再找路回去。</p><details class="translation"><summary>English</summary><p>Outside the city, Lana and Aleksei take turns watching the fire. At dawn they will look for a way back.</p></details></div></li></ol></details>
<details class="record" id="deck-pasha_epilogue-70" data-group="结局" data-search="帕沙的防化服 结局 结局余波 / 鹰嘴崖 · 铁壳号脱轨点 / 结局 / 满足帕沙余波条件时附加 帕沙、无名女子、阿列克谢 pasha_epilogue"><summary><strong>帕沙的防化服</strong><span>结局余波 / 鹰嘴崖 · 铁壳号脱轨点 / 结局 / 满足帕沙余波条件时附加</span></summary><p class="cast">出场或被记录人物　帕沙、无名女子、阿列克谢</p><p>帕沙目击与鹰嘴崖存活旗标同时成立 <a href="#map-eagle_beak_cliff">查看地图</a></p><ol class="frames"><li class="frame"><div><a class="cg" href="../../godot_project/art/60_ui/cg/cg_aftermath_pasha_crag_mercy.jpg"><img src="../../godot_project/art/60_ui/cg/cg_aftermath_pasha_crag_mercy.jpg" alt="帕沙的防化服 第 1 页的 CG" loading="lazy"></a></div><div><p class="caption">帕沙把防化服拉到那个女人肩上。扣子试了两次都没对上。
帕沙：「大哥……帮我系上。系严实点，外头雪大。」</p><details class="translation"><summary>English</summary><p>Pasha pulls his protective coat over the woman&#x27;s shoulders. Twice he misses the buttonhole.
Pasha: “Brother… help me button it. All the way. It&#x27;s snowing hard.”</p></details></div></li></ol></details>
<details class="record" id="map-boiler" data-group="地图" data-search="第3居住区 · 锅炉房后巷 地图 地图 / 夜景与日景 "><summary><strong>第3居住区 · 锅炉房后巷</strong><span>地图 / 夜景与日景</span></summary><p>楼下就能摸到，煤堆旁常有人堆杂物。 两只旧木箱、一台报废蒸汽泵。清杀队偶尔从东侧栅栏路过。</p><a class="cg" href="../../godot_project/art/80_maps/Boiler/map_night.png"><img src="../../godot_project/art/80_maps/Boiler/map_night.png" alt="第3居住区 · 锅炉房后巷 夜景" loading="lazy"></a><p><a href="../../godot_project/art/80_maps/Boiler/map.png">查看日景</a> · <a href="../../godot_project/scenes/night_boiler.tscn">场景文件</a></p></details>
<details class="record" id="map-coldstore" data-group="地图" data-search="城北四号铁路冷库 地图 地图 / 夜景与日景 "><summary><strong>城北四号铁路冷库</strong><span>地图 / 夜景与日景</span></summary><p>据说封着一批医疗耗材，也冻死过人。 南库 3 号柱后有活人。冷库铁门可以撬棍卡死。</p><a class="cg" href="../../godot_project/art/80_maps/Coldstore/map_night.png"><img src="../../godot_project/art/80_maps/Coldstore/map_night.png" alt="城北四号铁路冷库 夜景" loading="lazy"></a><p><a href="../../godot_project/art/80_maps/Coldstore/map.png">查看日景</a> · <a href="../../godot_project/scenes/night_coldstore.tscn">场景文件</a></p></details>
<details class="record" id="map-yard" data-group="地图" data-search="夜间广轨货场 地图 地图 / 夜景与日景 "><summary><strong>夜间广轨货场</strong><span>地图 / 夜景与日景</span></summary><p>编组表和废件堆都在那，灯也最亮。 两座煤水塔可躲探照灯；清杀队 2 人一组巡逻。</p><a class="cg" href="../../godot_project/art/80_maps/Yard/map_night.png"><img src="../../godot_project/art/80_maps/Yard/map_night.png" alt="夜间广轨货场 夜景" loading="lazy"></a><p><a href="../../godot_project/art/80_maps/Yard/map.png">查看日景</a> · <a href="../../godot_project/scenes/night_explore.tscn">场景文件</a></p></details>
<details class="record" id="map-underpass" data-group="地图" data-search="铁道下穿积冰道 地图 地图 / 夜景与日景 "><summary><strong>铁道下穿积冰道</strong><span>地图 / 夜景与日景</span></summary><p>黑冰很滑，声音会传得很远。有人在这儿烧火。 涉雪泥移动 ×0.65，噪声 ×2.0；火堆可回温。</p><a class="cg" href="../../godot_project/art/80_maps/Underpass/map_night.png"><img src="../../godot_project/art/80_maps/Underpass/map_night.png" alt="铁道下穿积冰道 夜景" loading="lazy"></a><p><a href="../../godot_project/art/80_maps/Underpass/map.png">查看日景</a> · <a href="../../godot_project/scenes/night_underpass.tscn">场景文件</a></p></details>
<details class="record" id="map-canteen" data-group="地图" data-search="东街工人食堂 · 后厨 地图 地图 / 夜景与日景 "><summary><strong>东街工人食堂 · 后厨</strong><span>地图 / 夜景与日景</span></summary><p>账面已清空的老楼，可里面还有十九只碗。 备餐台砧板上插着砍骨刀；窄门会被冲开。</p><a class="cg" href="../../godot_project/art/80_maps/Canteen/map_night.png"><img src="../../godot_project/art/80_maps/Canteen/map_night.png" alt="东街工人食堂 · 后厨 夜景" loading="lazy"></a><p><a href="../../godot_project/art/80_maps/Canteen/map.png">查看日景</a> · <a href="../../godot_project/scenes/night_canteen.tscn">场景文件</a></p></details>

<details class="record" id="map-manor" data-group="地图" data-search="松林庄园 · 二号恒温库 地图 地图 / 夜景与日景 "><summary><strong>松林庄园 · 二号恒温库</strong><span>地图 / 夜景与日景</span></summary><p>墙外 −35℃，墙里 26℃。409 批腹透液就在那儿。 电网高墙 + 特勤值守。被发现基本等于死。</p><a class="cg" href="../../godot_project/art/80_maps/Manor/map_night.png"><img src="../../godot_project/art/80_maps/Manor/map_night.png" alt="松林庄园 · 二号恒温库 夜景" loading="lazy"></a><p><a href="../../godot_project/art/80_maps/Manor/map.png">查看日景</a> · <a href="../../godot_project/scenes/night_manor.tscn">场景文件</a></p></details>
<details class="record" id="map-marshalling" data-group="地图" data-search="西站调车场 地图 地图 / 夜景与日景 "><summary><strong>西站调车场</strong><span>地图 / 夜景与日景</span></summary><p>报废守车里有零件，调度室外贴着今晚的发车令。 机车水箱里可能塞着手稿复写件。</p><a class="cg" href="../../godot_project/art/80_maps/Marshalling/map_night.png"><img src="../../godot_project/art/80_maps/Marshalling/map_night.png" alt="西站调车场 夜景" loading="lazy"></a><p><a href="../../godot_project/art/80_maps/Marshalling/map.png">查看日景</a> · <a href="../../godot_project/scenes/night_marshalling.tscn">场景文件</a></p></details>
<details class="record" id="map-mine" data-group="地图" data-search="3 号矿坑 · 温压爆破作业面 地图 地图 / 夜景与日景 "><summary><strong>3 号矿坑 · 温压爆破作业面</strong><span>地图 / 夜景与日景</span></summary><p>灰鳞病的源头就埋在断面里。矿上还码着铝热剂。 留守技术员博伊科守着起爆器；他手上的鳞屑正在掉。</p><a class="cg" href="../../godot_project/art/80_maps/MineNo3/map_night.png"><img src="../../godot_project/art/80_maps/MineNo3/map_night.png" alt="3 号矿坑 · 温压爆破作业面 夜景" loading="lazy"></a><p><a href="../../godot_project/art/80_maps/MineNo3/map.png">查看日景</a> · <a href="../../godot_project/scenes/night_mine.tscn">场景文件</a></p></details>
<details class="record" id="map-birch" data-group="地图" data-search="白桦林废弃板房 地图 地图 / 夜景与日景 "><summary><strong>白桦林废弃板房</strong><span>地图 / 夜景与日景</span></summary><p>风小，能捡到柴。偶尔有逃出来的人躲在这儿。 低风险补给点，适合缺体温的夜里。</p><a class="cg" href="../../godot_project/art/80_maps/Birch/map_night.png"><img src="../../godot_project/art/80_maps/Birch/map_night.png" alt="白桦林废弃板房 夜景" loading="lazy"></a><p><a href="../../godot_project/art/80_maps/Birch/map.png">查看日景</a> · <a href="../../godot_project/scenes/night_birch.tscn">场景文件</a></p></details>

<details class="record" id="map-greenhouse" data-group="地图" data-search="温室大棚 地图 地图 / 夜景与日景 "><summary><strong>温室大棚</strong><span>地图 / 夜景与日景</span></summary><p>塑料布还算严实，冻土里埋着去年的土豆。 低风险食物点，适合缺粮的夜里。</p><a class="cg" href="../../godot_project/art/80_maps/Greenhouse/map_night.png"><img src="../../godot_project/art/80_maps/Greenhouse/map_night.png" alt="温室大棚 夜景" loading="lazy"></a><p><a href="../../godot_project/art/80_maps/Greenhouse/map.png">查看日景</a> · <a href="../../godot_project/scenes/night_greenhouse.tscn">场景文件</a></p></details>
<details class="record" id="map-archive" data-group="地图" data-search="档案馆电报局 地图 地图 / 夜景与日景 "><summary><strong>档案馆电报局</strong><span>地图 / 夜景与日景</span></summary><p>旧电报和花名册都在，值钱的情报也在。 高风险：清杀队重点盯防的情报点。</p><a class="cg" href="../../godot_project/art/80_maps/Archive/map_night.png"><img src="../../godot_project/art/80_maps/Archive/map_night.png" alt="档案馆电报局 夜景" loading="lazy"></a><p><a href="../../godot_project/art/80_maps/Archive/map.png">查看日景</a> · <a href="../../godot_project/scenes/night_archive.tscn">场景文件</a></p></details>
<details class="record" id="map-station_buran_yard" data-group="地图" data-search="布拉风货场 · 南侧编组线 地图 地图 / 夜景与日景 "><summary><strong>布拉风货场 · 南侧编组线</strong><span>地图 / 夜景与日景</span></summary><p>调度令写着 23:00 发车，货场里还有一份没盖注销章的交接底单。 站房探照灯沿月台扫动；布拉风号尾部的检修柜可能留有底单。</p><a class="cg" href="../../godot_project/art/80_maps/StationBuranYard/map_night.png"><img src="../../godot_project/art/80_maps/StationBuranYard/map_night.png" alt="布拉风货场 · 南侧编组线 夜景" loading="lazy"></a><p><a href="../../godot_project/art/80_maps/StationBuranYard/map.png">查看日景</a> · <a href="../../godot_project/scenes/night_station_buran_yard.tscn">场景文件</a></p></details>
<details class="record" id="map-eagle_beak_cliff" data-group="地图" data-search="鹰嘴崖 · 铁壳号脱轨点 地图 地图 / 夜景与日景 "><summary><strong>鹰嘴崖 · 铁壳号脱轨点</strong><span>地图 / 夜景与日景</span></summary><p>盘山线在鹰嘴崖急弯，第三节闷罐车厢的门可能已经变形。 沿检修路靠近车厢，崖顶探照灯和巡逻兵都在找幸存者。</p><a class="cg" href="../../godot_project/art/80_maps/EagleBeakCliff/map_night.png"><img src="../../godot_project/art/80_maps/EagleBeakCliff/map_night.png" alt="鹰嘴崖 · 铁壳号脱轨点 夜景" loading="lazy"></a><p><a href="../../godot_project/art/80_maps/EagleBeakCliff/map.png">查看日景</a> · <a href="../../godot_project/scenes/night_eagle_beak_cliff.tscn">场景文件</a></p></details>
<details class="record" id="map-broadcast_tower_302" data-group="地图" data-search="302 高地 · 广播塔 地图 地图 / 夜景与日景 "><summary><strong>302 高地 · 广播塔</strong><span>地图 / 夜景与日景</span></summary><p>拉娜和幸存者需要一个能让全城听见的频率。 信号机组在塔顶；南门是唯一可撤离的出口。需要鹰嘴崖路线和庄园罪证。</p><a class="cg" href="../../godot_project/art/80_maps/BroadcastTower302/map_night.png"><img src="../../godot_project/art/80_maps/BroadcastTower302/map_night.png" alt="302 高地 · 广播塔 夜景" loading="lazy"></a><p><a href="../../godot_project/art/80_maps/BroadcastTower302/map.png">查看日景</a> · <a href="../../godot_project/scenes/night_broadcast_tower_302.tscn">场景文件</a></p></details>

<details class="record" id="heating-shaft" data-group="现场对白" data-search="暖气井回退者 现场对白 夜潜 / 旧版遭遇面板 "><summary><strong>暖气井回退者</strong><span>夜潜 / 旧版遭遇面板</span></summary><p class="caption">抉择 A · 你是否还承认他是人</p><details class="translation"><summary>English</summary><p>CHOICE A · Do you still call him human?</p></details><p class="caption">暖气井里蜷着一个半人。他的瞳孔还映着灯，身体却被高烧烧得发抖；对面楼顶的红外点正慢慢移过来。你若承认他是人，接下来每一个动作都要付出代价。</p><details class="translation"><summary>English</summary><p>A half-human curls in the heating shaft, pupils still reflecting the light while fever shakes him. An IR dot crawls across the opposite roof. If you call him human, every next action has a price.</p></details><p class="caption">A1 冒险喂阿司匹林与温水，等他醒来（各消耗 1）</p><details class="translation"><summary>English</summary><p>A1 Risk aspirin and warm water; wait for him to wake (1 each)</p></details><p class="caption">　你身上没有阿司匹林和热水。</p><details class="translation"><summary>English</summary><p>　You have no aspirin or water.</p></details><p class="caption">A2 贴墙绕行，把他的哭声留给黑暗（良知 −2）</p><details class="translation"><summary>English</summary><p>A2 Slip past and leave his crying to the dark (Conscience −2)</p></details><p class="caption">A3 一撬棍让他安静，再搜走罐头（良知 −10 · 卌 +1）</p><details class="translation"><summary>English</summary><p>A3 Silence him, take his tin (Conscience −10 · stroke +1)</p></details><p class="caption">按 Esc 先不决定（他会继续烧）。</p><details class="translation"><summary>English</summary><p>Esc to decide later (he keeps burning).</p></details></details>
<details class="record" id="bark-chase" data-group="战斗喊话" data-search="清杀队 · 追杀 战斗喊话 夜潜 / 清杀队 "><summary><strong>清杀队 · 追杀</strong><span>夜潜 / 清杀队</span></summary><a class="portrait" href="../../godot_project/art/10_characters/portraits/PRT_OSK_Concept.png"><img src="../../godot_project/art/10_characters/portraits/PRT_OSK_Concept.png" alt="清杀队头像" loading="lazy"></a><p class="caption">是夜潜者！焊死前头路口，绝不能让他钻回居住区！</p><details class="translation"><summary>English</summary><p>Target spotted! Seal the junction. Do not let him reach the blocks!</p></details><p class="caption">他插翅难逃！二号从涵洞包抄，探照灯死死钉住他！</p><details class="translation"><summary>English</summary><p>He will not escape. Two, flank him. Keep the light on him!</p></details><p class="caption">站住！再往前一步，按灰鳞狂暴者就地销账！</p><details class="translation"><summary>English</summary><p>Halt! Run again and we fire!</p></details></details>
<details class="record" id="bark-death" data-group="战斗喊话" data-search="清杀队 · 阵亡 战斗喊话 夜潜 / 清杀队 "><summary><strong>清杀队 · 阵亡</strong><span>夜潜 / 清杀队</span></summary><a class="portrait" href="../../godot_project/art/10_characters/portraits/PRT_OSK_Concept.png"><img src="../../godot_project/art/10_characters/portraits/PRT_OSK_Concept.png" alt="清杀队头像" loading="lazy"></a><p class="caption">三号中弹……探照灯……别让光灭了……黑……</p><details class="translation"><summary>English</summary><p>Three is hit... the light... do not let it go out...</p></details><p class="caption">电传机……还亮着吗……替我划掉……编号……</p><details class="translation"><summary>English</summary><p>Is the radio... still on... tell them...</p></details><p class="caption">面具碎了……好冷……报告督察……活人还在……</p><details class="translation"><summary>English</summary><p>I cannot see... report... the target is still...</p></details></details>
<details class="record" id="bark-execute" data-group="战斗喊话" data-search="清杀队 · 目标清除 战斗喊话 夜潜 / 清杀队 "><summary><strong>清杀队 · 目标清除</strong><span>夜潜 / 清杀队</span></summary><a class="portrait" href="../../godot_project/art/10_characters/portraits/PRT_OSK_Concept.png"><img src="../../godot_project/art/10_characters/portraits/PRT_OSK_Concept.png" alt="清杀队头像" loading="lazy"></a><p class="caption">目标已物理清零。核对档案号，恢复灯火封锁。</p><details class="translation"><summary>English</summary><p>Target down. Verify the file number. Restore the cordon.</p></details><p class="caption">停止射击。实毁数加一，写进午夜交接底单。</p><details class="translation"><summary>English</summary><p>Cease pursuit. Enter the scene in the handover log.</p></details></details>
<details class="record" id="bark-warning" data-group="战斗喊话" data-search="清杀队 · 警戒 战斗喊话 夜潜 / 清杀队 "><summary><strong>清杀队 · 警戒</strong><span>夜潜 / 清杀队</span></summary><a class="portrait" href="../../godot_project/art/10_characters/portraits/PRT_OSK_Concept.png"><img src="../../godot_project/art/10_characters/portraits/PRT_OSK_Concept.png" alt="清杀队头像" loading="lazy"></a><p class="caption">阴影里是谁？滚到探照灯底下来，把印鉴卡举过头顶！</p><details class="translation"><summary>English</summary><p>Who is there? Step into the light. Papers, now.</p></details><p class="caption">不准动！手放在光柱里，别让我提醒第二遍。</p><details class="translation"><summary>English</summary><p>Do not move. Keep your hands where I can see them.</p></details><p class="caption">宵禁封锁区。转过身，面朝铁墙慢慢退过来！</p><details class="translation"><summary>English</summary><p>This sector is sealed. Turn around and approach slowly.</p></details></details>
<details class="record" id="event-drunk_father" data-group="随机遭遇" data-search="酒馆里的换药人 随机遭遇 运行时事件资源 / 触发地点随遭遇规则 "><summary><strong>酒馆里的换药人</strong><span>运行时事件资源 / 触发地点随遭遇规则</span></summary><p class="caption">黑市篝火旁，前市立中学语文教师马卡尔当着众人的面，把古丽娅给他女儿退烧的两粒阿司匹林换成半瓶掺水工业酒精，仰头灌下，又跪在雪泥里揪着头发狂笑：「来啊，往我脸上吐唾沫！我是个吃女儿肉的畜生！可她熬过四天又能怎样？醒过来还是要被塞进铁壳号！我喝掉这两粒药，是因为我连看她清醒着被烧死的勇气都没有！阿列克谢，你撬得开铁门，撬得开人心里这口棺材吗？！」地窖里，他的女儿仍在四十度高烧中喊冷；他越把这句话喊得响亮，越像是在等谁替他把最后一丝做人的资格也拿走。</p><details class="translation"><summary>English</summary><p>At the market fire, former schoolteacher Makar trades the two aspirin meant for his feverish daughter for diluted industrial alcohol. He begs the crowd to spit on him: even if she survives, the Buran will take her. His self-abasement is both confession and refuge.</p></details><aside><strong>选项与回执</strong><ol><li>用自己的抗生素换回那半瓶酒精<p>马卡尔捏着你给他的药，忽然不笑了。他把酒精推回来，像推开一具自己的尸体：「你为什么现在才来？我已经把最不要脸的话说完了……」他抱着药爬回地窖，脚步仍旧踉跄。你没有见证退烧的奇迹，只替那个孩子留住了一次尚不确定的天亮。</p><details class="translation"><summary>English</summary><p>Trade your own antibiotics for the bottle You trade your antibiotics for the bottle. Makar crawls back to the cellar; no miracle is promised, only another uncertain dawn.</p></details></li><li>夺下酒瓶，拖他回女儿身边<p>他一边同你争夺酒瓶，一边恳求你再打得重些，仿佛疼痛是唯一不必付费的赦罪。你最终把他拖回地窖门口；他不敢进去，只隔着门听见女儿烧得说胡话，便跪在雪里号啕大哭。门没有因此变成天堂，但他至少没有再逃走。</p><details class="translation"><summary>English</summary><p>Take the bottle and drag him home You drag him to the cellar door. He cannot enter, but he no longer runs; outside, he weeps at the sound of his daughter&#x27;s fever.</p></details></li><li>让他跪在雪里，不替他裁决<p>你转身走了。身后的人还在大声咒骂自己，仿佛只要抢先把自己骂成畜生，别人的审判就再也伤不到他。你没有唾弃他，也没有原谅他；你只是忽然害怕，他那套听上去无比丑恶的账，自己在某个夜里也曾悄悄算过。</p><details class="translation"><summary>English</summary><p>Leave him in the snow without judging him You walk away without spitting or absolving. His self-hatred sounds obscene because some part of you recognises the arithmetic.</p></details></li></ol></aside></details>
<details class="record" id="event-frozen_child" data-group="随机遭遇" data-search="冻僵的孩子 随机遭遇 运行时事件资源 / 触发地点随遭遇规则 "><summary><strong>冻僵的孩子</strong><span>运行时事件资源 / 触发地点随遭遇规则</span></summary><p class="caption">结满冰溜子的楼梯间死角里，一个瘦小的女孩蜷缩在水泥墙根下，冻得乌青的嘴唇只剩下一丝若有若无的白气。</p><details class="translation"><summary>English</summary><p>A child huddles in the stairwell, barely breathing from the cold.</p></details><aside><strong>选项与回执</strong><ol><li>把热水壶留给她<p>她用冻得像胡萝卜似的小手死死抱住温热的水壶，贴在心口，青紫的嘴唇上终于泛起了一丝活人的血色。</p><details class="translation"><summary>English</summary><p>Leave her the hot water Colour returns to her lips.</p></details></li><li>分她半把黑麦<p>你把粗糙的冷黑麦碎粒塞进她僵硬的手心，她连雪带米一口吞了下去，仰起脸冲你流下一行无声的泪。</p><details class="translation"><summary>English</summary><p>Share some grits You press the grits into her hand.</p></details></li><li>什么都不留，走开<p>你狠下心裹紧大衣快步走上台阶，身后那点微弱得像小猫一样的抽泣声，在风雪里一点点彻底冷了下去。</p><details class="translation"><summary>English</summary><p>Leave her nothing The crying behind you fades.</p></details></li></ol></aside></details>
<details class="record" id="event-half_human_cry" data-group="随机遭遇" data-search="黑暗里的半人 随机遭遇 运行时事件资源 / 触发地点随遭遇规则 "><summary><strong>黑暗里的半人</strong><span>运行时事件资源 / 触发地点随遭遇规则</span></summary><p class="caption">伸手不见五指的废墟死角里，传来退化半人抱头撞墙的痛苦呜咽，他正陷在高热的神经风暴里，还没有察觉你的气息。</p><details class="translation"><summary>English</summary><p>A regressed half-human whimpers in the dark; it has not seen you.</p></details><aside><strong>选项与回执</strong><ol><li>扔空罐把它引开<p>空铁皮罐头在远处的冰面上砸出清脆的回响，那个可怜的影子笨拙地转过身，循着响动跌跌撞撞地摸了过去。</p><details class="translation"><summary>English</summary><p>Throw a can to lure it away It follows the sound away.</p></details></li><li>屏息贴墙摸过去<p>你死死咬住冻僵的嘴唇，贴着滴水的冰冷砖墙，像一抹真正的幽灵般从他颤抖的脊背旁一寸寸挪了过去。</p><details class="translation"><summary>English</summary><p>Hold your breath and slip past You inch along the wall.</p></details></li><li>挥刀先发制人<p>冰冷的铁器带着风声狠狠劈落，那阵令人心烦意乱的呜咽声戛然而止——黑暗重新归于死寂，只剩你自己的喘息。</p><details class="translation"><summary>English</summary><p>Strike first The blade falls; the crying stops.</p></details></li></ol></aside></details>
<details class="record" id="event-mirror_double" data-group="随机遭遇" data-search="锅炉房镜子里的核算员 随机遭遇 运行时事件资源 / 触发地点随遭遇规则 "><summary><strong>锅炉房镜子里的核算员</strong><span>运行时事件资源 / 触发地点随遭遇规则</span></summary><p class="caption">午夜一点，你刚在《双面工作日志》背面划下一道血痕，锅炉房结霜的破镜里便走出另一个阿列克谢：蓝袖章、雪亮眼镜、体面铁路制服，连指甲缝也没有煤灰。他坐上蒸汽管，温和得像来探病的旧友：「阿廖沙，何必呢？拉娜已经是一行 0420 的油墨，你救不出墨水。把古丽娅那三页废纸交给督察官吧，你能换两箱瑞士 409 批腹透液，还能升任二等核算主任。妈能多活三年，你也能睡在有暖气的屋子里——做个合乎规矩的庸人有什么错？为什么非要当个满手冻疮的圣徒？」他没有辱骂你，也没有撒谎；正因如此，你才想立刻杀死他。</p><details class="translation"><summary>English</summary><p>At 01:00 a blue-armbanded Aleksei steps from the frosted boiler-room mirror: clean uniform, bright glasses, no soot beneath his nails. Trade Gulya&#x27;s pages for dialysis fluid and promotion, he says; Lana is already ink. His gentleness is worse than mockery because none of his arithmetic is false.</p></details><aside><strong>选项与回执</strong><ol><li>回答：拉娜不是一行油墨<p>你一拳砸向那张温和的笑脸。镜子裂开，每一片里却仍坐着一个戴蓝袖章的你；血流进掌纹时，他们齐声纠正：「是 0420。」你疼得发抖，却第一次敢直视那些碎片：「不。她先是我妹妹，然后才是你们的一行字。」白昼的幻象消失了，冻疮和罪却一样也没有少。</p><details class="translation"><summary>English</summary><p>Answer: Lana is not a line of ink You strike the mirror. Every fragment answers &quot;0420,&quot; but you insist she was your sister before she was their ink. The vision vanishes; your wounds and guilt remain.</p></details></li><li>承认：我只想做个合乎规矩的庸人<p>镜中的人满意地点头，把一张二等核算主任的任命书贴在玻璃另一侧。可你伸手去接时，摸到的仍是自己冰凉的指尖。没有两箱腹透液，没有暖房，也没有谁真来赦免你；只有你终于承认，所谓庸人的幸福，有时不过是不再追问别人被运去了哪里。</p><details class="translation"><summary>English</summary><p>Admit: I only want to be ordinary and obedient You accept his respectable appointment and find only your own cold fingertips. The comfort is real for one moment: the comfort of no longer asking where the trains go.</p></details></li><li>跪下，求那个体面的自己替你决定<p>你跪下来，求他告诉你究竟怎样才算无罪。蓝袖章的幻影俯身扶你，动作温柔得像一位兄长：「你看，阿廖沙，连你的反抗也需要我批准。只要你还只想证明自己是个好人，你就永远是我的。」你猛然抬头，镜前却只剩一个人跪着，分不清刚才被扶起的是身体，还是最后一点抵抗。</p><details class="translation"><summary>English</summary><p>Kneel and let your respectable self decide You beg him for innocence. He gently replies that even your rebellion needs his approval so long as you only wish to prove yourself good. When you look up, only one man is kneeling.</p></details></li></ol></aside></details>
<details class="record" id="event-ration_choice" data-group="随机遭遇" data-search="调度室的两难 随机遭遇 运行时事件资源 / 触发地点随遭遇规则 "><summary><strong>调度室的两难</strong><span>运行时事件资源 / 触发地点随遭遇规则</span></summary><p class="caption">废弃调度室结霜的木桌上摊着两份还没来得及归档的电传底单，外头巡逻队的靴声已近，时间只够你抓走其中一份。</p><details class="translation"><summary>English</summary><p>Two slips lie on the desk; you have time to take only one.</p></details><aside><strong>选项与回执</strong><ol><li>拿走焚化炉零件清单<p>你一把扯下零件清单塞进怀里——上面用红铅笔圈着几个尚未被拆走的军工级精钢部件。</p><details class="translation"><summary>English</summary><p>Take the furnace parts list It lists parts still unclaimed.</p></details></li><li>拿走药品调拨单<p>你抓走了盖着红印的药品调拨单——凭着这页薄纸，还能从黑市医务站里换出一批救命的盘尼西林。</p><details class="translation"><summary>English</summary><p>Take the medical chit The chit trades for medicine.</p></details></li></ol></aside></details>
<details class="record" id="event-steam_pipe_leak" data-group="随机遭遇" data-search="蒸汽管破裂 随机遭遇 运行时事件资源 / 触发地点随遭遇规则 "><summary><strong>蒸汽管破裂</strong><span>运行时事件资源 / 触发地点随遭遇规则</span></summary><p class="caption">身旁一截生锈的市政高压蒸汽管突然崩裂，滚烫刺耳的白雾夹着铁锈味喷涌而出，一旦惊动远处的哨兵便万劫不复。</p><details class="translation"><summary>English</summary><p>A steam pipe bursts beside you, scalding white fog pouring out.</p></details><aside><strong>选项与回执</strong><ol><li>用废钢件临时封堵<p>你抄起沉重的废钢件狠命砸扁了翻卷的管口，刺耳的嘶鸣声渐渐平息，白雾终于止住了。</p><details class="translation"><summary>English</summary><p>Patch with scrap steel You hammer the crack shut.</p></details></li><li>撕下衣袖硬堵<p>你扯下厚棉衣袖死命按在裂口上，滚烫的蒸汽一次次把破布顶开，又被你烫起水泡的双手硬生生按了回去。</p><details class="translation"><summary>English</summary><p>Tear your sleeve and plug The rag holds, barely.</p></details></li><li>放任不管，继续走<p>你没有停留，任由那股救命的供暖白雾在身后的极夜里白白喷涌、消散。</p><details class="translation"><summary>English</summary><p>Leave it and move on The white cloud keeps billowing.</p></details></li></ol></aside></details>
<details class="record" id="event-wedged_door" data-group="随机遭遇" data-search="被楔死的门 随机遭遇 运行时事件资源 / 触发地点随遭遇规则 "><summary><strong>被楔死的门</strong><span>运行时事件资源 / 触发地点随遭遇规则</span></summary><p class="caption">一扇厚重的铁皮木门被人从里面用木楔死死顶住，透过结霜的门缝，隐约能看见屋角散落着几罐还没开封的配给物资。</p><details class="translation"><summary>English</summary><p>A door is wedged from inside; loot is visible through the gap.</p></details><aside><strong>选项与回执</strong><ol><li>用撬棍暴力破门<p>道钉撬棍带着回音「哐当」一声砸烂了门闩，你在满地碎木屑里翻出了前人留下的救命存货。</p><details class="translation"><summary>English</summary><p>Force it with the crowbar The door slams open.</p></details></li><li>慢慢拆下楔子<p>你屏住呼吸，用撬棍扁平的尖端顺着门缝一点点拨动，没发出一丝惊动暗处的声响便退出了木楔。</p><details class="translation"><summary>English</summary><p>Work the wedge out quietly You ease the wedge out.</p></details></li><li>放弃这扇门<p>你深深看了一眼门缝里的暗影，没有去惊扰那扇门后的死寂，转身继续向黑暗深处走去。</p><details class="translation"><summary>English</summary><p>Leave the door You turn and move on.</p></details></li></ol></aside></details>
<details class="record" id="script-0-1" data-group="文学剧本" data-search="绿灯、车皮与签名 文学剧本 0-1 / 文学底稿（可与战役对白对照） "><summary><strong>绿灯、车皮与签名</strong><span>0-1 / 文学底稿（可与战役对白对照）</span></summary><p><b>旁白 / 阿列克谢</b>  调度室里的暖气片半凉不热，铁管里不时传出水垢被冲刷的敲击声。窗外的广轨编组站正被白毛风裹得严严实实，一列刷着防化绿漆的重型装甲车头正在顶推车皮，车顶两挺重机枪在雪里凝成了两个白疙瘩——那是“布拉风号”，站上的老工人都管它叫“铁壳号”。</p><p><b>旁白 / 阿列克谢</b>  墙上用图钉扎着本周配额进度表，蓝墨水画的折线在末端耷拉下去。红铅笔批注压在末尾：【第17区人员转运编组完成率61%：连续两周不达标，市政供暖降温40%】。</p><p><b>旁白 / 阿列克谢</b>  调度长用指甲剔了剔牙缝，把一张三联复写单推到阿列克谢面前。单子旁边压着区管委后勤科的一页便签，上面盖着褪色的椭圆章：瑞士 409 批腹膜透析液，超额留用，配额一箱（6袋）。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢的母亲卡佳在 602 室已经两天没能排出毒素，双腿肿得像泡发的面团，皮肤薄得发亮，一碰就渗黄水。</p><p><b>调度长</b> （把印泥盒推过来，铁盒盖在桌面上蹭出一道白印） 内务部要一节闷罐编进布拉风号。乌拉尔山线。004 号车皮，底单在电传机里。你签个字，本周指标算咱们超额。你妈那一箱药，明早头一班吉斯卡车送进你们楼。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢扶了扶眼镜。左边镜腿用黑绝缘胶布缠了三圈，胶布脱胶，黏在耳根上发痒。他凑近看了看底单。</p><p><b>阿列克谢</b> （钢笔尖悬在纸上，离纸面不到半寸） 品名……疫区留观人员及陪护，一百七十六名。
……调度长，一百七十六个活人，怎么能按‘零号散货’走账？</p><p><b>调度长</b> （眼皮都没抬一下） 莫罗佐夫，电传机认代码，不认人。你签了，他们是一百七十六个转运编号；你不签，全楼供暖明晚掐掉两截，你妈连明天中午都熬不过去。你自己掂量。</p><p><b>旁白 / 阿列克谢</b>  门口的皮帘子被掀开，灌进一股刺骨的煤焦油味。“老轨”伊万提着防风信号灯跨进来，身上落满了硬雪碴子。老头吐掉嘴里烧尽的烟蒂，靴底在水泥地上跺得震天响。</p><p><b>“老轨”伊万</b> （从阿列克谢背后走过，看都没看桌上的单子） 小子，装人的车皮，手别太顺。第三节车厢的门框是生铁浇的，上面钉过的单子，几十年雪都冲不干净。</p><p><b>旁白 / 阿列克谢</b>  伊万掀帘子出去了，穿堂风把桌上的复写纸掀起一个角。</p><details class="translation"><summary>English</summary><p>The radiator in the dispatch office was half-warm at best; now and then a knock travelled through the iron pipes as scale was flushed loose. Outside, the broad-gauge marshalling yard was sealed tight in the white squall. A heavy armoured locomotive painted in anti-chemical green was shunting boxcars, two heavy machine guns on its roof frozen into white lumps in the snow — the armoured train Buran, which the old hands at the station called the Iron Shell.</p><p>This week&#x27;s quota chart was pinned to the wall with drawing pins, its blue-ink line sagging at the end. A red-pencil annotation lay pressed beneath it: [District 17 personnel-transfer marshalling, 61% complete: second consecutive week below target; municipal heating reduced by 40%].</p><p>The dispatcher picked at his teeth with a fingernail and slid a triplicate carbon form across to Aleksei. Beside it lay a memo from the logistics section of the District Rationing Committee, stamped with a faded oval seal: Swiss Batch 409 peritoneal dialysis fluid, retained beyond quota, one case allocated (6 bags).</p><p>For two days now his mother Katya, in Room 602, had been unable to purge the toxins from her body. Her legs were swollen like risen dough, the skin thin and shiny, weeping yellow fluid at a touch.</p><p>The Ministry wants one boxcar coupled to the Buran. The Ural Line. Boxcar 004; the Dispatch Slip is in the teletype. Sign here and this week&#x27;s target counts as over-fulfilled for us. That case of medicine for your mother goes into your building on the first ZIS truck tomorrow morning.</p><p>Aleksei adjusted his glasses. The left arm had been wrapped three times with black electrical tape; the adhesive had gone tacky and it itched against the base of his ear. He leaned closer to read the Dispatch Slip.</p><p>Description... persons under observation from the infected zone and their attendants, one hundred and seventy-six.
...Dispatcher, one hundred and seventy-six living people — how can they be booked as &#x27;zero-grade bulk freight&#x27;?</p><p>Morozov, the teletype reads codes, not people. You sign, and they become one hundred and seventy-six transfer numbers. You don&#x27;t, and two heating lines get cut off for the whole building tomorrow night — your mother won&#x27;t last till noon. Weigh it yourself.</p><p>The leather curtain at the door was flung back and a biting smell of coal tar poured in. Old Ivan, the railman, stepped over the threshold carrying a storm lantern, hard snow crusting his coat. He spat out a burnt-down cigarette end and stamped his boots on the concrete until it thundered.</p><p>Son, don&#x27;t get too handy with a boxcar that carries people. The doorframe of the third car is cast iron. Slips nailed up there — decades of snow haven&#x27;t washed the marks clean.</p><p>Ivan lifted the curtain and went out; the draught turned up one corner of the carbon paper on the desk.</p></details><p class="caption">**【抉择 E0 · 签字时刻】**
- **E0-1（低头签字）**：阿列克谢闭了闭眼，钢笔在第三联末尾划下“阿·莫罗佐夫”。复写纸背面洇出紫黑色的笔迹。电传终端绿灯亮起，打印针咔嗒作响：`【004号车皮调拨单已受理 · 随车联发运】`。
- **E0-2（迟疑核对）**：阿列克谢核对了三个名字，直到调度长伸手去抽那张透析液批条。他一把按住批条，在单据上按下了带血手印的私章。
- **E0-3（试图划掉陪护栏）**：调度长夺过钢笔，直接在上面盖上公章：“别犯蠢，少一个数字，全车皮都走不了。”阿列克谢最终默许了公章落下。

工人提着铆钉枪走过站台。随车联被锁进一块厚黄铜夹板，四枚铆钉结结实实打进 004 号闷罐车厢的铁门框上，随后刷上了一层防冻清漆。在风雪里，黄铜铭牌上阿列克谢的签名透着冰冷的反光。

汽笛拉响，铁轨在脚底下震颤。阿列克谢把那张透析液批条塞进大衣内袋，贴着胸口。隔着粗呢子布，纸片像冰块一样硌着肋骨。

十天后。妹妹拉娜去药局给母亲换碘伏帽，在红区外围排队做第三轮刮片筛查，被划入红码。她被清杀队带走塞进的车厢，正是这节挂在铁壳号车尾的 004 号。</p></details>
<details class="record" id="script-1-1" data-group="文学剧本" data-search="602 室的呼吸与电传机 文学剧本 1-1 / 文学底稿（可与战役对白对照） "><summary><strong>602 室的呼吸与电传机</strong><span>1-1 / 文学底稿（可与战役对白对照）</span></summary><p><b>旁白 / 阿列克谢</b>  602 室的空气里混杂着发霉的墙皮味、消毒水味和尿毒症晚期呼出的氨水味。</p><p><b>旁白 / 阿列克谢</b>  铁架床上，卡佳妈妈盖着两床褪色的红蓝格羊毛毯，露在被子外的双手布满了青紫色的针眼。腹透机每隔四十分钟便发出一次低沉的排液抽吸声。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢蹲在床边，正用温水擦拭母亲浮肿发亮的小腿。</p><p><b>卡佳妈妈</b> （喉咙里泛着痰音，眼睛半睁着） ……阿廖沙……外头……风停了吗？</p><p><b>阿列克谢</b> （动作放轻，拧干毛巾） 还没呢，妈。今天刮大烟暴。</p><p><b>卡佳妈妈</b>  拉娜……拉娜怎么还没下班？那孩子……出门时只穿了薄棉鞋，脚后跟容易生冻疮……</p><p><b>旁白 / 阿列克谢</b>  阿列克谢的手停了一下，毛巾上的温水滴在铁盆里，溅出轻微的脆响。他从大衣内袋摸出那张皱巴巴的假便条——那是他前天夜里模仿妹妹字迹写的：“医院封控两周，在宿舍住，勿念。拉娜。”</p><p><b>阿列克谢</b>  铁路医院派她去外地支援医疗了，最近电报也不通。她托人送了信，让您按时用药，等支援结束就回来。</p><p><b>旁白 / 阿列克谢</b>  卡佳妈妈闭上眼睛，眼眶陷在黑眼圈里。她摸索着抓住儿子的手腕，粗糙的掌心摩挲着阿列克谢手背上的防伪留观蓝印油。</p><p><b>卡佳妈妈</b>  阿廖沙……你手背上的蓝印子，洗不掉吧？……隔壁瓦莲京娜说，手上盖了这个章的人，夜里走路都不能挺胸……</p><p><b>旁白 / 阿列克谢</b>  墙角那个用铁皮外壳包着的寻呼终端突然剧烈蜂鸣起来。午夜 24:00 整，终端上那颗绿色的信号灯骤然亮起，伴随着打字机般干涩的走纸声：
【第3工人居住区：今日生活必需品及药品配额已全部签收 · 签发人：核算主任 杜布罗夫】</p><p><b>旁白 / 阿列克谢</b>  整栋楼的管道里，原本微弱的蒸汽哨声噗地断了。为了在系统里换取“全楼保暖评级达标”，核算站强行把所有未送达的配额勾选为“已签收”。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢站起身，走到厨房窗前。窗缝用旧报纸和胶水糊了三层，依然被风吹得呜呜直响。外面白茫茫一片，两道刺眼的黄白探照灯光柱在远处的铁轨上慢慢交叉切过。</p><p><b>旁白 / 阿列克谢</b>  他回到门厅，套上那件褪色的铁路厚棉大衣，用麻绳把裤脚扎紧，弯腰从床底下拖出一柄铸铁道钉撬棍。那是旧机车厂的产品，拿在手里沉甸甸的，撬尖磨得雪亮。</p><details class="translation"><summary>English</summary><p>The air in Room 602 was a mixture of mildewed plaster, disinfectant, and the ammonia breath of advanced uraemia.</p><p>On the iron bed Mama Katya lay under two faded red-and-blue checked wool blankets, the hands left outside the covers mapped with bruise-purple needle marks. Every forty minutes the dialysis machine gave a low, draining suck.</p><p>Aleksei crouched beside the bed, wiping his mother&#x27;s swollen, shiny calves with warm water.</p><p>...Alyosha... outside... has the wind stopped?</p><p>Not yet, Mama. There&#x27;s a real smoke-blizzard blowing.</p><p>Lana... why isn&#x27;t Lana off work yet? That child... she went out in thin padded shoes; her heels always get chilblains...</p><p>Aleksei&#x27;s hand faltered; warm water dripped from the cloth into the iron basin with a faint, brittle sound. From his inner coat pocket he drew the crumpled forged note — he had copied his sister&#x27;s hand two nights before: &#x27;Hospital locked down for two weeks. Staying in the dormitory. Don&#x27;t worry. Lana.</p><p>The railway hospital sent her away on a medical support detail. The telegraph lines are down just now. She got a letter sent: take your medicine on time, she&#x27;ll be back when the detail ends.</p><p>Mama Katya closed her eyes, the sockets sunk in rings of black. She groped for her son&#x27;s wrist, her rough palm worrying the blue anti-forgery observation stamp on the back of Aleksei&#x27;s hand.</p><p>Alyosha... that blue mark on your hand, it won&#x27;t wash off, will it? ...Valentina next door says a person stamped like that can&#x27;t walk at night with his chest held up...</p><p>In the corner, the pager terminal sheathed in sheet metal burst into a shrill buzz. At precisely midnight 24:00 its green lamp snapped on, accompanied by the dry, typewriter-like feeding of paper: [Workers&#x27; Residential Block 3: today&#x27;s quotas of necessities and medicine all signed for · Issuing officer: Chief Accountant Dubrov].</p><p>In the pipes throughout the building the faint steam whistle gave a puff and stopped. To earn the system&#x27;s &#x27;whole-building heating rating: compliant,&#x27; the accounting office had ticked every undelivered quota as &#x27;signed for.</p><p>Aleksei got up and went to the kitchen window. The cracks had been pasted over with three layers of old newspaper and glue, yet the wind still moaned through. Outside, everything was white and empty; two glaring yellow-white searchlight beams crossed slowly over the distant rails.</p><p>Back in the entry hall, he pulled on the faded heavy railway greatcoat, tied his trouser cuffs tight with hemp cord, and bent to drag a cast-iron spike crowbar out from under the bed. It was a product of the old locomotive works, heavy in the hand, its prying tip worn snow-bright.</p></details><p class="caption"></p></details>
<details class="record" id="script-1-2" data-group="文学剧本" data-search="冷库里的账面死人 文学剧本 1-2 / 文学底稿（可与战役对白对照） "><summary><strong>冷库里的账面死人</strong><span>1-2 / 文学底稿（可与战役对白对照）</span></summary><p><b>旁白 / 阿列克谢</b>  白昼。城北四号铁路冷库。</p><p><b>旁白 / 阿列克谢</b>  挂满白霜的氨气管道在头顶纵横交错，地面结了一层油污与冰渣混合的黑硬壳。阿列克谢作为征召搬运工，正将一箱箱贴着内务部封条的黄油和咸鱼搬上平板手推车。</p><p><b>旁白 / 阿列克谢</b>  在南库 3 号水泥柱后面，一个穿着破烂黑棉袄的男人正跪在冰水沟旁，怀里紧紧裹着一个裹在旧军毯里的小孩。小孩的脸色发灰，嘴唇冻得发紫。</p><p><b>旁白 / 阿列克谢</b>  内务部巡逻队的皮靴声在铁格栅通道上停下。切尔诺夫中士停在柱子前，手里拿着便携手持打卡机，金属探头对准了男人的手背。</p><p><b>旁白 / 阿列克谢</b>  终端滴地响了一声，红灯闪烁。</p><p><b>切尔诺夫中士</b> （语气平直，不带情绪） 档案 0892，谢尔盖。昨日 22:00 移交单乌拉尔山线。主脑记录：已出清。当前坐标在册人数：0。</p><p><b>旁白 / 阿列克谢</b>  男人猛地抬起头，眼睛里全是红血丝，干裂的嘴唇裂开血口子。</p><p><b>谢尔盖</b>  长官……机器搞错了！我没上车，我昨天在锅炉房换班，孩子发高烧……我没死，你看，玛丽亚也没死，她还喘气呢！</p><p><b>切尔诺夫中士</b> （把终端翻转过来，屏幕对着男人的脸） 上面写着零。机器只认打孔卡。在册是零，这根柱子底下就没有人。没有人，就没有今天的配给。</p><p><b>旁白 / 阿列克谢</b>  切尔诺夫伸手推开配给箱的铁盖，锁栓卡嗒一声落进锁槽。男人扑上去抓住中士的裤脚，指甲在硬皮靴上划出刺耳的声响。</p><p><b>谢尔盖</b>  长官！一口，就给玛丽亚一口热汤……</p><p><b>旁白 / 阿列克谢</b>  切尔诺夫中士往后撤了半步。他没有拔枪，也没有踹人，只是机械地把男人的手指一根根掰开。在转身离开的瞬间，切尔诺夫的脚尖在雪地里微微一滞，踢开了一个碍事的空铁皮盒，低声自言自语般吐出半句话：</p><p><b>切尔诺夫中士</b>  ……别在这儿耗着。去西站水塔后头找捡煤渣的，兴许有烂土豆。死在冷库里，连拉尸车都不会来。</p><p><b>旁白 / 阿列克谢</b>  中士带着两名队员快步走远。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢站在三米外，手里的板车把手被他捏得咯咯作响。在水泥柱后的阴影里，一只缺了半只耳朵的灰狼犬正趴在废弃收发亭的台阶下。它脖颈上缠着被剪断的锈铁丝；铁丝曾经勒进皮肉，留下了一圈褪不掉的伤痕，周围的毛也长得稀疏。它没有靠近谢尔盖，只安静地看着阿列克谢。</p><details class="translation"><summary>English</summary><p>Daylight. Rail Cold Storage No.4, north of the city.</p><p>Ammonia pipes crisscrossed overhead, thick with white frost; underfoot the floor was crusted with a black hard shell of oil and ice. Aleksei, a conscripted porter, was loading crates of butter and salt fish, sealed with Ministry of Internal Affairs strips, onto a flat handcart.</p><p>Behind concrete column 3 in the south hall, a man in a ragged black padded coat knelt beside a gutter of ice water, holding a child tightly wrapped in an old army blanket. The child&#x27;s face was grey, its lips blue-purple with cold.</p><p>The boots of a Ministry patrol stopped on the iron-grate walkway. Sergeant Chernov halted before the column, a portable punch-clock in his hand, its metal probe aimed at the man&#x27;s hand.</p><p>The terminal gave a single beep; a red light blinked.</p><p>File 0892, Sergey. Transferred to the Ural Line Station yesterday at 22:00. Central record: cleared. Persons registered at this coordinate: zero.</p><p>The man&#x27;s head snapped up, his eyes threaded with red, his cracked lips split and bleeding.</p><p>Officer... the machine&#x27;s wrong! I never boarded — I was covering a shift at the boiler house yesterday, the child had a fever... I&#x27;m not dead, look, Maria&#x27;s not dead either, she&#x27;s still breathing!</p><p>It says zero up there. The machine reads punch cards. Zero on the register means nobody under this column. Nobody means no ration today.</p><p>Chernov reached over and pushed the iron lid of the ration crate shut; the bolt clicked into its slot. The man lunged and clutched the sergeant&#x27;s trouser leg, his nails scraping a shrill sound across the stiff leather boot.</p><p>Officer! One mouthful — just one spoon of hot soup for Maria...</p><p>Sergeant Chernov stepped back half a pace. He did not draw his pistol or kick; he only pried the man&#x27;s fingers loose, one by one, mechanically. As he turned to go, his toe faltered a moment in the snow, kicked aside an empty tin box in the way, and he let fall half a sentence, almost to himself:</p><p>...Don&#x27;t waste time here. Go behind the water tower at West Station, find the cinder-pickers; there might be rotten potatoes. Die in the cold store and not even the corpse cart will come.</p><p>The sergeant strode off with his two men.</p><p>Aleksei stood three metres away, the handcart&#x27;s grip creaking under his fingers. In the shadow behind the concrete column, a grey wolfdog with half an ear missing lay on the steps of the abandoned dispatch hut. A length of cut, rusted wire was twisted round its neck; it had once bitten into the flesh and left a ring of scar that would not fade, the fur around it grown thin. It did not go to Sergey, only watched Aleksei quietly.</p></details><p class="caption">**【抉择 · 冷库的留痕】**
- **coldstore-01（救人并喂灰犬）**：阿列克谢背过身，用冻裂的食指掏出钢笔，在工作日志背面写下：*“谢尔盖，玛丽亚。活人。”* 他先把半块黑麦饼递给谢尔盖，让玛丽亚吃下几口；剩下的掰成小块，放在灰犬鼻尖前。灰犬迟疑片刻，叼走了面包。阿列克谢蹲下剪断它颈上的锈铁丝，伤痕完整地露出来。他没有把狗拽走，只把手掌摊开，等它自己跟上。灰烬站起身，抖掉背上的雪，从此跟在阿列克谢身后。**灰烬仅在此选择后入队。**
- **coldstore-02（低头推车）**：阿列克谢把头埋得更低，推着重车从他们身边走过。他没有救下谢尔盖父女，也没有喂那只灰犬。灰犬留在废弃收发亭旁，颈上的断铁丝仍勒着旧伤；之后不会跟随阿列克谢。</p></details>
<details class="record" id="script-1-3" data-group="文学剧本" data-search="初入红区与退烧的母亲 文学剧本 1-3 / 文学底稿（可与战役对白对照） "><summary><strong>初入红区与退烧的母亲</strong><span>1-3 / 文学底稿（可与战役对白对照）</span></summary><p><b>旁白 / 阿列克谢</b>  夜间 01:30。宵禁警报准时在全城回荡。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢用撬棍顶开 602 楼下一楼锅炉房的生锈通风铁窗，冰冷的夜风瞬间灌满了他的领口。灰烬率先钻出狭窄的窗缝，落入两米深的积雪中，警惕地伏在雪坑里。</p><p><b>旁白 / 阿列克谢</b>  远处铁轨上传来沉重的钢轨挤压声。高耸的水泥煤水塔顶上，Ⅰ级探照灯的黄白光柱正以极慢的节奏扫过铁丝网外围。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢紧贴着废弃车厢的生锈侧板前行。前方的铁丝网破口处，忽然传来低沉的呜咽声。</p><p><b>旁白 / 阿列克谢</b>  借着雪地的反光，阿列克谢看见一个穿着灰色化纤大衣的女人。她的右手背上长满了粗糙的灰白角质硬鳞，左眼的眼白被浑浊的紫黑血翳覆盖——但那片血翳正在以肉眼可见的速度剥落，露出底下深褐色的眼珠。她没有攻击周围的死物，而是死死抓着单元防盗门的铁栅栏，指节被冻得发青。</p><p><b>回退期的母亲</b> （声音沙哑，带着干咳） ……开门啊……科利亚，妈妈退烧了……妈妈不烫了，手背上的鳞掉在雪里了……让我看一眼小安东……</p><p><b>旁白 / 阿列克谢</b>  沉重的脚步声踩碎积雪。两道雪亮的光柱猛地将女人罩在中央。</p><p><b>旁白 / 阿列克谢</b>  两名身穿铅灰色厚橡胶防化服的清杀队员从涵洞拐角步出，圆形的猪嘴防毒面具在强光下反射出无机质的冰冷光泽。他们手里的 AKM 步枪下挂红外线瞄准器，红点直接落在了女人的胸口。</p><p><b>旁白 / 阿列克谢</b>  女人惊恐地抬起手遮挡强光，嘴里还在徒劳地辩解：“我好了……真的好了，我不咬人……”</p><p><b>旁白 / 阿列克谢</b>  噗。噗。
微声枪口冒出两团极短的蓝焰。</p><p><b>旁白 / 阿列克谢</b>  女人应声倒下，身体在雪地里抽搐了两下便不再动弹。黑红色的血渗进雪层，迅速冻成硬邦邦的黑冰。其中一名队员面无表情地上前，用靴尖将女人抓在手里的那串家用铜钥匙踢进水沟，按动挂在胸前的电传终端：【红区外围发现异化目标一名，已按规程出清。】</p><p><b>旁白 / 阿列克谢</b>  阿列克谢死死捂住灰烬的吻部，整个人陷在煤堆的阴影里，心脏在胸膛里疯狂撞击。</p><p><b>旁白 / 阿列克谢</b>  女人手背上的鳞屑在融雪中一片片脱落。</p><p><b>旁白 / 阿列克谢</b>  她没有疯。她退烧了。</p><p><b>旁白 / 阿列克谢</b>  熬过高热的人会好起来。</p><p><b>旁白 / 阿列克谢</b>  那被装进铁壳号第三节车厢的拉娜……也可能正处在退烧的过程中。</p><details class="translation"><summary>English</summary><p>01:30 at night. The curfew siren sounded on schedule, echoing through the whole city.</p><p>Aleksei used the crowbar to force the rusted ventilation window of the boiler room on the ground floor below Block 602; the freezing night wind poured straight into his collar. Ash was first through the narrow gap, dropping into the two metres of accumulated snow and flattening warily into a hollow.</p><p>Far off, the heavy grinding of rails being stressed came over the tracks. From the top of the tall concrete coal-and-water tower, the yellow-white beam of a Class-I searchlight swept the barbed-wire perimeter at a very slow rhythm.</p><p>Aleksei moved along hugging the rusted flank of an abandoned freight car. At a tear in the wire fence ahead, a low moaning suddenly came.</p><p>In the reflected glare of the snow Aleksei saw a woman in a grey synthetic coat. The back of her right hand was grown over with coarse grey-white horny scales; the white of her left eye was veiled in a turbid purple-black film — but the film was flaking away at a speed the eye could follow, exposing the dark brown eyeball beneath. She was not attacking the dead things around her; she clutched the iron bars of the stairwell&#x27;s security door, her knuckles blue with cold.</p><p>...Open the door... Kolya, Mummy&#x27;s fever has broken... I&#x27;m not hot any more, the scales on my hand have fallen into the snow... let me see little Anton...</p><p>Heavy boots crushed the snow. Two glaring beams caught the woman squarely in their centre.</p><p>Two OSK men in lead-grey heavy rubber protective suits came round the culvert, their round pig-snout gas masks throwing off an inorganic, cold sheen in the glare. Infrared sights were mounted under the AKM rifles in their hands; the red dot settled directly on the woman&#x27;s chest.</p><p>The woman flung up a hand against the light, still protesting in vain: &#x27;I&#x27;m better... really better, I don&#x27;t bite...</p><p>Pfft. Pfft.
Two very short blue flames spat from the suppressed muzzles.</p><p>The woman fell at the sound, convulsed twice in the snow, then lay still. Black-red blood soaked into the snow and froze quickly into hard black ice. One of the men, face void of expression, stepped up and kicked the bunch of household copper keys from her hand into the gutter, then worked the teletype terminal at his chest: [One Rabid sighted on the edge of the Red Zone; cleared according to protocol].</p><p>Aleksei clamped a hand hard over Ash&#x27;s muzzle, sinking whole into the shadow of the coal heap, his heart hammering against his chest.</p><p>The scales on the back of the woman&#x27;s hand flaked off one by one into the melting snow.</p><p>She was not mad. Her fever had broken.</p><p>Those who survive the high fever get better.</p><p>And Lana, shut into the Buran&#x27;s third boxcar... might be in the middle of her fever breaking too.</p></details><p class="caption"></p></details>
<details class="record" id="script-1-4" data-group="文学剧本" data-search="假人哨塔与新兵帕沙 文学剧本 1-4 / 文学底稿（可与战役对白对照） "><summary><strong>假人哨塔与新兵帕沙</strong><span>1-4 / 文学底稿（可与战役对白对照）</span></summary><p><b>旁白 / 阿列克谢</b>  越过第二道铁轨阻拦索，前方出现了一座三米高的木架哨塔。</p><p><b>旁白 / 阿列克谢</b>  哨塔上伫立着一名端枪的清杀队员，在探照灯的背光下显得异常高大威严。然而灰烬甚至没有压低身子，只是慢吞吞地从塔下走过。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢贴近铁梯。头顶上传来断续的录音机杂音，一台挂在木栏杆上的开盘机正转动着磁带，用失真的大喇叭嗓音反复播报着《告居民书》。</p><p><b>旁白 / 阿列克谢</b>  塔上的“哨兵”是用三根杉木条和旧防化服扎起来的假人，空荡荡的风镜里塞着碎棉花。</p><p><b>旁白 / 阿列克谢</b>  而在铁梯底下的避风背阴处，蜷缩着一个真正的人。</p><p><b>旁白 / 阿列克谢</b>  那是个年轻得有些过分的士兵，防化服套在他身上显得过于宽大，下摆拖在雪地里。他把防毒面具摘了下来扔在脚边，露出一张被高烧烧得干红的脸，嘴唇起了一层白皮。他手里握着一支玻璃水银体温计，借着雪光反复看着刻度：39.2℃。</p><p><b>旁白 / 阿列克谢</b>  听见雪地的碎响，士兵吓得一哆嗦，下意识地去抓地上的步枪，但手抖得连枪带都没握住。</p><p><b>帕沙</b> （带着浓重的农村口音，吸着鼻涕） ……别……别过来！我手里有家伙……</p><p><b>旁白 / 阿列克谢</b>  阿列克谢停在三步外，手里的撬棍微微下垂。</p><p><b>阿列克谢</b>  你的枪栓都没拉开。</p><p><b>旁白 / 阿列克谢</b>  帕沙愣了一下，低头看了看枪，眼泪突然涌了出来。他吸了吸鼻子，用冻裂的袖口去擦脸。</p><p><b>帕沙</b>  哥……我求你了，你有退烧药吗？阿司匹林、安乃近，什么都行……我体温到了三十九度二。明天清早督察队要用红外枪量额头，要是过了三十八度五，假人哨塔顶上挂的就该是我了……</p><p><b>阿列克谢</b> （盯着他身上那件铅灰色的正规军大衣） 你是内务部的人。你们车队里连阿司匹林都没有？</p><p><b>帕沙</b> （蹲在地上，抱住膝盖发抖） 哪有我们的份啊……那是特勤连的官老爷才有的。我们这种从奥廖尔招来的新兵，发一身大衣服就往铁道上一扔……以前在村里，天旱了怕颗粒无收，涝了怕塌房。穿上这身皮，站在那儿跟木头人一样，队里就管饭，没人问你家里还有几口人。阿廖沙……我听他们这么叫你。当木头人多省心啊，站在塔上一动不动，没人扣你的工分，也没人查你体温……可我一发烧，我就怕……我想我娘腌的酸黄瓜……</p><details class="translation"><summary>English</summary><p>Past the second rail cable barrier, a three-metre wooden watchtower rose ahead.</p><p>On the tower stood an OSK guard with a rifle at the ready, looming unnaturally tall and solemn against the searchlight. Ash did not even lower its body; it merely ambled past beneath.</p><p>Aleksei pressed close to the iron ladder. Overhead came the broken crackle of a tape recorder; a reel-to-reel set hung on the wooden rail, its tape turning, repeating a distorted loudspeaker voice reading the &#x27;Notice to Residents&#x27;.</p><p>The &#x27;sentry&#x27; on the tower was a dummy lashed together from three fir planks and an old protective suit, bits of cotton wadding stuffed into the empty goggles.</p><p>But at the foot of the ladder, in the windless shade, a real person lay curled up.</p><p>He was a soldier ridiculously young, the protective suit far too big for him, its hem trailing in the snow. He had pulled off his gas mask and tossed it by his feet, showing a face flushed dry-red with fever, a white film peeling on his lips. In his hand he held a glass mercury thermometer, and by the light of the snow he read the scale again and again: 39.2°C.</p><p>Hearing the crunch of snow, the soldier flinched and reached instinctively for the rifle on the ground, but his hands shook so badly he could not even catch the sling.</p><p>...Don&#x27;t... don&#x27;t come closer! I&#x27;ve got a gun here...</p><p>Aleksei stopped three paces away, the crowbar dipping slightly in his hand.</p><p>You haven&#x27;t even racked the bolt.</p><p>Pasha stared, looked down at the rifle, and the tears came suddenly. He sniffed and wiped his face with a cracked, frozen cuff.</p><p>Brother... please, do you have anything to bring a fever down? Aspirin, analgin, anything... my temperature&#x27;s 39.2. At dawn the inspectors will measure foreheads with an infrared gun; if it&#x27;s over 38.5, I&#x27;m the one they&#x27;ll hang on top of that dummy tower...</p><p>You&#x27;re with the Ministry. Your whole convoy hasn&#x27;t got a single aspirin?</p><p>Not for the likes of us... that&#x27;s for the gentlemen in the special details. New conscripts like me, dragged in from Oryol — they hand you a big coat and drop you by the railway... Back in the village, in a drought you feared the harvest would fail; in flood you feared the roof would fall. In this skin, you stand there like a wooden man and the unit feeds you; nobody asks how many are left at home. Alyosha... that&#x27;s what I heard them call you. It&#x27;s easy being a wooden man — stand on the tower without moving, nobody docks your work points, nobody checks your temperature... but once I start burning, I get scared... I want my mother&#x27;s pickled cucumbers...</p></details><p class="caption">**【抉择 A′ · 帕沙的 39 度 2】**
- **A′1（给出退烧片）**：阿列克谢从怀里掏出一片退烧药，递给帕沙。帕沙像接圣餐一样把药片吞了下去，连雪水都没来得及嚼；他缩回袖口的手终于不再发抖。（**良知▲**，帕沙记住了这份药。）
- **A′2（绕开不理）**：阿列克谢看了看他，一言不发地退回阴影中。十分钟后，身后传来换岗巡逻队的脚步声，接着是一声沉闷的微声枪响。木头人多了一个，省心的人少了一个。
- **A′3（夺取补给）**：阿列克谢用撬棍顶住少年的喉咙，扒下了他身上的备用滤毒罐和口袋里仅剩的半条压缩饼干。少年绝望地瘫在雪里。工作日志背面，阿列克谢用钢笔划下了第一道深重的竖痕：“|”。</p></details>
<details class="record" id="script-1-4A" data-group="文学剧本" data-search="货场黑账与扎哈尔 文学剧本 1-4A / 文学底稿（可与战役对白对照） "><summary><strong>货场黑账与扎哈尔</strong><span>1-4A / 文学底稿（可与战役对白对照）</span></summary><p><b>旁白 / 阿列克谢</b>  货场换岗时，阿列克谢从煤水塔后绕过一排待报废的配给箱。一个戴蓝袖章的核算员正把没收来的手套、滤芯和烟草重新分堆，手里那本账簿没有一页写着失主的名字。</p><p><b>核算员扎哈尔</b> （把账本合上，先看了看阿列克谢的手，再看向远处的巡逻灯） 我叫扎哈尔。以前我替配给站登记每一袋粮，后来那本账上只剩空格。带我走吧，我能从一堆废物里认出还有用的东西。别把这当忠诚——我只是不想再挨饿。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢问他，如果清杀队愿意拿配额换一份举报，他会怎么做。扎哈尔没有否认，只用拇指擦掉账本封面上的冻泥。</p><p><b>核算员扎哈尔</b>  要是他们给的配额比你给的多，我会把知道的都报上去。账不会替谁讲情。</p><details class="translation"><summary>English</summary><p>During the shift change at the freight yard, Aleksei slips around the coal-water tower past a row of ration crates marked for scrap. A blue-armband clerk is re-sorting confiscated gloves, filter cartridges, and tobacco; not one page of the ledger in his hand bears the name of a rightful owner.</p><p>My name is Zakhar. I used to record every sack at the ration office. In the end, my own ledger was only blanks. Take me with you; I can tell what is still worth saving from a heap of scrap. Don&#x27;t call it loyalty. I just don&#x27;t want to go hungry again.</p><p>Aleksei asked him what he would do if the OSK offered rations in exchange for a denunciation. Zakhar did not deny it; he only wiped the frozen mud from the ledger&#x27;s cover with his thumb.</p><p>If they offer more rations than you do, I&#x27;ll report everything I know. A ledger doesn&#x27;t plead for anyone.</p></details><p class="caption"></p></details>
<details class="record" id="script-2-1" data-group="文学剧本" data-search="白桦林公寓东窗与 601 室的算计 文学剧本 2-1 / 文学底稿（可与战役对白对照） "><summary><strong>白桦林公寓东窗与 601 室的算计</strong><span>2-1 / 文学底稿（可与战役对白对照）</span></summary><p><b>旁白 / 阿列克谢</b>  白桦林公寓原本是一栋纺织女工宿舍，如今整栋楼被四米高的铁丝网和铁皮封板包裹得像一只铁皮棺材。一楼的所有门窗全被厚钢板封死，只在东侧留了一个半米见方的铁抽屉窗口，用于每日下午四点前进行物资交接。</p><p><b>旁白 / 阿列克谢</b>  15:52。阿列克谢抱着一个用粗布包裹的铁皮奶粉罐冲过铁轨下穿涵洞。那是他在西区旧仓库翻出的深度水解抗敏奶粉，罐身生了锈，但密封完好。</p><p><b>旁白 / 阿列克谢</b>  东侧交接窗口前，负责消毒的蓝袖章核算员正拿着一把长嘴喷壶，对着铁抽屉喷洒浓烈的来苏尔药水。</p><p><b>核算员</b>  系统词条里只有标准 1 号全脂奶粉，你这个是私货，没有检疫铅封。按规程，就地销毁。</p><p><b>阿列克谢</b> （一把按住下坠的铁闸门） 402 的孩子吃全脂奶粉喉咙水肿快憋死了！你睁开眼看看，这是药房的封条！</p><p><b>核算员</b>  我只看终端。四点整主脑断网平账，多一件无码物品，整栋楼扣除两分信用值。</p><p><b>旁白 / 阿列克谢</b>  15:59。电动铁闸发出低沉的下压齿轮咬合声。阿列克谢额头青筋暴起，直接将手里的道钉撬棍横着卡进了齿轮槽！火花四溅中，钢铁挤压出令人牙酸的摩擦声。他猛地拉开抽屉，将奶粉罐顺着滑道狠狠推了进去！</p><p><b>旁白 / 阿列克谢</b>  铁窗内侧，一只布满冻疮的年轻女人的手一把抱住了奶粉罐，窗缝里传来 402 室莉莉娅带着哭腔的抽泣：“……谢谢……谢谢……”</p><p><b>旁白 / 阿列克谢</b>  然而，当阿列克谢拔出撬棍跌坐在雪地里时，他抬起头，看见对面三楼、四楼好几个被霜花封住的玻璃窗后面，有几双眼睛正冷冷地盯着他。一台老式胶卷相机的镜头在窗帘缝隙里闪了一下。</p><p><b>旁白 / 阿列克谢</b>  当夜。601 室门外。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢顺着楼梯间上楼时，看见 601 室的房门开了一条缝。</p><p><b>旁白 / 阿列克谢</b>  六十三岁的柳德米拉大娘正坐在门口的小马扎上，借着楼道里昏暗的应急灯，手里反复数着两张红色的硬纸片。那是区管委新推行的“加配领粮券”，每张券可以换半斤黑麦粉。纸片边缘沾着几滴已经干涸的红漆。</p><p><b>旁白 / 阿列克谢</b>  五岁的外孙女佳娜趴在大娘膝盖上，穿着一件极不合身的旧棉袍，正吸吮着一根发黑的空木勺。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢在楼梯缓台上停住脚。他认出了那张券——今天下午举报 402 室私收走私货的举报箱里，就插着这种信封。</p><p><b>旁白 / 阿列克谢</b>  柳德米拉大娘听见了脚步声，手一抖，两张券落在了地上。她看清了是阿列克谢，眼神先是一慌，随即迅速板了起来，像一层冻硬了的水泥。</p><p><b>柳德米拉大娘</b> （把地上的券捡起来，用袖子蹭干净上面的灰） 看什么看？阿廖沙，你别用那种眼神看我。我没偷没抢。</p><p><b>阿列克谢</b> （扶了扶眼镜，声音低沉） 402 楼道门刚才被人泼了红漆，莉莉娅连水房都出不去了。</p><p><b>柳德米拉大娘</b> （声音猛地拔高，随即又心虚地压低，喉咙里发出粗重的倒气声） 那人昨天还帮我修过门轴，今天就被拖进冷库了！可我不写那张条子，佳娜拿什么冲奶？你们谁管过她哭？你妈在六楼好歹有透析液挂着，我外孙女两天没屙出一粒屎，肚子里全咽的是被面上的棉花絮！那两罐洋奶粉是她该得的吗？大家都在喝发霉的黑麦糊，凭什么她家孩子能吃洋粉？我给管委写条子，我换了两斤黑麦面，佳娜今晚能喝上一口稠的……我错哪儿了？你说啊，我错哪儿了？！</p><p><b>旁白 / 阿列克谢</b>  佳娜被姥姥的喊声吓着了，把小脸埋进大娘怀里，小声嘟囔：“姥姥，不吵……佳娜不饿了……”</p><p><b>旁白 / 阿列克谢</b>  柳德米拉紧紧搂住孩子，眼泪顺着满是褶子的脸颊淌进嘴角的苦纹里。她没有再说一句话，只是砰地一声把防盗门摔上，铁栓咔哒一声反锁了。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢站在昏暗的楼道里，楼下穿堂风从破损的玻璃缝里吹进来，吹得地上一张废弃的公文纸在水泥地上沙沙作响。</p><details class="translation"><summary>English</summary><p>Birch Grove Apartments was once a dormitory for female textile workers; now the whole building is wrapped in four-metre wire mesh and sheet-metal panels like a tin coffin. Every door and window on the ground floor is sealed shut with thick steel plate, save for a half-metre-square iron drawer-hatch on the east side, used for the daily handover of supplies before four o&#x27;clock each afternoon.</p><p>15:52. Aleksei sprints through the railway underpass, clutching a tin of formula wrapped in coarse cloth. He found it in an old West District warehouse — extensively hydrolyzed hypoallergenic formula, the tin rusted but the seal intact.</p><p>At the east handover hatch, the blue-armband clerk in charge of disinfection is spraying the iron drawer with a long-spouted can of strong Lysol solution.</p><p>The system registry lists only Standard No. 1 whole-milk formula. What you have is private stock, with no quarantine seal. By regulation, it must be destroyed on the spot.</p><p>The child in Room 402 is choking — his throat is swelling from whole-milk formula! Open your eyes and look: this is a pharmacy seal!</p><p>I only read the terminal. At four the Central Mainframe goes offline to balance the books; one unmarked item too many costs the whole building two credit points.</p><p>15:59. The electric shutter grinds down with a low meshing of gears. The veins bulge on Aleksei&#x27;s forehead as he jams his railway-spike crowbar sideways into the gear track. Sparks fly; steel grinds against steel with a sound that sets the teeth on edge. He wrenches the drawer open and shoves the tin hard down the chute.</p><p>Inside the iron hatch, a young woman&#x27;s hand, covered in chilblains, closes around the tin. Through the gap comes the sobbing voice of Lilia in Room 402: “...Thank you... thank you...”</p><p>Yet when Aleksei pulls the crowbar free and drops into the snow, he looks up and sees, behind several frost-sealed windows on the third and fourth floors across the way, pairs of eyes fixed coldly upon him. The lens of an old film camera glints in a gap in the curtains.</p><p>That night. Outside Room 601.</p><p>As Aleksei climbs the stairwell, he sees the door of Room 601 standing ajar.</p><p>Sixty-three-year-old Grandmother Lyudmila sits on a small folding stool by the door, counting the same two red cardboard slips over and over in the dim emergency light. They are the District Rationing Committee&#x27;s new “supplemental ration coupons,” each worth half a jin of rye flour. Dried drops of red paint cling to their edges.</p><p>Her five-year-old granddaughter Dyana lies across her knees in a badly ill-fitting old padded coat, sucking on a blackened empty wooden spoon.</p><p>Aleksei stops on the landing. He recognizes the coupons — the denunciation box this afternoon, for the smuggled goods taken in by Room 402, held envelopes just like these.</p><p>Lyudmila hears his footsteps; her hand jerks, and the two slips fall to the floor. When she makes out Aleksei, her expression falters for an instant, then hardens — like a layer of frozen cement.</p><p>What are you staring at? Don&#x27;t look at me like that, Alyosha. I haven&#x27;t stolen anything, I haven&#x27;t robbed anyone.</p><p>Someone threw red paint over the door to Room 402 just now. Lilia can&#x27;t even get out to the washroom.</p><p>That man fixed my door hinge only yesterday, and today they dragged him off to cold storage! But if I don&#x27;t write that note, what will Dyana use to mix her milk? Which of you ever cared when she cried? Your mother at least has dialysis fluid running on the sixth floor; my granddaughter hasn&#x27;t passed a thing in two days — all that&#x27;s in her belly is cotton wadding off the quilt! Those two tins of foreign formula — did she deserve them? Everyone&#x27;s drinking mouldy rye gruel; why should that family&#x27;s child get foreign powder? I wrote the Committee a note, I got two jin of rye flour, and tonight Dyana can have one thick mouthful... Where did I go wrong? Tell me — where did I go wrong?!</p><p>Frightened by Granny&#x27;s shouting, Dyana buries her little face in her grandmother&#x27;s bosom and mutters softly: “Granny, don&#x27;t fight... Dyana isn&#x27;t hungry anymore...”</p><p>Lyudmila holds the child tight, tears running down her lined cheeks into the bitter creases about her mouth. She says not another word; she only slams the security door shut with a bang, and the iron bolt clicks locked.</p><p>Aleksei stands in the dim corridor. From below, a draught pushes through the broken glass and sets a discarded official paper rustling across the concrete floor.</p></details><p class="caption"></p></details>
<details class="record" id="script-2-2" data-group="文学剧本" data-search="后厨的砍骨刀与瓦西里的“渴” 文学剧本 2-2 / 文学底稿（可与战役对白对照） "><summary><strong>后厨的砍骨刀与瓦西里的“渴”</strong><span>2-2 / 文学底稿（可与战役对白对照）</span></summary><p><b>旁白 / 阿列克谢</b>  东街工人食堂。</p><p><b>旁白 / 阿列克谢</b>  这里早在一个月前就停止了集中供应，整栋建筑被列入“账面清空区”。但阿列克谢知道，老炊事员费奥多尔依然躲在后厨，守着地窖里仅剩的三袋陈化黑麦粒，偷偷给附近滞留的十九个老铁路工熬糊糊。</p><p><b>旁白 / 阿列克谢</b>  后厨弥漫着酸败的油脂味和发馊的面粉气味。地面积着寸许厚的黑水，水面上浮着薄冰。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢挑开破烂的布帘跨进后厨。灶台边，费奥多尔老爹正蹲在地上用小煤炉煮雪水，磨旧的袖口沾着炉灰。</p><p><b>费奥多尔</b> （抬头看了看阿列克谢） 阿廖沙……你来得不巧。锅里只有雪水。地窖快见底了。</p><p><b>旁白 / 阿列克谢</b>  话音未落，储藏室那扇用粗铁丝捆着的木门突然发出了一声沉重的闷响。</p><p><b>旁白 / 阿列克谢</b>  嘭！</p><p><b>旁白 / 阿列克谢</b>  整扇木门被一股巨大的力量撞得向外凸起，木屑崩落。费奥多尔手里的铁勺当啷一声掉进水盆里，脸色刷地惨白。</p><p><b>费奥多尔</b> （声音剧烈发抖） 瓦西里……是我儿子！他前天夜里冒着大雪去给四楼瘫痪的老钳工送糊糊，半路上冻透了，回来就发起高烧……我把他锁在里头，给他灌了姜水，可他……他手上的皮全硬了……</p><p><b>旁白 / 阿列克谢</b>  木门在第二下撞击中彻底炸裂开来！</p><p><b>旁白 / 阿列克谢</b>  一个二十出头的小伙子从黑暗中跌撞着冲了出来。他浑身滚烫，呼出的白气带着刺鼻的酸臭味，右手背到小臂覆盖着一层厚厚的灰白角质硬鳞。他的双眼布满紫黑色的血翳，喉咙里发出类似风箱漏气般的急促喘息，毫无目标地挥舞着双手，一头撞翻了备餐的铁案台！</p><p><b>旁白 / 阿列克谢</b>  案台上的大铁盆砸在地上，发出震耳欲聋的巨响。瓦西里被巨响刺激，猛地扭过头，浑浊的眼睛锁定了站在门口的阿列克谢，嘶吼着扑了过来！</p><p><b>旁白 / 阿列克谢</b>  阿列克谢被撞得倒退数步，后背狠狠砸在冷藏柜锋利的铁角上，剧痛让他眼前一黑。瓦西里的力气大得惊人，滚烫的双手死死掐住了阿列克谢的脖子，口水和带血的泡沫滴在阿列克谢的镜片上。</p><p><b>旁白 / 阿列克谢</b>  空气被一点点抽离。阿列克谢的右手在油腻的砧板上胡乱摸索，手指触到了一个冰冷沉重的木柄——那是费奥多尔砍冻猪肉用的宽背砍骨刀。</p><p><b>旁白 / 阿列克谢</b>  生死只在一瞬。恐惧彻底压垮了理智。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢猛地抽出砍骨刀，借着下坠的力量，自下而上用尽全身力气劈了出去！</p><p><b>旁白 / 阿列克谢</b>  咔嚓！</p><p><b>旁白 / 阿列克谢</b>  厚重的生锈刀刃准确地楔进了瓦西里的左侧锁骨窝，深陷进骨缝之中。</p><p><b>旁白 / 阿列克谢</b>  扑击的力量戛然而止。</p><p><b>旁白 / 阿列克谢</b>  滚烫的血像打开的阀门一样喷涌而出，溅了阿列克谢满脸。瓦西里喉咙里的嘶吼停住了。随着大量鲜血的流失，他眼眶里那层紫黑色的血翳像是退潮一般迅速消散，露出了底下原本清澈明亮的浅蓝色眼珠。</p><p><b>旁白 / 阿列克谢</b>  那个狂暴的“怪物”在两秒钟之内消失了。靠在阿列克谢肩头的，变成了一个刚满二十岁、眼神里充满惊恐与茫然的年轻木讷工棚小伙。</p><p><b>旁白 / 阿列克谢</b>  瓦西里看着阿列克谢，嘴唇剧烈颤抖着，喉咙里咕噜作响，用尽最后的力气吐出了一个含混不清的俄语词汇：</p><p><b>瓦西里</b> （眼神涣散，瞳孔放大） ……Пить……（水……渴……）</p><p><b>旁白 / 阿列克谢</b>  他的头垂了下来，重重地砸在阿列克谢的肩膀上，再也没有动弹。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢双手握着刀柄，浑身筛糠般发抖。他想把刀拔出来，但刀刃被锁骨死死卡住，稍一用力，就发出令人骨髓发冷的骨头摩擦声。</p><p><b>旁白 / 阿列克谢</b>  费奥多尔跌跌撞撞地爬过来，噗通一声跪在儿子身边。老人没有扑上来打阿列克谢，只是伸出颤抖的双手，摸了摸儿子渐渐冰凉的脸颊。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢落下了终生无法痊愈的心理创伤——创伤性干渴耳鸣。每当他在极度紧张或深夜潜行时，耳边便会反复轰鸣着骨裂声，以及那个在血泊中微弱求饶的词句：“Пить……”</p><details class="translation"><summary>English</summary><p>East Street Workers&#x27; Canteen.</p><p>Centralized food distribution here stopped a full month ago; the whole building was marked a “ledger-cleared zone.” But Aleksei knows the one-eyed old cook Fyodor is still hiding in the kitchen, guarding the last three sacks of aged rye in the cellar and quietly boiling gruel for the nineteen old railway workers stranded nearby.</p><p>The kitchen reeks of rancid fat and sour flour. An inch of black water lies on the floor, with a skin of thin ice floating on it.</p><p>Aleksei pushes aside the ragged cloth curtain and steps into the kitchen. By the stove, old Fyodor crouches on the floor, boiling snow water over a small coal brazier, the black leather patch over his one eye worn shiny.</p><p>Alyosha... you&#x27;ve come at a bad time. There&#x27;s only snow water in the pot. The cellar&#x27;s nearly empty.</p><p>Before the words are out, the storeroom door — a plank bound with coarse iron wire — gives a heavy, muffled thud.</p><p>Bang!</p><p>The whole door bows outward under some tremendous force, splinters flying. The iron ladle clatters out of Fyodor&#x27;s hand into the washbasin, and his face goes white in an instant.</p><p>Vasily... he&#x27;s my son! The night before last he went out in the blizzard to take gruel to the paralysed old fitter on the fourth floor, and was frozen through before he got back — then the fever took him... I locked him in and gave him ginger water, but his... the skin on his hands has all gone hard...</p><p>The door bursts completely apart on the second impact!</p><p>A young man, barely twenty, staggers out of the darkness. He is burning hot; the white breath from his mouth carries a sharp, sour stench. His right hand and forearm are covered in a thick layer of grey-white keratinous scale. Purple-black clouds fill his eyes, and a rapid, bellows-leaking rasp works in his throat. He flails blindly and crashes headlong into the steel prep table, upsetting it.</p><p>The great iron basin on the table hits the floor with a deafening clang. The noise jolts Vasily: his head snaps round, his clouded eyes fix on Aleksei in the doorway, and he lunges with a shriek.</p><p>The blow drives Aleksei back several steps; his spine strikes the sharp iron corner of the cold-storage cabinet, and the pain blacks out his sight. Vasily&#x27;s strength is terrifying. His scalding hands lock around Aleksei&#x27;s throat, and spittle and bloody foam drip onto the lenses of his glasses.</p><p>The air is drawn out of him bit by bit. Aleksei&#x27;s right hand gropes blindly over the greasy chopping block, and his fingers close on a cold, heavy wooden handle — Fyodor&#x27;s broad-backed cleaver for frozen pork.</p><p>Life and death turn on a single instant. Fear breaks reason utterly.</p><p>Aleksei snatches the cleaver free and, riding the downward pull, drives it upward with all the strength in his body.</p><p>Crack!</p><p>The heavy, rusted blade wedges true into the hollow above Vasily&#x27;s left collarbone, sinking deep between the bones.</p><p>The force of the lunge stops dead.</p><p>Scalding blood gushes out as though a valve had been opened, spattering Aleksei&#x27;s face. The rasp in Vasily&#x27;s throat ceases. As the blood drains away, the purple-black film in his eyes recedes like an ebbing tide, laying bare the clear, bright pale-blue eyes beneath.</p><p>The Rabid “monster” is gone within two seconds. What slumps against Aleksei&#x27;s shoulder is a slow, gangly young bunkhouse lad just turned twenty, his eyes full of terror and bewilderment.</p><p>Vasily looks at Aleksei, lips shuddering, throat gurgling, and with his last strength forces out one slurred Russian word:</p><p>“...Пить... (Water... thirsty...)”</p><p>His head drops forward, lands heavily on Aleksei&#x27;s shoulder, and never moves again.</p><p>Aleksei grips the handle in both hands, shaking like a leaf in a gale. He tries to pull the blade out, but the collarbone holds it fast; the least effort brings a grating of bone that chills the marrow.</p><p>Fyodor stumbles over and drops with a thud to his knees beside his son. He does not throw himself at Aleksei; he only reaches out with trembling hands and touches his son&#x27;s cooling cheek.</p><p>Aleksei is left with a psychological wound that will never heal — PTSD Thirst Tinnitus. Whenever he is under extreme strain or moving in the small hours, his ears ring again with the crack of splitting bone, and with that faint word of pleading from the pool of blood: “Пить...”</p></details><p class="caption"></p></details>
<details class="record" id="script-2-3" data-group="文学剧本" data-search="回访后厨与背负的权利 文学剧本 2-3 / 文学底稿（可与战役对白对照） "><summary><strong>回访后厨与背负的权利</strong><span>2-3 / 文学底稿（可与战役对白对照）</span></summary><p><b>旁白 / 阿列克谢</b>  两天后的深夜。气温降至零下三十四度。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢顶着高烧，独自一人重新回到了东街工人食堂的后厨。他的棉大衣内侧藏着他在黑市用两瓶高纯度医用酒精换来的三小袋黑麦粉。</p><p><b>旁白 / 阿列克谢</b>  后厨的水已经冻成了结实的黑冰。费奥多尔老爹坐在灶台旁，身上披着一件旧羊皮袄。瓦西里的遗体已经被抬到了案台上，盖着一条洗得发白的粗帆布，露出一双穿着破胶鞋的脚。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢走到老人面前，两腿一软，跪在满是凝固血污的冰面上。</p><p><b>阿列克谢</b> （低下头，把装面粉的布袋推到老人脚边，声音沙哑得几乎听不清） 费奥多尔大叔……打死我吧。瓦西里冲出来的时候脚底下踩滑了……我手里握着撬棍，我本可以砸他的膝盖……可我害怕了，我挑了最省事的砍骨刀。</p><p><b>旁白 / 阿列克谢</b>  老人很久没有出声。屋子里只有北风灌进烟囱的呜咽声。</p><p><b>旁白 / 阿列克谢</b>  过了很久，一只粗糙、布满烫伤硬茧的大手落在了阿列克谢被雪打湿的头顶上。老人没有拿刀，也没有把面粉扔出去。他站起身，走到瓦西里的遗体旁，从旁边叠着的衣服堆里拿起了一件带补丁的深灰色厚棉坎肩。那是瓦西里生前干活时常穿的。</p><p><b>旁白 / 阿列克谢</b>  费奥多尔把坎肩披在了阿列克谢不住发抖的肩膀上。</p><p><b>费奥多尔</b>  他临死前喊渴，你记着这声渴就行。别拿‘他是疯子’来安慰自己，那是我儿子。</p><p><b>旁白 / 阿列克谢</b>  老人指了指阿列克谢怀里露出一角的工作日志。</p><p><b>费奥多尔</b>  他叫瓦西里·费奥多罗维奇。写进去。写他是个活人，二十岁，机务段的三级司炉工。等全城的门砸开那天，你当着大伙的面，把他的名字念出来。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢跪在地上，眼泪混着血水砸在冰面上。他翻开日志背面，在谢尔盖的名字下方，一笔一划地写下了瓦西里的全名。</p><details class="translation"><summary>English</summary><p>Late at night, two days later. The temperature has fallen to minus thirty-four.</p><p>Running a high fever, Aleksei returns alone to the kitchen of the East Street Workers&#x27; Canteen. Inside his padded coat he carries three small bags of rye flour, traded on the black market for two bottles of high-purity medical alcohol.</p><p>The water on the kitchen floor has frozen into solid black ice. Old Fyodor sits beside the stove in an old sheepskin coat. Vasily&#x27;s body has been laid out on the table under a faded coarse canvas, leaving a pair of feet in broken rubber shoes exposed.</p><p>Aleksei comes up to the old man; his legs give way, and he kneels on the ice crusted over with dried blood.</p><p>Uncle Fyodor... beat me to death. Vasily slipped as he came at me... I had the crowbar in my hand; I could have smashed his knees... but I was afraid. I took the easy way — the cleaver.</p><p>For a long time the old man says nothing. The only sound in the room is the north wind whining down the chimney.</p><p>After a long while, a rough hand, calloused with old burns, settles on Aleksei&#x27;s snow-wet head. The old man takes up no knife, nor does he fling the flour away. He rises, walks over to Vasily&#x27;s body, and from the pile of folded clothes beside it takes a patched, dark-grey, thickly padded vest — the one Vasily used to wear for his work.</p><p>Fyodor lays the vest over Aleksei&#x27;s ceaselessly trembling shoulders.</p><p>He cried out for water as he died. Just hold on to that thirst. Don&#x27;t comfort yourself with “he had gone mad.” He was my son.</p><p>The old man points at the corner of the work logbook showing inside Aleksei&#x27;s coat.</p><p>His name was Vasily Fyodorovich. Write it in. Write that he was a living man, twenty years old, a third-grade fireman in the locomotive depot. On the day the doors of every city building are beaten down, you stand before the crowd and say his name aloud.</p><p>Aleksei remains on his knees, tears mingled with blood striking the ice. He turns the logbook over and, beneath Sergei&#x27;s name, writes out Vasily&#x27;s full name, stroke by careful stroke.</p></details><p class="caption"></p></details>
<details class="record" id="script-2-4" data-group="文学剧本" data-search="旧疗养院与《回退手稿》 文学剧本 2-4 / 文学底稿（可与战役对白对照） "><summary><strong>旧疗养院与《回退手稿》</strong><span>2-4 / 文学底稿（可与战役对白对照）</span></summary><p><b>旁白 / 阿列克谢</b>  旧传染病疗养院地下二层。</p><p><b>旁白 / 阿列克谢</b>  这里曾经是结核病隔离病区，阴暗潮湿的水泥墙上结满了白色的硝霜。空气中弥漫着高浓度石炭酸与腐烂组织的怪味。</p><p><b>旁白 / 阿列克谢</b>  阿列克谢穿过堆满铁架床的走廊，在一间焊着厚铁栏杆的配药室里见到了前铁路医院副院长梁诺夫医生，以及他的学生、流调员古丽娅。</p><p><b>旁白 / 阿列克谢</b>  在靠墙的一张铁床上，用医用牛皮带死死绑着一个年轻女孩。女孩整整昏迷了三天，手腕被皮带磨得皮开肉绽。但此刻，她身上的高热正在消退，原本硬化如蛇皮的灰白角质正大片大片地从胸口和颈部剥落，露出底下粉红色的新生皮肤。女孩正发出虚弱但均匀的呼吸声。</p><p><b>旁白 / 阿列克谢</b>  古丽娅医师眼睛通红，手里紧紧攥着三页薄薄的病历纸，纸角浸透了黄褐色的药水污渍。</p><p><b>古丽娅</b> （把病历纸塞到阿列克谢眼前，手指由于激动而泛白） 第三十七例！阿廖沙，这是第三十七例完整记录！只要给他们水，熬过第四天的高热神经风暴，灰鳞就会剥落！这不是绝症，它是一种远古孢子引发的急性自限性肺泡炎！人能自己挺过来！</p><p><b>旁白 / 阿列克谢</b>  阿列克谢接过那三页《回退临床手稿》。上面的每一行数据、每一个体温曲线，都用蓝黑墨水记录得清清楚楚。但在最后一页的末尾，盖着一个刺眼的红色长方形印章：【退回 · 结论含有动摇防线内容 · 不予归档】。</p><p><b>梁诺夫医生</b> （坐在药箱上，用止血钳夹着棉球擦拭眼镜） 三天前，我把手稿交给了督察专员。他甚至没翻开第二页，直接当着我的面扔进了碎纸炉。他说：‘梁诺夫同志，布拉风号已经拉走了四千人，乌拉尔山线已经平了四千笔账。如果你的报告是真的，那四千个被销账的人算什么？’</p><p><b>旁白 / 阿列克谢</b>  老医生的手停在半空，眼眶凹陷。</p><p><b>梁诺夫医生</b>  他们不是不知道人能好起来。他们是不能让活着的人好起来。活着的人一退烧，他们手里的枪和单子就全成了杀人罪证。</p><p><b>旁白 / 阿列克谢</b>  铁床上的女孩突然发出了一声微弱的呻吟。阿列克谢猛地转过头——那是安娜（档案号 0419）。</p><p><b>旁白 / 阿列克谢</b>  安娜艰难地睁开眼睛，瞳孔清澈透明。她看着阿列克谢胸前挂着的铁路调度工牌，又看了看阿列克谢大衣口袋里露出的妹妹照片，干裂的嘴唇吃力地开合：</p><p><b>安娜</b>  ……照片……0420……是拉娜护士吗？</p><p><b>旁白 / 阿列克谢</b>  阿列克谢像触电一样冲到铁床边，单膝跪地。</p><p><b>阿列克谢</b>  你见过她？！拉娜在哪儿？！</p><p><b>安娜</b>  在第三节车厢……三天前，我们在同一个留观站……她帮我把水壶藏在靴筒里……她手上的灰鳞也掉了，她一直在哭，她说她哥在货运站，她哥一定会去接她……然后清杀队就来了，把我们像牲口一样赶上了铁皮车……我因为休克被当成死人扔下了站台……她还在车里……</p><details class="translation"><summary>English</summary><p>Old Infectious Disease Sanatorium, second basement level.</p><p>This was once a tuberculosis isolation ward; white nitrate frost has bloomed across the dark, damp concrete. The air is heavy with the strange reek of strong carbolic acid and rotting tissue.</p><p>Aleksei passes down a corridor heaped with iron-framed beds and finds Dr. Leonov, former deputy director of the railway hospital, together with his student, the
