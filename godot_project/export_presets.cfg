; 《Z年纪事：凛冬铁轨》导出预设 — Windows Desktop (x86_64)
;
; 格式依据（Godot 4.7.2-stable 源码，非猜测）：
;   editor/export/editor_export.cpp  -> [preset.N] / [preset.N.options] 键名与 export_filter 取值
;   platform/windows/export/export.cpp -> 平台名 "Windows Desktop"
;   platform/windows/export/export_plugin.cpp + editor/export/editor_export_platform_pc.cpp
;                                          -> options 键与默认值
; 主场景由 project.godot:20 run/main_scene="res://scenes/campaign.tscn" 决定，
; 导出预设不重复声明主场景。
; 导出命令（需先安装 4.7.2.stable 导出模板）：
;   godot_console.exe --headless --path . --export-release "Windows Desktop" build/win64/YearOfZ.exe
; 模板未安装时会报 "missing templates"，无法产出交付包。

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/story_dialogue.json,art/asset_manifest.json"
exclude_filter="art/generation_runs/*,art/*/generation_runs/*"
export_path="build/win64/YearOfZ.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
shader_baker/enabled=false
