<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>凛冬铁轨 · 夜潜地图设计图册</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#161c1e;color:#ede9da;font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif}header,main{max-width:1620px;margin:auto;padding:18px 3vw}header{border-bottom:1px solid #566262;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font:600 clamp(18px,2.2vw,29px)/1.3 Georgia,serif;margin:0;color:#efce91}h2{font-size:19px;margin:0 0 12px}select,button{background:#263033;color:inherit;border:1px solid #616d68;border-radius:3px;padding:7px;font:inherit}select{max-width:100%}button{cursor:pointer}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(245px,23%);gap:18px}.layers{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.layers label{padding:3px 7px;background:#253033;cursor:pointer;border-radius:3px}input{accent-color:#e7c084}aside{background:#20282b;padding:16px;align-self:start}p{margin:.5em 0 1em}ul{padding-left:18px}svg{background:#111719;display:block;width:100%;border:1px solid #66706a}svg g[role=button]{cursor:pointer}svg g[role=button]:focus{outline:2px solid white}.caption{color:#aab9b6;font-size:13px;margin:8px 0}hr{border:0;border-top:1px solid #465352;margin:15px 0}#detail{color:#efce91}#points{width:100%}header label{color:#aab9b6}@media(max-width:820px){header{align-items:start;flex-direction:column}main{grid-template-columns:1fr}}
</style><header><h1>凛冬铁轨 · 夜潜地图设计图册</h1><label>关卡　<select id="levels"></select></label></header>
<main><section><div class="layers" id="layers"></div><svg id="map" viewBox="0 0 624 351" aria-label="关卡俯视图"></svg><p class="caption">点击标记查看详情。虚线圈表示勘踏半径，巡逻线按默认路点及静态导航网格绘制；追击时角色会重新寻路。</p></section><aside><h2 id="title"></h2><p id="brief"></p><hr><h2>剧情与触发</h2><section id="story"></section><hr><h2>地图标记</h2><select aria-label="选择标记" id="points"></select><p id="detail"></p></aside></main>
<script id="data" type="application/json">/*MAP_DATA*/</script>
<script>
const maps=JSON.parse(document.getElementById('data').textContent);
const el=id=>document.getElementById(id),svg=el('map'),ns='http://www.w3.org/2000/svg';
const colors={'通行':'#52e4ba','人物':'#ff8681','巡逻':'#fe9e61','剧情':'#fdcf58','机关':'#bfa8ff','物资':'#8bdeed','贴画':'#f396cb','纪念物':'#b7c8ea','阻挡':'#f48278','夜景':'#cad3ea'};
const active=new Set(['通行','人物','巡逻','剧情','贴画']);let cur=0,sel=-1;
function option(label,value){return new Option(label,value)}
maps.forEach((r,i)=>el('levels').add(option(r.name,i)));el('levels').onchange=e=>{cur=+e.target.value;sel=-1;draw()};
for(const [kind,color] of Object.entries(colors)){let l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=active.has(kind);c.onchange=()=>{c.checked?active.add(kind):active.delete(kind);draw()};l.style.color=color;l.append(c,kind);el('layers').append(l)}
function node(tag,atts,parent=svg){let e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(atts))e.setAttribute(k,v);parent.append(e);return e}
function pick(i){sel=i;draw();el('points').value=i}
function draw(){const r=maps[cur];svg.replaceChildren();node('image',{href:r[active.has('夜景')?'night':'img'],width:624,height:351,preserveAspectRatio:'none'});
if(active.has('阻挡')){let path='';r.grid.forEach((line,y)=>{for(const m of line.matchAll(/#+/g)){const [w,h]=r.cell;path+='M'+m.index*w+' '+y*h+'h'+m[0].length*w+'v'+h+'h-'+m[0].length*w+'z'}});node('path',{d:path,fill:'#ee5969',opacity:0.44})}
el('title').textContent=r.name;el('brief').textContent=r.brief.join(' ');const story=el('story');story.replaceChildren();
function paragraph(s){let p=document.createElement('p');p.textContent=s;story.append(p)}
paragraph(r.story?'首次出发进入未完成的地点剧情《'+r.story+'》。':'此地点没有配置首次入场抉择。');
if(r.choices.length){let ul=document.createElement('ul');r.choices.forEach(s=>{let li=document.createElement('li');li.textContent=s;ul.append(li)});story.append(ul)}
if(r.id==='market')paragraph('母亲离世后，成功撤离或天亮返回可发现栖身处。靠近电台棚且持有广播信号标记时，登记广播事件，返回结算时判断。');
if(r.id==='coldstore')paragraph('首访可在封存箱取腹透液。北雨棚是可选线索，回家反馈取决于勘踏和实际带回的物资。');
const list=el('points');list.replaceChildren(option('选择地图标记…',-1));
r.marks.forEach((m,i)=>{list.add(option(m.kind+' · '+m.title,i));if(!active.has(m.kind)&&sel!==i)return;const c=colors[m.kind],g=node('g',{role:'button',tabindex:0,'aria-label':m.title});g.onclick=()=>pick(i);g.onkeydown=e=>{if(e.key==='Enter')pick(i)};node('title',{},g).textContent=m.title+' '+m.note;
if(m.path)node('polyline',{points:m.path.map(p=>p.join(',')).join(' '),fill:'none',stroke:c,'stroke-width':1.6,'stroke-dasharray':'4 2'},g);
if(m.radius)node('ellipse',{cx:m.p[0],cy:m.p[1],rx:m.radius[0],ry:m.radius[1],fill:c,'fill-opacity':0.05,stroke:c,'stroke-width':0.8,'stroke-dasharray':'3 3'},g);
node('circle',{cx:m.p[0],cy:m.p[1],r:i===sel?5.2:3.2,fill:c,stroke:i===sel?'white':'#142021','stroke-width':1.2},g);
if(m.kind==='通行'||sel===i)node('text',{x:Math.min(553,m.p[0]+5),y:Math.max(12,m.p[1]-5),fill:'white',stroke:'#151b1f','paint-order':'stroke','stroke-width':2.4,'font-size':9},g).textContent=m.title;});
list.value=sel;list.onchange=e=>pick(+e.target.value);const m=r.marks[sel];el('detail').textContent=m?[m.kind,m.title,m.note,m.trigger?'触发事件 '+m.trigger:'',m.requires?'需要状态 '+m.requires:''].filter(Boolean).join(' · '):'选择地图上的点或在清单中定位。';}
draw();
</script></html>
